              <div key={p.id} className="fila-partida" style={{ marginBottom: 8 }}>
                <Entrada defaultValue={p.concepto} placeholder="Concepto"
                  onBlur={(x) => x.target.value !== p.concepto &&
                    editarPartida(p.id, { concepto: x.target.value })} />
                <Entrada mono defaultValue={p.referencia || ""} placeholder="Referencia"
                  onBlur={(x) => x.target.value !== (p.referencia || "") &&
                    editarPartida(p.id, { referencia: x.target.value || null })} />
                <Entrada mono defaultValue={String(p.monto)} placeholder="0,00"
                  style={{ textAlign: "right" }}
                  onBlur={(x) => num0(x.target.value) !== Number(p.monto) &&
                    editarPartida(p.id, { monto: num0(x.target.value) })} />
                <button onClick={() => borrarPartida(p.id)}
                  style={{ border: "none", background: "transparent", cursor: "pointer", color: T.tenue }}>
                  <Ic n="Trash2" size={15} />
                </button>
              </div>
            ))}
            {(c.partidas_fijas || []).length === 0 && (
              <p style={{ fontSize: 12.5, color: T.tenue }}>Sin partidas fijas.</p>
            )}
          </div>
        ))}

        <div style={{ borderTop: `1px solid ${T.linea}`, paddingTop: 14, marginTop: 14 }}
          className="flex gap-2 flex-wrap items-end">
          <Campo label="Nueva categoría" ancho="260px">
            <Entrada value={nuevaCat} onChange={(x) => setNuevaCat(x.target.value)}
              placeholder="Servicios" />
          </Campo>
          <Boton tipo="suave" onClick={agregarCat}>Agregar</Boton>
        </div>
      </Tarjeta>

      {nuevoEd && <NuevoEdificio {...{ sb, org, notificar, fallo, recargarEdificios }}
        onCerrar={() => setNuevoEd(false)} />}
    </div>
  );
}

function NuevoEdificio({ sb, org, notificar, fallo, recargarEdificios, onCerrar }) {
  const [f, setF] = useState({ nombre: "", prefijo: "", mora: "0", tolerancia: "0,01" });
  const crear = async () => {
    if (!f.nombre.trim() || !f.prefijo.trim())
      return notificar("Hacen falta el nombre y el prefijo.", "error");
    const { data, error } = await sb.from("edificios").insert({
      org_id: org.id, nombre: f.nombre.trim(), prefijo_recibo: f.prefijo.trim().toUpperCase(),
      interes_mora: num0(f.mora), tolerancia_alicuota: num0(f.tolerancia) || 0.01,
      honorario_monto: 0 }).select("id").single();
    if (error) return fallo(error);
    notificar("Edificio creado."); onCerrar(); recargarEdificios(data.id);
  };
  return (
    <div onClick={onCerrar} style={{ position: "fixed", inset: 0, zIndex: 90,
      background: "rgba(73,59,52,.45)", display: "flex", alignItems: "center",
      justifyContent: "center", padding: 20 }}>
      <div onClick={(x) => x.stopPropagation()} style={{ background: T.lienzo,
        borderRadius: T.r, maxWidth: 500, width: "100%", boxShadow: T.sombraAlta, padding: 26 }}>
        <Titulo sub="Cada edificio lleva sus propias unidades, sus cobros y su numeración de recibos.">
          Otro edificio
        </Titulo>
        <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
          <div style={{ gridColumn: "1 / -1" }}>
            <Campo label="Nombre"><Entrada value={f.nombre}
              onChange={(x) => setF({ ...f, nombre: x.target.value })} /></Campo>
          </div>
          <Campo label="Prefijo del recibo"><Entrada mono value={f.prefijo}
            onChange={(x) => setF({ ...f, prefijo: x.target.value })} placeholder="CON2" /></Campo>
          <Campo label="Interés de mora %"><Entrada mono value={f.mora}
            onChange={(x) => setF({ ...f, mora: x.target.value })} /></Campo>
        </div>
        <div className="flex gap-2 justify-end mt-5">
          <Boton tipo="suave" onClick={onCerrar}>Cancelar</Boton>
          <Boton onClick={crear}>Crear</Boton>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════ */
ReactDOM.createRoot(document.getElementById("raiz")).render(<App />);
</script>
</body>
