                    <td style={{ width: 34 }}>
                      {!deVecitap && (
                        <button onClick={() => setBorrar(c)} title="Eliminar"
                          style={{ border: "none", background: "transparent", cursor: "pointer", color: T.tenue }}>
                          <Ic n="Trash2" size={15} />
                        </button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {conceptos.some((c) => c.bolsillo === "servicio") && (
          <div style={{ padding: "0 20px 18px" }}>
            <p style={{ fontSize: 12, color: T.tenue }}>
              El cobro del servicio lo define Vecitap desde su consola y no se puede editar
              ni apagar desde aquí. Aparece en el recibo para que el propietario sepa qué paga.
            </p>
          </div>
        )}
      </Tarjeta>

      <Tarjeta>
        <Titulo sub="Un fondo de reserva, una cuota extraordinaria, vigilancia adicional: todo se modela igual.">
          Agregar un cobro
        </Titulo>
        <div className="grid gap-3" style={{ gridTemplateColumns: "2fr 1fr 2fr 1fr 1fr auto", alignItems: "end" }}
          >
          <Campo label="Nombre en el recibo"><Entrada value={nuevo.nombre}
            onChange={(e) => setNuevo({ ...nuevo, nombre: e.target.value })}
            placeholder="Fondo de reserva" /></Campo>
          <Campo label="Bolsillo">
            <Selector value={nuevo.bolsillo} onChange={(e) => setNuevo({ ...nuevo, bolsillo: e.target.value })}>
              <option value="condominio">Condominio</option>
              <option value="administracion">Administración</option>
            </Selector>
          </Campo>
          <Campo label="Cómo se calcula">
            <Selector value={nuevo.modo} onChange={(e) => setNuevo({ ...nuevo, modo: e.target.value })}>
              {Object.entries(MODOS_COBRO).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
            </Selector>
          </Campo>
          <Campo label="Monto o %"><Entrada mono value={nuevo.monto}
            onChange={(e) => setNuevo({ ...nuevo, monto: e.target.value })} /></Campo>
          <Campo label="IVA %"><Entrada mono value={nuevo.iva}
            onChange={(e) => setNuevo({ ...nuevo, iva: e.target.value })} /></Campo>
          <Boton onClick={agregar}><Ic n="Plus" size={15} /> Agregar</Boton>
        </div>
      </Tarjeta>

      {borrar && <Confirmar titulo="Eliminar este cobro"
        texto={`"${borrar.nombre}" dejará de aparecer en los recibos que se emitan de ahora en adelante. Los recibos ya emitidos no cambian.`}
        boton="Eliminar" tono="peligro" onSi={eliminar} onNo={() => setBorrar(null)} />}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   CIERRE DEL MES
   Ya no calcula nada: abre, carga gastos y le pide a la base que
   cierre. La previa del reparto la devuelve simular_cierre(), para que
   lo que se ve antes de cerrar sea exactamente lo que se va a emitir.
   ══════════════════════════════════════════════════════════════ */
function CierreMes({ sb, org, edificio, unidades, conceptos, periodos, periodoAbierto,
                     tasa, notificar, fallo, recargar }) {
  const [gastos, setGastos] = useState([]);
  const [nuevo, setNuevo] = useState({ concepto: "", referencia: "", monto: "",
    tipo: "comun", unidad: "", bolsillo: "condominio", categoria: "" });
  const [categorias, setCategorias] = useState([]);
  const [abrir, setAbrir] = useState({ anio: new Date().getFullYear(),
    mes: new Date().getMonth() + 1, tasa: "", presupuesto: "" });
  const [correccion, setCorreccion] = useState({ presupuesto: "", tasa: "" });
  const [previa, setPrevia] = useState(null);
  const [simulable, setSimulable] = useState(true);
  const [confirma, setConfirma] = useState(null);
  const [ocupado, setOcupado] = useState(false);

  const usaPresupuesto = conceptos.some((c) => c.activo && c.modo.startsWith("presupuesto"));
  const usaGasto = conceptos.some((c) => c.activo && c.modo.startsWith("gasto"));
  const cerrados = periodos.filter((p) => p.estado === "cerrado");

  useEffect(() => {
    sb.from("categorias").select("id,nombre,orden").eq("edificio_id", edificio.id)
      .order("orden").then(({ data }) => setCategorias(data || []));
  }, [edificio]);

  useEffect(() => {
    if (!periodoAbierto) { setGastos([]); return; }
    setCorreccion({ presupuesto: periodoAbierto.presupuesto ?? "",
                    tasa: periodoAbierto.tasa_bcv ?? "" });
    cargarGastos();
  }, [periodoAbierto?.id]);

  const cargarGastos = async () => {
    const { data, error } = await sb.from("gastos")
      .select("id,concepto,referencia,monto,tipo,unidad_id,bolsillo,categoria_id")
      .eq("periodo_id", periodoAbierto.id).order("creado_en");
    if (error) return fallo(error);
    setGastos(data);
  };

  const comunes = gastos.filter((g) => g.tipo === "comun")
    .reduce((s, g) => s + Number(g.monto), 0);

  const abrirMes = async () => {
    setOcupado(true);
    const { error } = await sb.rpc("abrir_periodo", {
      p_edificio: edificio.id, p_anio: Number(abrir.anio), p_mes: Number(abrir.mes),
      p_etiqueta: `${MESES[Number(abrir.mes) - 1]} ${abrir.anio}`,
      // En blanco: el cierre toma la del BCV del último día del mes.
      p_tasa: num0(abrir.tasa) || 0,
      p_presupuesto: num(abrir.presupuesto) });
    setOcupado(false);
    if (error) return fallo(error);
    notificar("Mes abierto. Las partidas fijas entraron solas.");
    recargar();
  };

  const corregir = async () => {
    const { error } = await sb.from("periodos").update({
      presupuesto: num(correccion.presupuesto),
      tasa_bcv: num0(correccion.tasa) || 1 }).eq("id", periodoAbierto.id);
    if (error) return fallo(error);
    notificar("Mes actualizado."); recargar();
  };

  const agregarGasto = async () => {
    const monto = num(nuevo.monto);
    if (monto === null) return notificar("Falta el monto.", "error");
    if (nuevo.tipo === "directo" && !nuevo.unidad)
      return notificar("Un gasto directo tiene que decir a qué unidad se le carga.", "error");
    const { error } = await sb.from("gastos").insert({
      org_id: org.id, periodo_id: periodoAbierto.id,
      categoria_id: nuevo.categoria || null,
      concepto: nuevo.concepto.trim() || "Sin concepto",
      referencia: nuevo.referencia.trim() || null, monto,
      tipo: nuevo.tipo, unidad_id: nuevo.tipo === "directo" ? nuevo.unidad : null,
      bolsillo: nuevo.tipo === "directo" ? nuevo.bolsillo : "condominio" });
    if (error) return fallo(error);
    setNuevo({ ...nuevo, concepto: "", referencia: "", monto: "" });
    cargarGastos();
  };

  const quitarGasto = async (id) => {
    const { error } = await sb.from("gastos").delete().eq("id", id);
    if (error) return fallo(error);
    cargarGastos();
  };

  /* Las partidas fijas se comparan con lo ya cargado: se agregan las que
     faltan y se rellenan las que están en cero, sin pisar lo editado. */
  const traerFijas = async () => {
    const { data: pf, error } = await sb.from("partidas_fijas")
      .select("id,concepto,referencia,monto,categoria_id,categorias!inner(edificio_id)")
      .eq("categorias.edificio_id", edificio.id);
    if (error) return fallo(error);
    const clave = (x) => [x.categoria_id || "", (x.concepto || "").trim().toLowerCase(),
                          (x.referencia || "").trim().toLowerCase()].join("|");
    const actuales = new Map(gastos.filter((g) => g.tipo === "comun").map((g) => [clave(g), g]));
    const nuevas = [], rellenar = [];
    (pf || []).forEach((p) => {
      const g = actuales.get(clave(p));
      if (!g) nuevas.push({ org_id: org.id, periodo_id: periodoAbierto.id,
        categoria_id: p.categoria_id, concepto: p.concepto, referencia: p.referencia,
        monto: p.monto, tipo: "comun", bolsillo: "condominio" });
      else if (Number(g.monto) === 0 && Number(p.monto) !== 0) rellenar.push([g.id, p.monto]);
    });
    if (nuevas.length) {
      const { error: e1 } = await sb.from("gastos").insert(nuevas);
      if (e1) return fallo(e1);
    }
    for (const [id, monto] of rellenar) await sb.from("gastos").update({ monto }).eq("id", id);
    if (!nuevas.length && !rellenar.length) return notificar("No faltaba ninguna partida fija.");
    notificar(`${nuevas.length} partidas agregadas, ${rellenar.length} rellenadas.`);
    cargarGastos();
  };

  const simular = async () => {
    const { data, error } = await sb.rpc("simular_cierre", { p_periodo: periodoAbierto.id });
    if (error) {
      if (/does not exist|función|function/i.test(error.message)) { setSimulable(false); return; }
      return fallo(error);
    }
    setPrevia(data);
  };
  useEffect(() => { if (periodoAbierto && simulable) simular(); },
    [periodoAbierto?.id, gastos.length, periodoAbierto?.presupuesto]);

  const cerrar = async () => {
    setOcupado(true);
    const { data, error } = await sb.rpc("cerrar_periodo", { p_periodo: periodoAbierto.id });
    setOcupado(false); setConfirma(null);
    if (error) return fallo(error);
    const r = Array.isArray(data) ? data[0] : data;
    notificar(`${periodoAbierto.etiqueta} cerrado: ${r.recibos_emitidos} recibos por ${usd(r.total_facturado)}.`);
    recargar();
  };

  const reabrir = async () => {
    const ult = cerrados[0];
    setConfirma(null);
    if (!ult) return;
    const { error } = await sb.rpc("reabrir_periodo", { p_periodo: ult.id });
    if (error) return fallo(error);
    notificar(`${ult.etiqueta} reabierto. Sus recibos quedaron anulados.`);
    recargar();
  };

  return (
    <div className="grid gap-5">
      {!periodoAbierto ? (
        <Tarjeta>
          <Titulo sub={cerrados.length
            ? `El último cerrado fue ${cerrados[0].etiqueta}.`
            : "Todavía no se ha cerrado ningún mes en este edificio."}>
            Abrir un mes
          </Titulo>
          <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))" }}>
            <Campo label="Año"><Entrada mono value={abrir.anio}
              onChange={(e) => setAbrir({ ...abrir, anio: e.target.value })} /></Campo>
            <Campo label="Mes">
              <Selector value={abrir.mes} onChange={(e) => setAbrir({ ...abrir, mes: e.target.value })}>
                {MESES.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}
              </Selector>
            </Campo>
            <Campo label="Tasa BCV del mes"
              ayuda="Déjela en blanco y el sistema usa la del BCV del último día del mes.">
              <Entrada mono value={abrir.tasa} placeholder={tasa.valor ? nf(2).format(tasa.valor) : "0,00"}
                onChange={(e) => setAbrir({ ...abrir, tasa: e.target.value })} />
            </Campo>
            {usaPresupuesto && (
              <Campo label="Presupuesto del mes USD"
                ayuda="Este edificio reparte un presupuesto, no el gasto ejecutado.">
                <Entrada mono value={abrir.presupuesto} placeholder="5.630,15"
                  onChange={(e) => setAbrir({ ...abrir, presupuesto: e.target.value })} />
              </Campo>
            )}
          </div>
          <div style={{ marginTop: 16 }}>
            <Boton size="l" disabled={ocupado} onClick={abrirMes}>Abrir el mes</Boton>
          </div>
        </Tarjeta>
      ) : (
        <>
          <Tarjeta>
            <Titulo sub={usaPresupuesto
              ? "Se reparte el presupuesto. Los gastos se cargan igual, para la rendición y para ver el sobrante o el faltante."
              : "Se reparte lo que se gastó este mes."}
              accion={<Pastilla tono="marca">{periodoAbierto.etiqueta}</Pastilla>}>
              El mes abierto
            </Titulo>
            <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", alignItems: "end" }}>
              {usaPresupuesto && (
                <Campo label="Presupuesto del mes USD">
                  <Entrada mono value={correccion.presupuesto}
                    onChange={(e) => setCorreccion({ ...correccion, presupuesto: e.target.value })} />
                </Campo>
              )}
              <Campo label="Tasa BCV del mes">
                <Entrada mono value={correccion.tasa}
                  onChange={(e) => setCorreccion({ ...correccion, tasa: e.target.value })} />
              </Campo>
              <div><Boton tipo="suave" onClick={corregir}>Guardar</Boton></div>
            </div>
            {usaPresupuesto && !periodoAbierto.presupuesto && (
              <div style={{ marginTop: 14 }}>
                <Aviso tono="rojo" titulo="Falta el presupuesto">
                  Sin él la base rechaza el cierre.
                </Aviso>
              </div>
            )}
            {usaPresupuesto && periodoAbierto.presupuesto > 0 && (
              <div style={{ marginTop: 14 }}>
                <Aviso tono={comunes > periodoAbierto.presupuesto ? "ambar" : "verde"}
                  titulo={comunes > periodoAbierto.presupuesto ? "El mes va en déficit" : "El mes va con sobrante"}>
                  Presupuestado {usd(periodoAbierto.presupuesto)} · ejecutado {usd(comunes)} ·
                  diferencia {usd(periodoAbierto.presupuesto - comunes)}. Esto no lo mostraba
                  la planilla en ningún lado.
                </Aviso>
              </div>
            )}
          </Tarjeta>

          <Tarjeta pad={false}>
            <div style={{ padding: "20px 20px 0" }}>
              <Titulo sub="Los gastos comunes se reparten entre todos. Los directos se le cargan solo a una unidad."
                accion={<Boton tipo="suave" size="s" onClick={traerFijas}>
                  <Ic n="RotateCcw" size={14} /> Traer partidas fijas</Boton>}>
                Gastos del mes
              </Titulo>

              <div className="fila-gasto" style={{ marginBottom: 14 }}>
                <Campo label="Concepto"><Entrada value={nuevo.concepto}
                  onChange={(e) => setNuevo({ ...nuevo, concepto: e.target.value })}
                  placeholder="Vigilancia" /></Campo>
                <Campo label="Referencia"><Entrada mono value={nuevo.referencia}
                  onChange={(e) => setNuevo({ ...nuevo, referencia: e.target.value })} /></Campo>
                <Campo label="Categoría">
                  <Selector value={nuevo.categoria}
                    onChange={(e) => setNuevo({ ...nuevo, categoria: e.target.value })}>
                    <option value="">Sin categoría</option>
                    {categorias.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                  </Selector>
                </Campo>
                <Campo label="Tipo">
                  <Selector value={nuevo.tipo} onChange={(e) => setNuevo({ ...nuevo, tipo: e.target.value })}>
                    <option value="comun">Se reparte entre todos</option>
                    <option value="directo">Solo a una unidad</option>
                  </Selector>
                </Campo>
                <Campo label="Monto USD"><Entrada mono value={nuevo.monto}
                  onChange={(e) => setNuevo({ ...nuevo, monto: e.target.value })} /></Campo>
                <Boton onClick={agregarGasto}><Ic n="Plus" size={15} /></Boton>
              </div>

              {nuevo.tipo === "directo" && (
                <div className="fila-partida" style={{ marginBottom: 14 }}>
                  <Campo label="¿A qué unidad?">
                    <Selector value={nuevo.unidad} onChange={(e) => setNuevo({ ...nuevo, unidad: e.target.value })}>
                      <option value="">Elija la unidad</option>
                      {unidades.map((u) => <option key={u.id} value={u.id}>{u.codigo}</option>)}
                    </Selector>
                  </Campo>
                  <Campo label="¿De quién es ese dinero?"
                    ayuda="Una reparación es del condominio. Un recargo por gestión de cobranza es de quien administra.">
                    <Selector value={nuevo.bolsillo} onChange={(e) => setNuevo({ ...nuevo, bolsillo: e.target.value })}>
                      <option value="condominio">Condominio</option>
                      <option value="administracion">Administración</option>
                    </Selector>
                  </Campo>
                  <div /><div />
                </div>
              )}
            </div>

            <div className="scroll-x">
              <table>
                <thead><tr><th>Concepto</th><th>Tipo</th><th>Bolsillo</th>
                  <th style={{ textAlign: "right" }}>Monto</th><th></th></tr></thead>
                <tbody>
                  {gastos.map((g) => (
                    <tr key={g.id}>
                      <td>{g.concepto}
                        {g.referencia && <div style={{ fontSize: 11.5, color: T.tenue }} className="mono">
                          {g.referencia}</div>}
                      </td>
                      <td>{g.tipo === "comun" ? "común"
                        : `solo ${unidades.find((u) => u.id === g.unidad_id)?.codigo || "—"}`}</td>
                      <td>{BOLSILLOS[g.bolsillo]?.t || "Condominio"}</td>
                      <td className="mono" style={{ textAlign: "right" }}>{usd(g.monto)}</td>
                      <td style={{ width: 34 }}>
                        <button onClick={() => quitarGasto(g.id)}
                          style={{ border: "none", background: "transparent", cursor: "pointer", color: T.tenue }}>
                          <Ic n="Trash2" size={15} />
                        </button>
                      </td>
                    </tr>
                  ))}
                  <tr><td colSpan={3} style={{ fontWeight: 700 }}>Gastos comunes del mes</td>
                    <td className="mono" style={{ textAlign: "right", fontWeight: 700 }}>{usd(comunes)}</td>
                    <td /></tr>
                </tbody>
              </table>
            </div>
          </Tarjeta>

          {previa && previa.length > 0 && (
            <Tarjeta pad={false}>
              <div style={{ padding: "20px 20px 0" }}>
                <Titulo sub="Esto es exactamente lo que se va a emitir. Lo calcula la base, no el navegador.">
                  Cómo se reparte
                </Titulo>
              </div>
              <div className="scroll-x" style={{ maxHeight: 420 }}>
                <table>
                  <thead><tr><th>Unidad</th><th>Alícuota</th><th>Condominio</th>
                    <th>Administración</th><th>Servicio</th><th>Anterior</th><th>Mora</th>
                    <th style={{ textAlign: "right" }}>Total del recibo</th></tr></thead>
                  <tbody>
                    {previa.map((r) => (
                      <tr key={r.codigo}>
                        <td className="mono" style={{ fontWeight: 600 }}>{r.codigo}</td>
                        <td className="mono">{nf(5).format(r.alicuota)}</td>
                        <td className="mono">{usd(r.condominio)}</td>
                        <td className="mono">{usd(r.administracion)}</td>
                        <td className="mono">{usd(r.servicio)}</td>
                        <td className="mono">{usd(r.anterior)}</td>
                        <td className="mono">{usd(r.mora)}</td>
                        <td className="mono" style={{ textAlign: "right", fontWeight: 700 }}>{usd(r.total)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Tarjeta>
          )}

          {!simulable && (
            <Aviso tono="azul" titulo="La previa del reparto no está disponible">
              Falta instalar la función <b>simular_cierre</b> en la base (archivo 10). Sin ella
              no se puede mostrar el reparto sin emitir los recibos. El cierre funciona igual.
            </Aviso>
          )}

          <div className="flex gap-2 flex-wrap">
            <Boton size="l" disabled={ocupado}
              onClick={() => setConfirma({ que: "cerrar" })}>
              <Ic n="ReceiptText" size={16} /> Cerrar el mes y emitir recibos
            </Boton>
            {cerrados.length > 0 && (
              <Boton tipo="suave" onClick={() => setConfirma({ que: "reabrir" })}>
                <Ic n="RotateCcw" size={15} /> Reabrir {cerrados[0].etiqueta}
              </Boton>
            )}
          </div>
        </>
      )}

      {cerrados.length > 0 && (
        <Tarjeta pad={false}>
          <div style={{ padding: "20px 20px 0" }}><Titulo>Meses cerrados</Titulo></div>
          <div className="scroll-x">
            <table>
              <thead><tr><th>Mes</th><th style={{ textAlign: "right" }}>Presupuesto</th>
                <th style={{ textAlign: "right" }}>Gastos</th>
                <th style={{ textAlign: "right" }}>Tasa</th></tr></thead>
              <tbody>
                {cerrados.slice(0, 12).map((p) => (
                  <tr key={p.id}>
                    <td>{p.etiqueta}</td>
                    <td className="mono" style={{ textAlign: "right" }}>
                      {p.presupuesto ? usd(p.presupuesto) : "—"}</td>
                    <td className="mono" style={{ textAlign: "right" }}>{usd(p.total_gastos)}</td>
                    <td className="mono" style={{ textAlign: "right" }}>{nf(2).format(p.tasa_bcv)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Tarjeta>
      )}

      {confirma?.que === "cerrar" && <Confirmar titulo={`Cerrar ${periodoAbierto.etiqueta}`}
        texto="Se emiten los recibos de todas las unidades activas y se guarda la instantánea de saldos. Se puede reabrir después, pero los recibos emitidos quedarían anulados."
        boton="Cerrar y emitir" onSi={cerrar} onNo={() => setConfirma(null)} />}
      {confirma?.que === "reabrir" && <Confirmar titulo={`Reabrir ${cerrados[0].etiqueta}`}
        texto="Se anulan sus recibos y su instantánea. Si ya se los envió a los propietarios, van a tener un documento que dejó de existir."
        boton="Reabrir" tono="peligro" onSi={reabrir} onNo={() => setConfirma(null)} />}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   PAGOS
   ══════════════════════════════════════════════════════════════ */
/* Cada método se identifica con datos distintos. Un pago móvil sin el
   teléfono de origen es casi imposible de ubicar en el estado de cuenta. */
const PIDE = {
  "Pago móvil":     { banco:true, telefono:true, documento:true },
  "Transferencia":  { banco:true },
  "Zelle":          { correo:true },
  "Punto de venta": { banco:true },
};

function Pagos({ sb, org, edificio, unidades, tasa, notificar, fallo, recargar }) {
  const [pagos, setPagos] = useState([]);
  const [filtro, setFiltro] = useState("reportado");
  const [pest, setPest] = useState("registrar");
  const [f, setF] = useState({ unidad: "", fecha: hoyISO(), monto: "", moneda: "USD",
    metodo: "Pago móvil", destino: "condominio", referencia: "", banco: "",
    telefono: "", documento: "", correo: "" });
  // Tasa del BCV de la fecha del pago. No la elige nadie: la pone la base.
  // { tasa, fecha, propia, fuente } · propia = es la publicada ESE día,
  // no una heredada de un día anterior.
  const [tf, setTf] = useState(null);
  const [huecoTasa, setHuecoTasa] = useState("");
  const [guardandoTasa, setGuardandoTasa] = useState(false);
  const [ex, setEx] = useState({ unidad: "", monto: "", motivo: "", destino: "condominio" });
  const [bancos, setBancos] = useState([]);
  const [comps, setComps] = useState({});      // pago_id → ficha del comprobante
  const [viendo, setViendo] = useState(null);  // { url, tipo, pago }
  const [purga, setPurga] = useState(null);
  const [mov, setMov] = useState(null);
  const [mapa, setMapa] = useState(null);
  const [ocupado, setOcupado] = useState(false);

  const ids = useMemo(() => unidades.map((u) => u.id), [unidades]);
  const codigo = (id) => unidades.find((u) => u.id === id)?.codigo || "—";

  const cargar = async () => {
    if (!ids.length) return;
    const { data, error } = await sb.from("pagos")
      .select("id,unidad_id,fecha,monto,moneda,tasa_aplicada,monto_usd,metodo,destino," +
              "referencia,banco,banco_codigo,telefono_origen,documento_origen," +
              "correo_origen,reportado_por,estado,periodo_cierre_id,nota")
      .in("unidad_id", ids).order("fecha", { ascending: false }).limit(300);
    if (error) return fallo(error);
    setPagos(data);
  };
  useEffect(() => { cargar(); }, [ids.length]);

  useEffect(() => {
    sb.from("bancos").select("codigo,nombre,corto").eq("activo", true).order("orden")
      .then(({ data }) => setBancos(data || []));
  }, []);

  // Fichas de los comprobantes de estas unidades. La imagen no se trae
  // aquí: se pide una dirección temporal solo cuando alguien la abre.
  const cargarComprobantes = async () => {
    if (!ids.length) return;
    const { data } = await sb.from("comprobantes")
      .select("id,pago_id,ruta,tipo,bytes,sha256,subido_en,imagen_borrada_en")
      .in("unidad_id", ids).limit(500);
    const m = {};
    (data || []).forEach((c) => { m[c.pago_id] = c; });
    setComps(m);
  };
  useEffect(() => { cargarComprobantes(); }, [ids.length]);

  const verComprobante = async (p) => {
    const c = comps[p.id];
    if (!c) return;
    if (c.imagen_borrada_en)
      return notificar("La imagen de ese comprobante ya venció y se borró. " +
                       "Queda su huella digital para comprobarlo.", "error");
    const { data, error } = await sb.storage.from("comprobantes")
      .createSignedUrl(c.ruta, 120);
    if (error) return fallo(error);
    setViendo({ url: data.signedUrl, tipo: c.tipo, pago: p, ficha: c });
  };

  // Imágenes vencidas: conciliadas hace más de 3 meses y con el mes ya
  // cerrado. Se borra el archivo; el pago, su referencia y la huella
  // del comprobante se quedan para siempre.
  const purgarVencidos = async () => {
    const { data, error } = await sb.rpc("comprobantes_caducados");
    if (error) return fallo(error);
    if (!data || !data.length) { setPurga(0); return notificar("No hay imágenes vencidas."); }
    const rutas = data.map((x) => x.ruta);
    const { error: e2 } = await sb.storage.from("comprobantes").remove(rutas);
    if (e2) return fallo(e2);
    for (const x of data) await sb.rpc("marcar_comprobante_borrado", { p_id: x.id });
    setPurga(data.length);
    notificar(`${data.length} imágenes vencidas borradas.`);
    cargarComprobantes();
  };

  const verTasa = async () => {
    const { data } = await sb.rpc("tasa_de_esa_fecha", { p_fecha: f.fecha });
    const r = Array.isArray(data) ? data[0] : data;
    setTf(r && Number(r.tasa) > 0 ? { ...r, tasa: Number(r.tasa) } : null);
  };
  useEffect(() => {
    if (f.moneda !== "VES") { setTf(null); return; }
    verTasa();
  }, [f.fecha, f.moneda]);

  const guardarHueco = async () => {
    const v = num(huecoTasa);
    if (!v || v <= 0) return notificar("La tasa no se entiende.", "error");
    setGuardandoTasa(true);
    const { error } = await sb.rpc("completar_tasa", { p_fecha: f.fecha, p_tasa: v });
    setGuardandoTasa(false);
    if (error) return fallo(error);
    setHuecoTasa("");
    notificar(`Tasa del ${f.fecha} guardada. Queda registrada a su nombre.`);
    verTasa();
  };

  const registrar = async () => {
    if (!f.unidad) return notificar("Elija la unidad.", "error");
    const monto = num(f.monto);
    if (monto === null || monto <= 0) return notificar("El monto no se entiende.", "error");
    if (f.moneda === "VES" && !tf)
      return notificar("No hay tasa del BCV para esa fecha. Cárguela abajo.", "error");
    setOcupado(true);
    // monto_usd y tasa_aplicada los calcula la base con la tasa del día del
    // pago. Mandarlos desde aquí sería dejar que el navegador decida cuánto
    // vale un pago, y el navegador se puede manipular.
    const { error } = await sb.from("pagos").insert({
      org_id: org.id, unidad_id: f.unidad, fecha: f.fecha, monto,
      moneda: f.moneda, monto_usd: 0, metodo: f.metodo,
      destino: f.destino, referencia: f.referencia.trim() || null,
      banco_codigo: (PIDE[f.metodo] || {}).banco ? (f.banco || null) : null,
      telefono_origen:  (PIDE[f.metodo] || {}).telefono  ? f.telefono.trim()  : null,
      documento_origen: (PIDE[f.metodo] || {}).documento ? f.documento.trim() : null,
      correo_origen:    (PIDE[f.metodo] || {}).correo    ? f.correo.trim()    : null,
      estado: "reportado" });
    setOcupado(false);
    if (error) return fallo(error);
    setF({ ...f, monto: "", referencia: "" });
    notificar("Pago registrado como reportado. Falta conciliarlo.");
    cargar();
  };

  const cambiarEstado = async (p, estado) => {
    const campos = estado === "conciliado"
      ? { estado, conciliado_en: new Date().toISOString() }
      : { estado };
    const { error } = await sb.from("pagos").update(campos).eq("id", p.id);
    if (error) return fallo(error);
    cargar(); recargar();
  };

  const exonerar = async () => {
    if (!ex.unidad) return notificar("Elija la unidad.", "error");
    const monto = num(ex.monto);
    if (monto === null || monto === 0) return notificar("El monto no se entiende.", "error");
    if (!ex.motivo.trim()) return notificar("Escriba el motivo: queda en la auditoría.", "error");
    const { error } = await sb.from("ajustes").insert({
      org_id: org.id, unidad_id: ex.unidad, fecha: hoyISO(), monto,
      motivo: ex.motivo.trim(), destino: ex.destino });
    if (error) return fallo(error);
    setEx({ ...ex, monto: "", motivo: "" });
    notificar("Exoneración registrada."); cargar(); recargar();
  };

  /* ── Conciliación contra el archivo del banco ── */
  const leerBanco = async (file) => {
    if (!file) return;
    try {
      let filas, encabezados;
      if (/\.pdf$/i.test(file.name)) {
        setMov(movimientosDesdeLineas(await leerPDF(file)));
        setMapa(null);
        return;
      }
      const crudas = await leerTabla(file);
      encabezados = crudas[0] || [];
      filas = crudas.slice(1);
      const m = detectarColumnas(encabezados, filas);
      setMapa({ ...m, encabezados });
      setMov(filas.map((fila) => ({
        fecha: m.fecha > -1 ? String(fila[m.fecha] || "") : "",
        referencia: m.referencia > -1 ? extraerRef(fila[m.referencia]) : "",
        monto: m.monto > -1 ? parseMonto(fila[m.monto]) : null,
        descripcion: m.descripcion > -1 ? String(fila[m.descripcion] || "") : "",
      })).filter((x) => x.referencia || x.monto !== null));
    } catch (e) { fallo(e); }
  };

  const cruce = useMemo(() => {
    if (!mov) return null;
    const reportados = pagos.filter((p) => p.estado === "reportado");
    const casan = [], dudosos = [], huerfanos = [];
    const usados = new Set();
    mov.forEach((m) => {
      const cand = reportados.find((p) => {
        if (usados.has(p.id)) return false;
        const a = String(p.referencia || ""), b = String(m.referencia || "");
        if (!a || !b) return false;
        return a === b || a.endsWith(b) || b.endsWith(a);
      });
      if (!cand) { huerfanos.push(m); return; }
      usados.add(cand.id);
      const dif = Math.abs(Number(cand.monto) - Number(m.monto || 0));
      const tol = Math.max(1, Number(cand.monto) * 0.01);
      (dif <= tol ? casan : dudosos).push({ mov: m, pago: cand, dif });
    });
    return { casan, dudosos, huerfanos,
      sinCruzar: reportados.filter((p) => !usados.has(p.id)) };
  }, [mov, pagos]);

  const conciliarLote = async () => {
    setOcupado(true);
    for (const c of cruce.casan) {
      const { error } = await sb.from("pagos").update({ estado: "conciliado",
        conciliado_en: new Date().toISOString(),
        banco: c.pago.banco || null }).eq("id", c.pago.id);
      if (error) { setOcupado(false); return fallo(error); }
    }
    setOcupado(false);
    notificar(`${cruce.casan.length} pagos conciliados.`);
    setMov(null); cargar(); recargar();
  };

  const visibles = pagos.filter((p) => filtro === "todos" || p.estado === filtro);

  return (
    <div className="grid gap-5">
      <div className="flex gap-2 flex-wrap">
        {[["registrar", "Registrar"], ["conciliar", "Conciliar con el banco"],
          ["exonerar", "Exoneraciones"]].map(([k, t]) => (
          <Boton key={k} size="s" tipo={pest === k ? "oscuro" : "suave"}
            onClick={() => setPest(k)}>{t}</Boton>
        ))}
      </div>

      {pest === "registrar" && (
        <Tarjeta>
          <Titulo sub="Un pago entra como reportado y no baja el saldo hasta que se confirme que el dinero llegó.">
            Registrar un pago
          </Titulo>
          <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))" }}>
            <Campo label="Unidad">
              <Selector value={f.unidad} onChange={(e) => setF({ ...f, unidad: e.target.value })}>
                <option value="">Elija</option>
                {unidades.map((u) => <option key={u.id} value={u.id}>{u.codigo}</option>)}
              </Selector>
            </Campo>
            <Campo label="Fecha del pago">
              <Entrada type="date" value={f.fecha} onChange={(e) => setF({ ...f, fecha: e.target.value })} />
            </Campo>
            <Campo label="Moneda">
              <Selector value={f.moneda} onChange={(e) => setF({ ...f, moneda: e.target.value })}>
                <option value="USD">Dólares</option><option value="VES">Bolívares</option>
              </Selector>
            </Campo>
            <Campo label={f.moneda === "VES" ? "Monto en Bs" : "Monto en USD"}>
              <Entrada mono value={f.monto} onChange={(e) => setF({ ...f, monto: e.target.value })} />
            </Campo>
            {f.moneda === "VES" && (
              <Campo label="Tasa del BCV de esa fecha"
                ayuda={tf && tf.propia ? (tf.fuente === "dolarapi" ? "publicada ese día" : "cargada a mano")
                      : tf ? `no hay publicación de ese día: se usa la del ${tf.fecha}`
                      : "no hay ninguna tasa de ese día ni anterior"}>
                <div className="mono" style={{ padding: "9px 11px", borderRadius: 8,
                  border: `1px solid ${T.linea}`, background: T.fondo2,
                  color: tf ? T.tinta : T.rojo, fontSize: 13.5 }}>
                  {tf ? nf(2).format(tf.tasa) : "sin tasa"}
                </div>
              </Campo>
            )}
            <Campo label="Método">
              <Selector value={f.metodo} onChange={(e) => setF({ ...f, metodo: e.target.value })}>
                {METODOS.map((m) => <option key={m}>{m}</option>)}
              </Selector>
            </Campo>
            <Campo label="Abona a">
              <Selector value={f.destino} onChange={(e) => setF({ ...f, destino: e.target.value })}>
                <option value="condominio">Condominio</option>
                <option value="honorarios">Administración</option>
                <option value="servicio">Servicio</option>
              </Selector>
            </Campo>
            <Campo label="Referencia"><Entrada mono value={f.referencia}
              onChange={(e) => setF({ ...f, referencia: e.target.value })} /></Campo>
            {(PIDE[f.metodo] || {}).banco && (
              <Campo label="Banco de origen">
                <Selector value={f.banco} onChange={(e) => setF({ ...f, banco: e.target.value })}>
                  <option value="">Elija</option>
                  {bancos.map((b) => (
                    <option key={b.codigo} value={b.codigo}>{b.codigo} · {b.corto || b.nombre}</option>))}
                </Selector>
              </Campo>
            )}
            {(PIDE[f.metodo] || {}).telefono && (
              <Campo label="Teléfono de origen" ayuda="Es lo que aparece en el estado de cuenta.">
                <Entrada mono value={f.telefono} placeholder="04121234567"
                  onChange={(e) => setF({ ...f, telefono: e.target.value })} />
              </Campo>
            )}
            {(PIDE[f.metodo] || {}).documento && (
              <Campo label="Cédula o RIF del que paga">
                <Entrada mono value={f.documento}
                  onChange={(e) => setF({ ...f, documento: e.target.value })} />
              </Campo>
            )}
            {(PIDE[f.metodo] || {}).correo && (
              <Campo label="Correo de origen">
                <Entrada value={f.correo}
                  onChange={(e) => setF({ ...f, correo: e.target.value })} />
              </Campo>
            )}
          </div>
          {f.moneda === "VES" && num(f.monto) && tf && (
            <p style={{ fontSize: 12.5, color: T.tinta2, marginTop: 10 }}>
              Equivale a <b>{usd(num(f.monto) / tf.tasa)}</b> a la tasa del BCV
              del {tf.fecha}. Vale esa y no la de hoy: si el propietario transfirió
              el lunes y usted concilia el jueves, cobrarle a tasa de jueves sería
              cobrarle de más.
            </p>
          )}

          {f.moneda === "VES" && (!tf || !tf.propia) && (
            <div style={{ marginTop: 12, padding: "12px 14px", borderRadius: 8,
              border: `1px solid ${T.linea}`, background: T.fondo2 }}>
              <div style={{ fontSize: 12.5, color: T.tinta2, marginBottom: 8, lineHeight: 1.55 }}>
                {tf
                  ? <>No hay tasa publicada del <b>{f.fecha}</b>. Si fue sábado, domingo o
                      feriado está bien usar la del {tf.fecha}. Si fue día hábil y usted tiene
                      la del BCV de ese día, cárguela.</>
                  : <>No hay ninguna tasa del <b>{f.fecha}</b> ni anterior. Cargue la del BCV
                      de ese día para poder registrar el pago.</>}
                <br />
                <span style={{ color: T.tenue }}>
                  Solo se puede rellenar un día vacío. Un día que ya tiene tasa no lo cambia
                  nadie desde aquí. Queda registrado que la cargó usted.
                </span>
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "flex-end", flexWrap: "wrap" }}>
                <div style={{ width: 170 }}>
                  <Entrada mono value={huecoTasa} placeholder="Bs por dólar"
                    onChange={(e) => setHuecoTasa(e.target.value)} />
                </div>
                <Boton tipo="suave" size="s" disabled={guardandoTasa} onClick={guardarHueco}>
                  Guardar la tasa del {f.fecha}
                </Boton>
              </div>
            </div>
          )}
          <div style={{ marginTop: 16 }}>
            <Boton disabled={ocupado} onClick={registrar}>Registrar como reportado</Boton>
          </div>
        </Tarjeta>
      )}

      {pest === "exonerar" && (
        <Tarjeta>
          <Titulo sub="Una exoneración baja el saldo sin que haya entrado dinero. Queda registrada en la auditoría con su motivo.">
            Exoneración o nota de crédito
          </Titulo>
          <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))" }}>
            <Campo label="Unidad">
              <Selector value={ex.unidad} onChange={(e) => setEx({ ...ex, unidad: e.target.value })}>
                <option value="">Elija</option>
                {unidades.map((u) => <option key={u.id} value={u.id}>{u.codigo}</option>)}
              </Selector>
            </Campo>
            <Campo label="Monto USD" ayuda="Positivo baja la deuda. Negativo la sube.">
              <Entrada mono value={ex.monto} onChange={(e) => setEx({ ...ex, monto: e.target.value })} />
            </Campo>
            <Campo label="Aplica a">
              <Selector value={ex.destino} onChange={(e) => setEx({ ...ex, destino: e.target.value })}>
                <option value="condominio">Condominio</option>
                <option value="honorarios">Administración</option>
                <option value="servicio">Servicio</option>
              </Selector>
            </Campo>
            <div style={{ gridColumn: "1 / -1" }}>
              <Campo label="Motivo"><Entrada value={ex.motivo}
                onChange={(e) => setEx({ ...ex, motivo: e.target.value })}
                placeholder="Acuerdo de junta del 12 de marzo" /></Campo>
            </div>
          </div>
          <div style={{ marginTop: 16 }}><Boton onClick={exonerar}>Registrar</Boton></div>
        </Tarjeta>
      )}

      {pest === "conciliar" && (
        <>
          <Tarjeta>
            <Titulo sub="Suba el archivo del banco: Excel, CSV o PDF. Se cruza por referencia contra los pagos reportados.">
              Conciliar con el banco
            </Titulo>
            <input type="file" accept=".xlsx,.xls,.csv,.pdf"
              onChange={(e) => leerBanco(e.target.files?.[0])}
              style={{ ...estiloEntrada(false), padding: 10 }} />
            {mapa && (
              <div style={{ marginTop: 14 }} className="grid gap-3">
                <p style={{ fontSize: 12.5, color: T.tinta2 }}>
                  Columnas detectadas. Si adivinó mal, corríjalo aquí.
                </p>
                <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))" }}>
                  {["referencia", "monto", "fecha", "descripcion"].map((campo) => (
                    <Campo key={campo} label={campo}>
                      <Selector value={mapa[campo]} onChange={(e) => {
                        const m = { ...mapa, [campo]: Number(e.target.value) };
                        setMapa(m);
                      }}>
                        <option value={-1}>— ninguna —</option>
                        {(mapa.encabezados || []).map((h, i) =>
                          <option key={i} value={i}>{String(h || `columna ${i + 1}`)}</option>)}
                      </Selector>
                    </Campo>
                  ))}
                </div>
              </div>
            )}
          </Tarjeta>

          {cruce && (
            <>
              <div className="grid gap-4 apila-movil" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))" }}>
                <Metrica etiqueta="Cuadran" valor={String(cruce.casan.length)} tono="verde"
                  pie="misma referencia y mismo monto" />
                <Metrica etiqueta="Monto distinto" valor={String(cruce.dudosos.length)}
                  pie="la referencia coincide, el monto no" />
                <Metrica etiqueta="Del banco, sin pago reportado" valor={String(cruce.huerfanos.length)}
                  tono={cruce.huerfanos.length ? "rojo" : undefined}
                  pie="plata que entró y no se sabe de quién es" />
              </div>

              {cruce.casan.length > 0 && (
                <Tarjeta pad={false}>
                  <div style={{ padding: "20px 20px 0" }}>
                    <Titulo sub="Listos para conciliar de una vez.">Cuadran</Titulo>
                  </div>
                  <div className="scroll-x" style={{ maxHeight: 300 }}>
                    <table>
                      <thead><tr><th>Referencia</th><th>Unidad</th>
                        <th style={{ textAlign: "right" }}>Reportado</th>
                        <th style={{ textAlign: "right" }}>Banco</th></tr></thead>
                      <tbody>
                        {cruce.casan.map((c, i) => (
                          <tr key={i}>
                            <td className="mono">{c.mov.referencia}</td>
                            <td className="mono">{codigo(c.pago.unidad_id)}</td>
                            <td className="mono" style={{ textAlign: "right" }}>{nf(2).format(c.pago.monto)}</td>
                            <td className="mono" style={{ textAlign: "right" }}>{nf(2).format(c.mov.monto || 0)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div style={{ padding: 20, borderTop: `1px solid ${T.linea}` }}>
                    <Boton disabled={ocupado} onClick={conciliarLote}>
                      Conciliar {cruce.casan.length} pagos
                    </Boton>
                  </div>
                </Tarjeta>
              )}

              {cruce.huerfanos.length > 0 && (
                <Tarjeta pad={false}>
                  <div style={{ padding: "20px 20px 0" }}>
                    <Titulo sub="Entró dinero al banco y ningún propietario lo reportó. Hay que averiguar de quién es.">
                      Movimientos del banco sin pago reportado
                    </Titulo>
                  </div>
                  <div className="scroll-x" style={{ maxHeight: 300 }}>
                    <table>
                      <thead><tr><th>Fecha</th><th>Referencia</th><th>Descripción</th>
                        <th style={{ textAlign: "right" }}>Monto</th></tr></thead>
                      <tbody>
                        {cruce.huerfanos.map((m, i) => (
                          <tr key={i}>
                            <td className="mono">{m.fecha || "—"}</td>
                            <td className="mono">{m.referencia || "—"}</td>
                            <td style={{ fontSize: 12, color: T.tinta2 }}>
                              {(m.descripcion || "").slice(0, 70)}</td>
                            <td className="mono" style={{ textAlign: "right" }}>
                              {m.monto === null ? "—" : nf(2).format(m.monto)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </Tarjeta>
              )}
            </>
          )}
        </>
      )}

      {viendo && (
        <div onClick={() => setViendo(null)}
          style={{ position: "fixed", inset: 0, zIndex: 90, background: "rgba(0,0,0,.72)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 18 }}>
          <div onClick={(e) => e.stopPropagation()}
            style={{ background: "#fff", borderRadius: T.rp, maxWidth: 760, width: "100%",
              maxHeight: "92vh", overflow: "auto", padding: 18 }}>
            <div className="flex justify-between items-start gap-3" style={{ marginBottom: 12 }}>
              <div>
                <div style={{ fontWeight: 600 }}>
                  Comprobante · {codigo(viendo.pago.unidad_id)}</div>
                <div className="mono" style={{ fontSize: 12, color: T.tenue }}>
                  {viendo.pago.fecha} · {viendo.pago.metodo}
                  {viendo.pago.referencia ? ` · ref ${viendo.pago.referencia}` : ""}
                </div>
              </div>
              <Boton size="s" tipo="suave" onClick={() => setViendo(null)}>Cerrar</Boton>
            </div>
            {/^image\//.test(viendo.tipo)
              ? <img src={viendo.url} alt="Comprobante"
                  style={{ maxWidth: "100%", borderRadius: T.rs, display: "block" }} />
              : <iframe src={viendo.url} title="Comprobante"
                  style={{ width: "100%", height: "70vh", border: `1px solid ${T.linea}`,
                    borderRadius: T.rs }} />}
            <div style={{ fontSize: 11.5, color: T.tenue, marginTop: 10, wordBreak: "break-all" }}>
              Huella del archivo: <span className="mono">{viendo.ficha.sha256 || "sin huella"}</span>
              <br />
              Sirve para comprobar dentro de dos años que un comprobante que le muestren es
              exactamente este, aunque la imagen ya se haya borrado.
            </div>
          </div>
        </div>
      )}

      <Tarjeta pad={false}>
        <div style={{ padding: "20px 20px 0" }}>
          <Titulo accion={
            <div className="flex gap-2 flex-wrap">
              {[["reportado", "Reportados"], ["conciliado", "Conciliados"],
                ["anulado", "Anulados"], ["todos", "Todos"]].map(([k, t]) => (
                <Boton key={k} size="s" tipo={filtro === k ? "oscuro" : "suave"}
                  onClick={() => setFiltro(k)}>{t}</Boton>
              ))}
            </div>
          }>Movimientos registrados</Titulo>
        </div>
        <div className="scroll-x">
          <table>
            <thead><tr><th>Fecha</th><th>Unidad</th><th>Método</th><th>Ref.</th>
              <th>Origen</th><th>Abona a</th><th style={{ textAlign: "right" }}>USD</th>
              <th>Estado</th><th></th></tr></thead>
            <tbody>
              {visibles.map((p) => (
                <tr key={p.id}>
                  <td className="mono">{p.fecha}</td>
                  <td className="mono">{codigo(p.unidad_id)}</td>
                  <td>{p.metodo}{p.moneda === "VES" &&
                    <div style={{ fontSize: 11.5, color: T.tenue }} className="mono">
                      {bs(p.monto)} a {nf(2).format(p.tasa_aplicada)}</div>}</td>
                  <td className="mono">{p.referencia || "—"}</td>
                  <td style={{ fontSize: 12 }}>
                    {p.banco || <span style={{ color: T.tenue }}>—</span>}
                    {p.telefono_origen && <div className="mono" style={{ color: T.tenue }}>
                      {p.telefono_origen}</div>}
                    {p.correo_origen && <div style={{ color: T.tenue }}>{p.correo_origen}</div>}
                    {comps[p.id] && (
                      <Boton size="s" tipo="fantasma" style={{ padding: "3px 0", fontSize: 12 }}
                        onClick={() => verComprobante(p)}>
                        {comps[p.id].imagen_borrada_en ? "comprobante vencido" : "ver comprobante"}
                      </Boton>
                    )}
                  </td>
                  <td>{BOLSILLOS[p.destino === "honorarios" ? "administracion" : p.destino]?.t}</td>
                  <td className="mono" style={{ textAlign: "right", fontWeight: 600 }}>{usd(p.monto_usd)}</td>
                  <td>
                    <Pastilla size="s" tono={p.estado === "conciliado" ? "verde"
                      : p.estado === "anulado" ? "rojo" : "ambar"}>
                      {p.estado}{p.periodo_cierre_id ? " · en cierre" : ""}
                    </Pastilla>
                  </td>
                  <td style={{ width: 150 }}>
                    {p.estado === "reportado" && (
                      <div className="flex gap-1 flex-wrap">
                        <Boton size="s" onClick={() => cambiarEstado(p, "conciliado")}>Conciliar</Boton>
                        <Boton size="s" tipo="suave" onClick={() => cambiarEstado(p, "anulado")}>Anular</Boton>
                      </div>
                    )}
                    {p.estado === "conciliado" && !p.periodo_cierre_id && (
                      <Boton size="s" tipo="suave" onClick={() => cambiarEstado(p, "anulado")}>Anular</Boton>
                    )}
                    {p.periodo_cierre_id && (
                      <span style={{ fontSize: 11.5, color: T.tenue }}>
                        ya está dentro de un cierre
                      </span>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {visibles.length === 0 && (
            <div style={{ padding: 34, textAlign: "center", color: T.tenue, fontSize: 14 }}>
              No hay pagos con ese filtro.
            </div>
          )}
        </div>
      </Tarjeta>

      <Tarjeta>
        <Titulo sub="Las imágenes de los comprobantes se borran a los 3 meses de conciliado el pago y con el mes ya cerrado. El pago, su referencia y la huella del archivo se quedan para siempre: la evidencia sobrevive al borrado.">
          Comprobantes vencidos
        </Titulo>
        <div className="flex gap-3 items-center flex-wrap">
          <Boton tipo="suave" onClick={purgarVencidos}>Borrar las imágenes vencidas</Boton>
          {purga !== null && (
            <span style={{ fontSize: 13, color: T.tinta2 }}>
              {purga === 0 ? "No había ninguna." : `${purga} borradas.`}
            </span>
          )}
        </div>
      </Tarjeta>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   ACCESOS · quién entra a cada unidad y qué ve
   ══════════════════════════════════════════════════════════════ */
function Accesos({ sb, org, edificio, unidades, notificar, fallo, recargar }) {
  const [pest, setPest] = useState("invitar");
  const [f, setF] = useState({ unidad: "", correo: "", relacion: "propietario" });
  const [codigo, setCodigo] = useState(null);
  const [invs, setInvs] = useState([]);
  const [gente, setGente] = useState([]);
  const [ocupado, setOcupado] = useState(false);

  const cargar = async () => {
    const a = await sb.rpc("invitaciones_de", { p_org: org.id });
    if (a.error) return fallo(a.error);
    setInvs(a.data || []);
    if (!edificio) return;
    const b = await sb.rpc("residentes_de", { p_edificio: edificio.id });
    if (b.error) return fallo(b.error);
    setGente(b.data || []);
  };
  useEffect(() => { cargar(); }, [org.id, edificio?.id]);

  const invitar = async () => {
    if (!f.unidad) return notificar("Elija la unidad.", "error");
    if (!/.+@.+\..+/.test(f.correo.trim())) return notificar("Ese correo no se entiende.", "error");
    setOcupado(true);
    const { data, error } = await sb.rpc("crear_invitacion", {
      p_org: org.id, p_correo: f.correo.trim().toLowerCase(), p_rol: "residente",
      p_edificio: null, p_unidad: f.unidad, p_relacion: f.relacion });
    setOcupado(false);
    if (error) return fallo(error);
    setCodigo({ token: data, correo: f.correo.trim().toLowerCase() });
    setF({ ...f, correo: "" });
    cargar();
  };

  const revocar = async (id) => {
    const { error } = await sb.rpc("revocar_invitacion", { p_id: id });
    if (error) return fallo(error);
    notificar("Invitación revocada."); cargar();
  };

  const cambiarNivel = async (unidad_id, nivel) => {
    const { error } = await sb.from("unidades")
      .update({ inquilino_ve: nivel }).eq("id", unidad_id);
    if (error) return fallo(error);
    notificar("Listo. El inquilino de esa unidad ve otra cosa desde ahora.");
    cargar(); recargar();
  };

  const darDeBaja = async (id) => {
    const { error } = await sb.from("membresias").update({ activo: false }).eq("id", id);
    if (error) return fallo(error);
    notificar("Esa persona ya no entra a la unidad."); cargar();
  };

  const copiar = async (t) => {
    try { await navigator.clipboard.writeText(t); notificar("Copiado."); }
    catch (e) { notificar("No se pudo copiar. Selecciónelo a mano.", "error"); }
  };

  const codigoUnidad = (id) => unidades.find((u) => u.id === id)?.codigo || "—";

  return (
    <div className="grid gap-5">
      <div className="flex gap-2 flex-wrap">
        {[["invitar", "Invitar"], ["pendientes", "Invitaciones"],
          ["gente", "Quién tiene acceso"]].map(([k, t]) => (
          <Boton key={k} size="s" tipo={pest === k ? "oscuro" : "suave"}
            onClick={() => setPest(k)}>{t}</Boton>
        ))}
      </div>

      {pest === "invitar" && (
        <>
          <Tarjeta>
            <Titulo sub="La invitación queda atada a ese correo y a esa unidad. No sirve para nadie más, aunque alguien consiga el código.">
              Invitar a un residente
            </Titulo>
            <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))" }}>
              <Campo label="Unidad">
                <Selector value={f.unidad} onChange={(e) => setF({ ...f, unidad: e.target.value })}>
                  <option value="">Elija</option>
                  {unidades.map((u) => <option key={u.id} value={u.id}>{u.codigo}</option>)}
                </Selector>
              </Campo>
              <Campo label="Correo">
                <Entrada value={f.correo} placeholder="propietario@correo.com"
                  onChange={(e) => setF({ ...f, correo: e.target.value })} />
              </Campo>
              <Campo label="Es el..."
                ayuda="El inquilino puede ver menos que el propietario. Se configura por unidad.">
                <Selector value={f.relacion} onChange={(e) => setF({ ...f, relacion: e.target.value })}>
                  <option value="propietario">Propietario</option>
                  <option value="inquilino">Inquilino</option>
                </Selector>
              </Campo>
            </div>
            <div style={{ marginTop: 14 }}>
              <Boton disabled={ocupado} onClick={invitar}>Generar la invitación</Boton>
            </div>
          </Tarjeta>

          {codigo && (
            <Tarjeta>
              <Titulo sub="Este código se muestra una sola vez. En la base solo queda su huella, así que ni usted lo puede volver a ver. Si se pierde, genere otro.">
                Código para {codigo.correo}
              </Titulo>
              <div className="mono" style={{ padding: "14px 16px", background: T.fondo2,
                borderRadius: T.rs, border: `1px solid ${T.linea}`, wordBreak: "break-all",
                fontSize: 14 }}>{codigo.token}</div>
              <div className="flex gap-2 flex-wrap" style={{ marginTop: 12 }}>
                <Boton size="s" onClick={() => copiar(codigo.token)}>Copiar el código</Boton>
                <Boton size="s" tipo="suave" onClick={() => copiar(
                  `Hola. Para ver su recibo de condominio y reportar sus pagos, entre a ` +
                  `${location.origin}${location.pathname.replace(/[^/]*$/, "")}residente.html\n\n` +
                  `Cree su cuenta con el correo ${codigo.correo} y pegue este código:\n${codigo.token}`
                )}>Copiar el mensaje completo</Boton>
                <Boton size="s" tipo="fantasma" onClick={() => setCodigo(null)}>Ya lo envié</Boton>
              </div>
              <p style={{ fontSize: 12.5, color: T.tenue, marginBottom: 0, marginTop: 12 }}>
                Vence a los 7 días y se usa una sola vez.
              </p>
            </Tarjeta>
          )}
        </>
      )}

      {pest === "pendientes" && (
        <Tarjeta pad={false}>
          <div style={{ padding: "20px 20px 0" }}>
            <Titulo sub="El código no se guarda, solo su huella. Por eso aquí no se puede volver a leer.">
              Invitaciones
            </Titulo>
          </div>
          <div className="scroll-x">
            <table>
              <thead><tr><th>Correo</th><th>Unidad</th><th>Relación</th>
                <th>Creada</th><th>Estado</th><th></th></tr></thead>
              <tbody>
                {invs.map((i) => (
                  <tr key={i.id}>
                    <td>{i.correo}</td>
                    <td className="mono">{i.unidad || "—"}</td>
                    <td>{i.relacion || "—"}</td>
                    <td className="mono" style={{ fontSize: 12 }}>
                      {String(i.creada_en).slice(0, 10)}</td>
                    <td>
                      <Pastilla size="s" tono={i.estado === "aceptada" ? "verde"
                        : i.estado === "vencida" ? "rojo" : "ambar"}>{i.estado}</Pastilla>
                    </td>
                    <td>
                      {i.estado === "pendiente" && (
                        <Boton size="s" tipo="suave" onClick={() => revocar(i.id)}>Revocar</Boton>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {invs.length === 0 && (
            <div style={{ padding: 34, textAlign: "center", color: T.tenue, fontSize: 14 }}>
              Todavía no ha invitado a nadie.
            </div>
          )}
        </Tarjeta>
      )}

      {pest === "gente" && (
        <Tarjeta pad={false}>
          <div style={{ padding: "20px 20px 0" }}>
            <Titulo sub="Qué ve el inquilino se decide por unidad, no por persona. El propietario siempre ve todo.">
              Quién tiene acceso · {edificio?.nombre}
            </Titulo>
          </div>
          <div className="scroll-x">
            <table>
              <thead><tr><th>Unidad</th><th>Correo</th><th>Relación</th>
                <th>Qué ve el inquilino</th><th></th></tr></thead>
              <tbody>
                {gente.filter((g) => g.activo).map((g) => (
                  <tr key={g.membresia_id}>
                    <td className="mono">{g.unidad}</td>
                    <td style={{ fontSize: 13 }}>{g.correo}</td>
                    <td>{g.relacion}</td>
                    <td>
                      <Selector value={g.nivel} style={{ fontSize: 13, padding: "7px 9px" }}
                        onChange={(e) => cambiarNivel(g.unidad_id, e.target.value)}>
                        <option value="mes">Solo el recibo del mes</option>
                        <option value="saldo">El recibo y el saldo total</option>
                        <option value="todo">Todo, igual que el propietario</option>
                      </Selector>
                    </td>
                    <td>
                      <Boton size="s" tipo="suave" onClick={() => darDeBaja(g.membresia_id)}>
                        Dar de baja</Boton>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {gente.filter((g) => g.activo).length === 0 && (
            <div style={{ padding: 34, textAlign: "center", color: T.tenue, fontSize: 14 }}>
              Nadie tiene acceso todavía en este edificio.
            </div>
          )}
        </Tarjeta>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   CORTES DE CUENTA
   ══════════════════════════════════════════════════════════════ */
const PLANTILLA = "Hola {nombre}. Le enviamos el estado de cuenta de la unidad {unidad} " +
  "correspondiente a {periodo}.\n\nRecibo N° {recibo}\nCuota del mes: {cuota}\n" +
  "Saldo anterior: {anterior}\nInterés de mora: {mora}\nTOTAL A PAGAR: {total}\n" +
  "Equivalente: {totalBs} (tasa BCV {tasa})\n\n" +
  "Al transferir, por favor responda con el número de referencia.";

function Cortes({ sb, org, edificio, unidades, periodos, tasa, notificar, fallo, verFicha }) {
  const cerrados = periodos.filter((p) => p.estado === "cerrado");
  const [periodoId, setPeriodoId] = useState(cerrados[0]?.id || "");
  const [recibos, setRecibos] = useState([]);
  const [plantilla, setPlantilla] = useState(() => leerLocal("vecitap_plantilla") || PLANTILLA);
  const [cargando, setCargando] = useState(false);

  useEffect(() => { if (!periodoId && cerrados[0]) setPeriodoId(cerrados[0].id); }, [cerrados.length]);

  useEffect(() => {
    if (!periodoId) return;
    setCargando(true);
    sb.from("recibos").select("id,unidad_id,numero,cuota,directos,anterior,a_favor,mora," +
        "honorario,servicio,anterior_hon,anterior_serv,total,conceptos")
      .eq("periodo_id", periodoId).then(({ data, error }) => {
        setCargando(false);
        if (error) return fallo(error);
        setRecibos(data || []);
      });
  }, [periodoId]);

  const periodo = cerrados.find((p) => p.id === periodoId);

  const textoDe = (r) => {
    const u = unidades.find((x) => x.id === r.unidad_id);
    const p = vigente(u, "propietario");
    const t = Number(r.total) || 0;
    return plantilla
      .replace(/{nombre}/g, nombreDe(p) || "estimado propietario")
      .replace(/{unidad}/g, u?.codigo || "")
      .replace(/{periodo}/g, periodo?.etiqueta || "")
      .replace(/{recibo}/g, r.numero)
      .replace(/{cuota}/g, usd(r.cuota))
      .replace(/{anterior}/g, usd(Number(r.anterior) + Number(r.anterior_hon) + Number(r.anterior_serv)))
      .replace(/{mora}/g, usd(r.mora))
      .replace(/{total}/g, usd(t))
      .replace(/{totalBs}/g, periodo?.tasa_bcv ? bs(t * periodo.tasa_bcv) : "—")
      .replace(/{tasa}/g, periodo?.tasa_bcv ? nf(2).format(periodo.tasa_bcv) : "—");
  };

  const exportarCSV = () => {
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const filas = [
      ["unidad", "propietario", "telefono", "correo", "recibo", "cuota", "directos",
       "mora", "administracion", "servicio", "anterior", "total"].join(","),
      ...recibos.map((r) => {
        const u = unidades.find((x) => x.id === r.unidad_id);
        const p = vigente(u, "propietario");
        return [esc(u?.codigo), esc(nombreDe(p)), esc(p?.personas?.telefono),
          esc(p?.personas?.correo), esc(r.numero), esc(nf(2).format(r.cuota)),
          esc(nf(2).format(r.directos)), esc(nf(2).format(r.mora)),
          esc(nf(2).format(r.honorario)), esc(nf(2).format(r.servicio)),
          esc(nf(2).format(Number(r.anterior) + Number(r.anterior_hon) + Number(r.anterior_serv))),
          esc(nf(2).format(r.total))].join(",");
      })].join("\n");
    const url = URL.createObjectURL(new Blob(["﻿" + filas], { type: "text/csv;charset=utf-8;" }));
    const a = document.createElement("a");
    a.href = url; a.download = `cortes-${periodo?.etiqueta || "mes"}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    notificar("Listado exportado.");
  };

  if (!cerrados.length) {
    return <Vacio icono={icono("Send")} titulo="Todavía no hay recibos que enviar"
      texto="Los cortes de cuenta se arman con los recibos de un mes ya cerrado." />;
  }

  return (
    <div className="grid gap-5">
      <Tarjeta>
        <Titulo sub="Los recibos ya emitidos. El envío masivo por correo necesita un servidor propio, que todavía no está montado; mientras tanto, WhatsApp y la impresión funcionan hoy.">
          Cortes de cuenta
        </Titulo>
        <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))" }}>
          <Campo label="Mes">
            <Selector value={periodoId} onChange={(e) => setPeriodoId(e.target.value)}>
              {cerrados.map((p) => <option key={p.id} value={p.id}>{p.etiqueta}</option>)}
            </Selector>
          </Campo>
          <div style={{ alignSelf: "end" }} className="flex gap-2 flex-wrap">
            <Boton tipo="suave" onClick={exportarCSV}>
              <Ic n="Download" size={15} /> Exportar el listado
            </Boton>
          </div>
        </div>
        <div style={{ marginTop: 16 }}>
          <Campo label="Mensaje" ayuda="Entre llaves van los datos que se reemplazan en cada envío.">
            <textarea rows={7} value={plantilla}
              onChange={(e) => { setPlantilla(e.target.value); guardarLocal("vecitap_plantilla", e.target.value); }}
              style={{ ...estiloEntrada(false), fontSize: 13 }} />
          </Campo>
          <p style={{ fontSize: 11.5, color: T.tenue, marginTop: 6 }} className="mono">
            {"{nombre} {unidad} {periodo} {recibo} {cuota} {anterior} {mora} {total} {totalBs} {tasa}"}
          </p>
        </div>
      </Tarjeta>

      <Tarjeta pad={false}>
        <div style={{ padding: "20px 20px 0" }}>
          <Titulo sub={`${recibos.length} recibos emitidos en ${periodo?.etiqueta || ""}`}>
            A quién se le envía
          </Titulo>
        </div>
        {cargando ? <Cargando /> : (
          <div className="scroll-x">
            <table>
              <thead><tr><th>Unidad</th><th>Recibo</th><th>Propietario</th>
                <th style={{ textAlign: "right" }}>Total</th><th></th></tr></thead>
              <tbody>
                {recibos.map((r) => {
                  const u = unidades.find((x) => x.id === r.unidad_id);
                  const p = vigente(u, "propietario");
                  const tel = normalizarTel(p?.personas?.telefono);
                  return (
                    <tr key={r.id}>
                      <td className="mono" style={{ fontWeight: 600 }}>{u?.codigo}</td>
                      <td className="mono" style={{ fontSize: 12 }}>{r.numero}</td>
                      <td>{nombreDe(p) || <span style={{ color: T.tenue }}>sin registrar</span>}
                        {p?.personas?.correo && <div style={{ fontSize: 11.5, color: T.tenue }}>
                          {p.personas.correo}</div>}</td>
                      <td className="mono" style={{ textAlign: "right", fontWeight: 700 }}>{usd(r.total)}</td>
                      <td style={{ width: 210 }}>
                        <div className="flex gap-1 flex-wrap">
                          {tel && <Boton size="s" tipo="suave"
                            href={`https://wa.me/${tel}?text=${encodeURIComponent(textoDe(r))}`}>
                            <Ic n="MessageCircle" size={13} /> WhatsApp</Boton>}
                          {p?.personas?.correo && <Boton size="s" tipo="suave"
                            href={`mailto:${p.personas.correo}?subject=${encodeURIComponent(
                              `Estado de cuenta · ${u?.codigo} · ${periodo?.etiqueta}`)}&body=${
                              encodeURIComponent(textoDe(r))}`}>
                            <Ic n="Mail" size={13} /> Correo</Boton>}
                          <Boton size="s" tipo="fantasma" onClick={() => verFicha(r.unidad_id)}>
                            Ver</Boton>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Tarjeta>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   MARCA
   Los estados no cambian con la marca del cliente: si el acento
   pudiera volverse rojo, el rojo dejaría de significar deuda.
   ══════════════════════════════════════════════════════════════ */
function Marca({ sb, org, notificar, fallo, cargarOrgs }) {
  const [acento, setAcento] = useState(org.acento || "#FA8D4A");
  const [logo, setLogo] = useState(org.logo_url || "");
  const [ocupado, setOcupado] = useState(false);

  const guardar = async () => {
    setOcupado(true);
    const { error } = await sb.from("organizaciones")
      .update({ acento, logo_url: logo || null }).eq("id", org.id);
    setOcupado(false);
    if (error) return fallo(error);
    notificar("Marca guardada."); cargarOrgs();
  };

  const subirLogo = async (file) => {
    if (!file) return;
    try { setLogo(await redimensionarLogo(file)); }
    catch (e) { fallo(e); }
  };

  return (
    <div className="grid gap-5" style={{ maxWidth: 720 }}>
      <Tarjeta>
        <Titulo sub="Cambie el acento y toda la aplicación, los estados de cuenta y los recibos lo siguen.">
          Color de la marca
        </Titulo>
        <div className="flex gap-2 flex-wrap" style={{ marginBottom: 16 }}>
          {PALETAS.map((p) => (
            <button key={p.id} onClick={() => setAcento(p.color)}
              style={{ width: 74, padding: 10, borderRadius: T.rs, cursor: "pointer",
                background: acento === p.color ? mezclarBlanco(p.color, .85) : T.fondo,
                border: `1px solid ${acento === p.color ? p.color : T.linea}` }}>
              <div style={{ height: 22, borderRadius: 6, background: p.color, marginBottom: 6 }} />
              <div style={{ fontSize: 11, color: T.tinta2 }}>{p.nombre}</div>
            </button>
          ))}
        </div>
        <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))" }}>
          <Campo label="Color propio">
            <div className="flex gap-2 items-center">
              <input type="color" value={acento} onChange={(e) => setAcento(e.target.value)}
                style={{ width: 46, height: 40, border: `1px solid ${T.linea}`,
                  borderRadius: T.rs, background: T.fondo, cursor: "pointer" }} />
              <Entrada mono value={acento} onChange={(e) => setAcento(e.target.value)} />
            </div>
          </Campo>
          <Campo label="Logo" ayuda="Se reduce a 320 px de ancho. Formatos PNG o JPG.">
            <input type="file" accept="image/*" onChange={(e) => subirLogo(e.target.files?.[0])}
              style={{ ...estiloEntrada(false), padding: 9 }} />
          </Campo>
        </div>

        <div style={{ marginTop: 18, padding: 18, borderRadius: T.rs,
          background: mezclarBlanco(acento, .92), border: `1px solid ${T.linea}` }}>
          <div className="flex items-center gap-3 flex-wrap">
            {logo
              ? <img src={logo} alt="" style={{ maxHeight: 34, maxWidth: 140 }} />
              : <div style={{ width: 32, height: 32, borderRadius: 9, background: acento,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  color: letraSobre(acento), fontWeight: 700 }}>V</div>}
            <span style={{ fontFamily: "Poppins", fontWeight: 600 }}>{org.nombre}</span>
            <span style={{ marginLeft: "auto" }} className="flex gap-2 flex-wrap">
              <span style={{ background: acento, color: letraSobre(acento), padding: "7px 14px",
                borderRadius: T.rp, fontWeight: 600, fontSize: 13 }}>Botón principal</span>
              <span style={{ color: versionTexto(acento, mezclarBlanco(acento, .92)),
                fontWeight: 600, fontSize: 13, alignSelf: "center" }}>Texto de marca</span>
            </span>
          </div>
          <div className="flex gap-2 flex-wrap" style={{ marginTop: 14 }}>
            <Pastilla tono="verde">solvente</Pastilla>
            <Pastilla tono="ambar">pendiente</Pastilla>
            <Pastilla tono="rojo">con deuda</Pastilla>
            <Pastilla tono="azul">a favor</Pastilla>
          </div>
          <p style={{ fontSize: 12, color: T.tinta2, marginTop: 12, marginBottom: 0 }}>
            Contraste del texto sobre el acento: {nf(2).format(contraste(acento, letraSobre(acento)))}:1.
            La letra la elige el sistema, no se escoge a mano: el naranja no admite blanco.
          </p>
        </div>

        <div style={{ marginTop: 18 }}>
          <Boton disabled={ocupado} onClick={guardar}>Guardar marca</Boton>
        </div>
      </Tarjeta>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   AJUSTES
   ══════════════════════════════════════════════════════════════ */
function Ajustes({ sb, org, edificio, notificar, fallo, recargar, recargarEdificios }) {
  const [e, setE] = useState({ nombre: edificio.nombre, rif: edificio.rif || "",
    direccion: edificio.direccion || "", prefijo: edificio.prefijo_recibo,
    mora: String(edificio.interes_mora), tolerancia: String(edificio.tolerancia_alicuota),
    redondeo: String(edificio.tolerancia_redondeo ?? 0.5) });
  const [cats, setCats] = useState([]);
  const [nuevaCat, setNuevaCat] = useState("");
  const [nuevoEd, setNuevoEd] = useState(false);
  const [ocupado, setOcupado] = useState(false);

  const cargarCats = async () => {
    const { data, error } = await sb.from("categorias")
      .select("id,nombre,orden,partidas_fijas(id,concepto,referencia,monto)")
      .eq("edificio_id", edificio.id).order("orden");
    if (error) return fallo(error);
    setCats(data || []);
  };
  useEffect(() => { cargarCats(); setE({ nombre: edificio.nombre, rif: edificio.rif || "",
    direccion: edificio.direccion || "", prefijo: edificio.prefijo_recibo,
    mora: String(edificio.interes_mora), tolerancia: String(edificio.tolerancia_alicuota),
    redondeo: String(edificio.tolerancia_redondeo ?? 0.5) });
  }, [edificio.id]);

  const guardarEdificio = async () => {
    setOcupado(true);
    const { error } = await sb.from("edificios").update({
      nombre: e.nombre.trim(), rif: e.rif.trim() || null, direccion: e.direccion.trim() || null,
      prefijo_recibo: e.prefijo.trim().toUpperCase(), interes_mora: num0(e.mora),
      tolerancia_alicuota: num0(e.tolerancia) || 0.01,
      tolerancia_redondeo: num0(e.redondeo) }).eq("id", edificio.id);
    setOcupado(false);
    if (error) return fallo(error);
    notificar("Edificio actualizado."); recargarEdificios(edificio.id);
  };

  const agregarCat = async () => {
    if (!nuevaCat.trim()) return;
    const { error } = await sb.from("categorias").insert({ org_id: org.id,
      edificio_id: edificio.id, nombre: nuevaCat.trim(), orden: cats.length + 1 });
    if (error) return fallo(error);
    setNuevaCat(""); cargarCats();
  };

  const agregarPartida = async (catId) => {
    const { error } = await sb.from("partidas_fijas").insert({ org_id: org.id,
      categoria_id: catId, concepto: "", referencia: null, monto: 0 });
    if (error) return fallo(error);
    cargarCats();
  };

  const editarPartida = async (id, campos) => {
    const { error } = await sb.from("partidas_fijas").update(campos).eq("id", id);
    if (error) return fallo(error);
    cargarCats();
  };

  const borrarPartida = async (id) => {
    const { error } = await sb.from("partidas_fijas").delete().eq("id", id);
    if (error) return fallo(error);
    cargarCats();
  };

  return (
    <div className="grid gap-5" style={{ maxWidth: 860 }}>
      <Tarjeta>
        <Titulo sub="El prefijo debe ser único dentro de la administradora: es lo que distingue el recibo de un edificio del de otro."
          accion={<Boton size="s" tipo="suave" onClick={() => setNuevoEd(true)}>
            <Ic n="Plus" size={14} /> Otro edificio</Boton>}>
          Datos del edificio
        </Titulo>
        <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))" }}>
          <Campo label="Nombre"><Entrada value={e.nombre}
            onChange={(x) => setE({ ...e, nombre: x.target.value })} /></Campo>
          <Campo label="RIF"><Entrada mono value={e.rif}
            onChange={(x) => setE({ ...e, rif: x.target.value })} /></Campo>
          <Campo label="Prefijo del recibo"><Entrada mono value={e.prefijo}
            onChange={(x) => setE({ ...e, prefijo: x.target.value })} /></Campo>
          <Campo label="Interés de mora mensual %"
            ayuda="Se calcula sobre todo el saldo previo de condominio, así que el interés del mes pasado también genera interés.">
            <Entrada mono value={e.mora} onChange={(x) => setE({ ...e, mora: x.target.value })} />
          </Campo>
          <Campo label="Tolerancia de alícuotas">
            <Entrada mono value={e.tolerancia}
              onChange={(x) => setE({ ...e, tolerancia: x.target.value })} />
          </Campo>
          <Campo label="Perdón de centavos USD"
            ayuda="Al cerrar el mes, una deuda menor a este monto se perdona sola y queda como ajuste con su motivo. En 0 queda apagado.">
            <Entrada mono value={e.redondeo}
              onChange={(x) => setE({ ...e, redondeo: x.target.value })} />
          </Campo>
          <div style={{ gridColumn: "1 / -1" }}>
            <Campo label="Dirección"><Entrada value={e.direccion}
              onChange={(x) => setE({ ...e, direccion: x.target.value })} /></Campo>
          </div>
        </div>
        <div style={{ marginTop: 16 }}>
          <Boton disabled={ocupado} onClick={guardarEdificio}>Guardar</Boton>
        </div>
      </Tarjeta>

      <Tarjeta>
        <Titulo sub="Los gastos que se repiten todos los meses. Al abrir un mes entran solos con su monto, y ahí se ajusta lo que haya cambiado.">
          Categorías y partidas fijas
        </Titulo>

        {cats.map((c) => (
          <div key={c.id} style={{ borderTop: `1px solid ${T.linea}`, paddingTop: 14, marginTop: 14 }}>
            <div className="flex items-center justify-between gap-2 flex-wrap" style={{ marginBottom: 10 }}>
              <span style={{ fontWeight: 600, fontSize: 14 }}>{c.nombre}</span>
              <Boton size="s" tipo="suave" onClick={() => agregarPartida(c.id)}>
                <Ic n="Plus" size={13} /> Partida
              </Boton>
            </div>
            {(c.partidas_fijas || []).map((p) => (
