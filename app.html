const nf = (d = 2) =>

function normalizarTel(t) {
  if (!t) return null;
  const d = String(t).replace(/\D/g, "");
  if (d.startsWith("58") && d.length === 12) return d;
  if (d.startsWith("0") && d.length === 11) return "58" + d.slice(1);
  if (d.length === 10) return "58" + d;
  return null;
}

/* Formato venezolano: 1.234,56 y también 1234.56 */
function parseMonto(v) {
  if (typeof v === "number") return v;
  if (v === null || v === undefined) return null;
  let s = String(v).replace(/[^\d.,-]/g, "").trim();
  if (!s || s === "-") return null;
  const coma = s.lastIndexOf(","), punto = s.lastIndexOf(".");
  if (coma > -1 && punto > -1) {
    s = coma > punto ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else if (coma > -1) {
    s = /,\d{3}$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
/* Para campos de formulario: null si está vacío, número si se entiende */
const num = (v) => { const n = parseMonto(v); return n === null ? null : n; };
const num0 = (v) => num(v) || 0;

const extraerRef = (t) => {
  const m = String(t || "").match(/\d{6,}/g);
  return m ? m.sort((a, b) => b.length - a.length)[0] : "";

/* ── Contraste: el acento de marca no siempre admite letra blanca ── */
function luminancia(hex) {
  const h = String(hex).replace("#", "");
  if (h.length !== 6) return 0;
  const n = parseInt(h, 16);
  if (isNaN(n)) return 0;
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contraste(a, b) {
  const L = [luminancia(a), luminancia(b)].sort((x, y) => y - x);
  return (L[0] + 0.05) / (L[1] + 0.05);
}
const letraSobre = (f) =>
  contraste(f, "#FFFFFF") >= contraste(f, T.tinta) ? "#FFFFFF" : T.tinta;

function versionTexto(hex, fondo = T.fondo, objetivo = 4.5) {
  const h = String(hex).replace("#", "");
  if (h.length !== 6) return hex;
  const n = parseInt(h, 16);
  if (isNaN(n)) return hex;
  let [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  for (let i = 0; i < 40; i++) {
    const c = "#" + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
    if (contraste(c, fondo) >= objetivo) return c;
    r *= 0.92; g *= 0.92; b *= 0.92;
  }
  return T.tinta;
}
function mezclarBlanco(hex, p = 0.9) {
  const h = String(hex).replace("#", "");
  if (h.length !== 6) return "#F1EEE9";
  const n = parseInt(h, 16);
  if (isNaN(n)) return "#F1EEE9";
  const m = (c) => Math.round(c + (255 - c) * p);
  return `rgb(${m((n >> 16) & 255)}, ${m((n >> 8) & 255)}, ${m(n & 255)})`;
}

/* ── Tasa oficial vía DolarAPI ──
   El BCV publica solo en su web institucional, que se cae seguido. */
const DOLAR_API = "https://ve.dolarapi.com/v1";
async function obtenerTasaOficial() {
  const intentos = [
    { url: `${DOLAR_API}/dolares/oficial`, lista: false },
    { url: `${DOLAR_API}/dolares`, lista: true },
  ];
  let ultimo = null;
  for (const it of intentos) {
    try {
      const ctrl = new AbortController();
      const corte = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(it.url, { signal: ctrl.signal });
      clearTimeout(corte);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const d = it.lista
        ? (Array.isArray(json) ? json.find((x) => /oficial/i.test(x.nombre || "")) : null)
        : json;
      if (!d) throw new Error("sin cotización oficial");
      const valor = Number(d.promedio ?? d.venta ?? d.compra);
      if (!valor || !isFinite(valor) || valor <= 0) throw new Error("tasa inválida");
      return { tasa: valor, fuente: d.fuente || "BCV", actualizada: d.fechaActualizacion || null };
    } catch (e) { ultimo = e; }
  }
  throw new Error(/abort/i.test(String(ultimo?.name || ultimo?.message))
    ? "La consulta tardó demasiado" : "No se pudo obtener la tasa");
}

function fechaCorta(iso) {

  return d.toLocaleDateString("es-VE", { day: "2-digit", month: "short" }) + " " +

}

/* ── Lectura de movimientos bancarios (del prototipo, sin cambios) ── */
const PISTAS = {
  referencia: ["referencia","ref","nro","numero","número","documento","operacion","operación","comprobante"],
  monto: ["monto","importe","credito","crédito","abono","haber","deposito","depósito","valor"],

};

function detectarColumnas(encabezados, filas) {
  const mapa = { referencia: -1, monto: -1, fecha: -1, descripcion: -1 };
  const norm = encabezados.map((h) => String(h || "").toLowerCase().trim());
  Object.keys(PISTAS).forEach((campo) => {
    let mejor = -1, punt = 0;
    norm.forEach((h, i) => {
      if (!h) return;
      const p = PISTAS[campo].reduce((s, k) => (h.includes(k) ? Math.max(s, k.length) : s), 0);
      if (p > punt) { punt = p; mejor = i; }
    });
    mapa[campo] = mejor;
  });
  const muestra = filas.slice(0, 25);
  const ancho = Math.max(0, ...filas.map((f) => f.length));
  if (mapa.referencia === -1) {
    let mejor = -1, punt = 0;
    for (let i = 0; i < ancho; i++) {
      const p = muestra.filter((f) => /^\d{6,}$/.test(String(f[i] || "").trim())).length;
      if (p > punt) { punt = p; mejor = i; }
    }
    if (punt >= Math.max(2, muestra.length * 0.3)) mapa.referencia = mejor;
  }
  if (mapa.monto === -1) {
    let mejor = -1, punt = 0;
    for (let i = 0; i < ancho; i++) {
      if (i === mapa.referencia) continue;
      const p = muestra.filter((f) => parseMonto(f[i]) !== null).length;
      if (p > punt) { punt = p; mejor = i; }
    }
    mapa.monto = mejor;
  }
  return mapa;
}

async function leerTabla(file) {
  if (/\.csv$/i.test(file.name)) {
    return Papa.parse(await file.text(), { skipEmptyLines: true }).data;
  }
  const wb = XLSX.read(await file.arrayBuffer(), { cellDates: false });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
}

let pdfjsPromesa = null;
function cargarPdfJs() {
  if (pdfjsPromesa) return pdfjsPromesa;
  pdfjsPromesa = new Promise((res, rej) => {
    if (window.pdfjsLib) return res(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      } catch (e) { /* sigue sin worker */ }
      res(window.pdfjsLib);
    };
    s.onerror = () => rej(new Error("lector no disponible"));
    document.head.appendChild(s);
  });
  return pdfjsPromesa;
}

async function leerPDF(file) {
  const pdfjs = await cargarPdfJs();
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const lineas = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    const porFila = {};
    tc.items.forEach((it) => {
      const y = Math.round(it.transform[5]);
      (porFila[y] = porFila[y] || []).push({ x: it.transform[4], t: it.str });
    });
    Object.keys(porFila).sort((a, b) => b - a).forEach((y) => {
      const t = porFila[y].sort((a, b) => a.x - b.x).map((i) => i.t)
        .join(" ").replace(/\s+/g, " ").trim();
      if (t) lineas.push(t);
    });
  }
  return lineas;
}

function movimientosDesdeLineas(lineas) {
  return lineas.map((l) => {
    const montos = l.match(/-?\d{1,3}(?:[.,]\d{3})*[.,]\d{2}\b/g) || [];
    return {
      fecha: (l.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/) || [""])[0],
      descripcion: l, referencia: extraerRef(l),
      monto: montos.length ? parseMonto(montos[montos.length - 1]) : null,
    };
  }).filter((m) => m.referencia || m.monto !== null);
}

function redimensionarLogo(file, maxAncho = 320) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const esc = Math.min(1, maxAncho / img.width);
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * esc);
        cv.height = Math.round(img.height * esc);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/png"));
      };
      img.onerror = () => rej(new Error("imagen inválida"));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error("no se pudo leer"));
    fr.readAsDataURL(file);
  });
}

/* ── Iconos ──
   Se cargan de lucide como datos y se dibujan aquí. Si el CDN falla,
   la aplicación sigue funcionando: solo se quedan sin icono. */
let LU = {};
try { LU = await import('https://cdn.jsdelivr.net/npm/lucide@0.469.0/+esm'); } catch (e) { LU = {}; }
const Ic = ({ n, size = 16, style, className }) => {
  const d = LU[n];
  if (!d || !Array.isArray(d)) return null;
  const [, attrs, kids] = d;
  return createElement("svg", { ...attrs, width: size, height: size, style, className },
    (kids || []).map((k, i) => createElement(k[0], { key: i, ...k[1] })));
};
const icono = (n) => (p) => <Ic n={n} {...p} />;

  }[tipo];
  const tam = { s: { padding: "7px 12px", fontSize: 13 },
                m: { padding: "10px 16px", fontSize: 14 },
                l: { padding: "13px 22px", fontSize: 15 } }[size];
  const st = { ...estilos, ...tam, borderRadius: T.rp, fontWeight: 600, fontFamily: "Inter",
    display: "inline-flex", alignItems: "center", gap: 8,
    cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.5 : 1,
    transition: "filter .15s", whiteSpace: "nowrap" };
  const props = { style: st,
    onMouseEnter: (e) => !disabled && (e.currentTarget.style.filter = "brightness(.95)"),
    onMouseLeave: (e) => (e.currentTarget.style.filter = "none"), ...r };
  return href
    ? <a href={href} target="_blank" rel="noopener noreferrer" {...props}
        style={{ ...st, textDecoration: "none" }}>{children}</a>
    : <button onClick={onClick} disabled={disabled} {...props}>{children}</button>;
}

/* ══════════════════════════════════════════════════════════════
   EL EDIFICIO
   Cada unidad es un bloque coloreado por su estado. Es la forma más
   rápida de ver quién debe: se lee de un vistazo y se entra con un clic.
   Ahora los saldos vienen de la vista saldos_actuales, no de una cuenta
   hecha en el navegador.
   ══════════════════════════════════════════════════════════════ */
function Edificio({ saldos, sumaAlicuotas, tolerancia, onUnidad }) {
  const cuadra = Math.abs(sumaAlicuotas - 100) <= (tolerancia ?? 0.01);
  const colores = {
    al_dia:  { bg: T.verdeBg, br: T.verde, tx: T.verde },
    debe:    { bg: T.rojoBg,  br: T.rojo,  tx: T.rojo },
    a_favor: { bg: T.azulBg,  br: T.azul,  tx: T.azul },
  };
  const cuenta = { al_dia: 0, debe: 0, a_favor: 0 };
  saldos.forEach((s) => { if (cuenta[s.estado] !== undefined) cuenta[s.estado]++; });

  return (
    <Tarjeta>
      <Titulo sub="Cada bloque es una unidad. Haga clic para ver su cuenta.">El edificio</Titulo>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 18 }}>
        {saldos.map((u) => {
          const c = colores[u.estado] || colores.al_dia;
          const s = Number(u.total) || 0;
          return (
            <button key={u.unidad_id} onClick={() => onUnidad(u.unidad_id)}
              title={`${u.codigo} · ${usd(s)}`}
              style={{ minWidth: 62, padding: "9px 6px", borderRadius: T.rs, cursor: "pointer",
                background: c.bg, border: `1px solid ${c.br}22`, textAlign: "center",
                transition: "transform .12s, box-shadow .12s" }}
              onMouseEnter={(e) => { e.currentTarget.style.transform = "translateY(-2px)";
                                     e.currentTarget.style.boxShadow = T.sombra; }}
              onMouseLeave={(e) => { e.currentTarget.style.transform = "none";
                                     e.currentTarget.style.boxShadow = "none"; }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5,
                            fontWeight: 600, color: c.tx }}>{u.codigo || "—"}</div>
              <div style={{ fontSize: 10, color: c.tx, opacity: .75, marginTop: 2 }}>
                {Math.abs(s) < 0.01 ? "al día" : nf(0).format(Math.abs(s))}
              </div>
            </button>
          );
        })}
      </div>

      <div className="flex items-center gap-4 flex-wrap" style={{ fontSize: 12.5 }}>
        <span className="flex items-center gap-1.5" style={{ color: T.tinta2 }}>
          <i style={{ width: 9, height: 9, borderRadius: 3, background: T.verde, display: "inline-block" }} />
          {cuenta.al_dia} al día
        </span>
        <span className="flex items-center gap-1.5" style={{ color: T.tinta2 }}>
          <i style={{ width: 9, height: 9, borderRadius: 3, background: T.rojo, display: "inline-block" }} />
          {cuenta.debe} con deuda
        </span>
        {cuenta.a_favor > 0 && (
          <span className="flex items-center gap-1.5" style={{ color: T.tinta2 }}>
            <i style={{ width: 9, height: 9, borderRadius: 3, background: T.azul, display: "inline-block" }} />
            {cuenta.a_favor} con saldo a favor
          </span>
        )}
        <span style={{ marginLeft: "auto", fontFamily: "'IBM Plex Mono', monospace",
                       color: cuadra ? T.tenue : T.rojo, fontWeight: 600 }}>
          alícuotas {pct(sumaAlicuotas)}
        </span>
      </div>

      {!cuadra && (
        <div style={{ marginTop: 14 }}>
          <Aviso tono="rojo" titulo="Las alícuotas no suman 100%">
            Faltan {nf(5).format(100 - sumaAlicuotas)} puntos, más de la tolerancia del
            edificio ({nf(5).format(tolerancia ?? 0.01)}). Mientras no cuadre, el cierre
            del mes va a ser rechazado. Corríjalo en Propietarios.
          </Aviso>
        </div>
      )}
    </Tarjeta>
  );
}

/* ══════════════════════════════════════════════════════════════
   CONEXIÓN
   La clave anon es pública a propósito: quien protege los datos es
   el aislamiento de la base (RLS), no el secreto de esta clave.
   ══════════════════════════════════════════════════════════════ */
const guardarLocal = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leerLocal = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

function Conexion({ onListo }) {
  const [url, setUrl] = useState(leerLocal("vecitap_url") || "");
  const [key, setKey] = useState(leerLocal("vecitap_key") || "");
  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center",
      justifyContent: "center", padding: 20, background: T.fondo }}>
      <Tarjeta style={{ maxWidth: 520, width: "100%", padding: 28 }}>
        <Titulo sub="Están en Supabase → Project Settings → API Keys. Copie la clave anon o publishable, nunca la service_role.">
          Conexión con la base
        </Titulo>
        <div className="grid gap-3">
          <Campo label="URL del proyecto">
            <Entrada value={url} onChange={(e) => setUrl(e.target.value)}
              placeholder="https://xxxx.supabase.co" mono />
          </Campo>
          <Campo label="Clave anon">
            <Entrada value={key} onChange={(e) => setKey(e.target.value)}
              placeholder="eyJhbGciOi…" mono />
          </Campo>
          <div className="flex gap-2 flex-wrap">
            <Boton onClick={() => {
              if (!url.trim() || !key.trim()) return;
              guardarLocal("vecitap_url", url.trim());
              guardarLocal("vecitap_key", key.trim());
              onListo(url.trim(), key.trim());
            }}>Conectar</Boton>
            <Boton tipo="suave" onClick={() => {
              guardarLocal("vecitap_url", ""); guardarLocal("vecitap_key", "");
              setUrl(""); setKey("");
            }}>Olvidar</Boton>
          </div>
        </div>
      </Tarjeta>
    </div>
  );
}

/* ── Entrar ── */
function Entrar({ sb, notificar }) {
  const [correo, setCorreo] = useState("");
  const [clave, setClave] = useState("");
  const [ocupado, setOcupado] = useState(false);

  const accion = async (crear) => {
    if (!correoValido(correo)) return notificar("El correo no parece válido.", "error");
    if (clave.length < 6) return notificar("La contraseña necesita al menos 6 caracteres.", "error");
    setOcupado(true);
    const { error } = crear
      ? await sb.auth.signUp({ email: correo.trim(), password: clave })
      : await sb.auth.signInWithPassword({ email: correo.trim(), password: clave });
    setOcupado(false);
    if (error) return notificar(error.message, "error");
    if (crear) notificar("Cuenta creada. Si le pide confirmar por correo, confírmelo y vuelva a entrar.");
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center",
      justifyContent: "center", padding: 20, background: T.fondo }}>
      <Tarjeta style={{ maxWidth: 440, width: "100%", padding: 28 }}>
        <div className="flex items-center gap-3 mb-5">
          <div style={{ width: 36, height: 36, borderRadius: 10, background: A.base,
            display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Ic n="Building2" size={19} style={{ color: A.sobre }} />
          </div>
          <span style={{ fontFamily: "Poppins", fontWeight: 600, fontSize: 19 }}>Vecitap</span>
        </div>
        <div className="grid gap-3">
          <Campo label="Correo">
            <Entrada type="email" value={correo} autoComplete="username"
              onChange={(e) => setCorreo(e.target.value)} />
          </Campo>
          <Campo label="Contraseña">
            <Entrada type="password" value={clave} autoComplete="current-password"
              onChange={(e) => setClave(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && accion(false)} />
          </Campo>
          <div className="flex gap-2 flex-wrap">
            <Boton disabled={ocupado} onClick={() => accion(false)}>Entrar</Boton>
            <Boton tipo="suave" disabled={ocupado} onClick={() => accion(true)}>Crear cuenta</Boton>
          </div>
        </div>
      </Tarjeta>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   APLICACIÓN
   ══════════════════════════════════════════════════════════════ */
function App() {
  const [cfg, setCfg] = useState(() => {
    const u = leerLocal("vecitap_url"), k = leerLocal("vecitap_key");
    return u && k ? { url: u, key: k } : null;
  });
  /* Cada página guarda su sesión con una llave propia. Las tres viven en
     el mismo dominio, y con la llave por omisión entrar como residente en
     una pisaba la sesión de administrador en la otra: la aplicación se
     quedaba viendo una sola unidad sin que nadie entendiera por qué. */
  const sb = useMemo(() => cfg ? createClient(cfg.url, cfg.key,
    { auth: { storageKey: "vecitap-admin" } }) : null, [cfg]);

  const [sesion, setSesion] = useState(undefined);   // undefined = aún no se sabe
  const [orgs, setOrgs] = useState(null);
  const [org, setOrg] = useState(null);
  const [edificios, setEdificios] = useState([]);
  const [edificio, setEdificio] = useState(null);

  const [unidades, setUnidades] = useState([]);
  const [saldos, setSaldos] = useState([]);
  const [conceptos, setConceptos] = useState([]);
  const [periodos, setPeriodos] = useState([]);
  const [cargandoEd, setCargandoEd] = useState(false);

  const [vista, setVista] = useState("inicio");
  const [aviso, setAviso] = useState(null);
  const [fichaDe, setFichaDe] = useState(null);
  const [menuAbierto, setMenuAbierto] = useState(false);
  const [tasa, setTasa] = useState({ valor: 0, fuente: "", actualizada: null, cargando: false, error: null });
  const tmp = useRef(null);

  const notificar = (texto, tipo = "ok") => {
    setAviso({ texto, tipo });
    if (tmp.current) clearTimeout(tmp.current);
    tmp.current = setTimeout(() => setAviso(null), 3600);
  };
  const fallo = (e) => notificar(e?.message || String(e), "error");

  /* ── Sesión ── */
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSesion(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => {
      setSesion(s || null);
      if (!s) { setOrg(null); setOrgs(null); setEdificio(null); setEdificios([]); }
    });
    return () => sub?.subscription?.unsubscribe();
  }, [sb]);

  /* ── Organizaciones ── */
  const cargarOrgs = async () => {
    const { data, error } = await sb.from("organizaciones")
      .select("id,nombre,rif,plan,acento,logo_url").order("nombre");
    if (error) return fallo(error);
    setOrgs(data);
    if (data.length === 1) setOrg(data[0]);
  };
  useEffect(() => { if (sb && sesion) cargarOrgs(); }, [sb, sesion]);

  /* ── Edificios de la administradora ── */
  const cargarEdificios = async (elegir) => {
    const { data, error } = await sb.from("edificios")
      .select("id,nombre,rif,direccion,prefijo_recibo,interes_mora,tolerancia_alicuota," +
              "tolerancia_redondeo,activo")
      .eq("org_id", org.id).order("nombre");
    if (error) return fallo(error);
    setEdificios(data);
    const id = elegir || edificio?.id;
    setEdificio(data.find((e) => e.id === id) || data[0] || null);
  };
  useEffect(() => { if (org) cargarEdificios(); }, [org]);

  /* ── Todo lo del edificio elegido ──
     Los saldos NUNCA se calculan aquí: vienen de saldos_actuales, que
     parte de la última instantánea de cierre. Sumarlos por cuenta propia
     restaría dos veces los pagos ya absorbidos por un cierre. */
  const cargarEdificio = async () => {
    if (!edificio) return;
    setCargandoEd(true);
    const [u, s, c, p] = await Promise.all([
      sb.from("unidades")
        .select("id,codigo,alicuota,saldo_inicial,saldo_inicial_hon,activa," +
                "vinculos(id,tipo,desde,hasta,enviar_corte,persona_id," +
                "personas(id,prefijo,nombre,documento,telefono,correo))")
        .eq("edificio_id", edificio.id).order("codigo"),
      sb.from("saldos_actuales")
        .select("unidad_id,codigo,alicuota,condominio,administracion,servicio,total,estado")
        .eq("edificio_id", edificio.id).order("codigo"),
      sb.from("conceptos_cobro")
        .select("id,nombre,bolsillo,modo,monto,iva,orden,activo,edificio_id")
        .or(`edificio_id.eq.${edificio.id},edificio_id.is.null`).order("orden"),
      sb.from("periodos")
        .select("id,anio,mes,etiqueta,estado,tasa_bcv,presupuesto,total_gastos,cerrado_en")
        .eq("edificio_id", edificio.id)
        .order("anio", { ascending: false }).order("mes", { ascending: false }),
    ]);
    setCargandoEd(false);
    if (u.error) return fallo(u.error);
    if (s.error) return fallo(s.error);
    if (c.error) return fallo(c.error);
    if (p.error) return fallo(p.error);
    setUnidades(u.data); setSaldos(s.data); setConceptos(c.data); setPeriodos(p.data);
  };
  useEffect(() => { if (edificio) cargarEdificio(); }, [edificio]);

  /* ── Tasa BCV: referencia viva, se congela al abrir el mes ── */
  const actualizarTasa = async (silencioso = true) => {
    setTasa((t) => ({ ...t, cargando: true, error: null }));

    // La base es la fuente. Es la misma tasa con la que se convierten los
    // pagos, así que la pantalla no puede mostrar una y el cálculo usar otra.
    // La trae sola una tarea diaria desde el BCV.
    const { data, error } = await sb.rpc("tasa_atrasada");
    const fila = Array.isArray(data) ? data[0] : data;
    if (!error && fila && Number(fila.tasa) > 0) {
      setTasa({ valor: Number(fila.tasa), fuente: "BCV",
                actualizada: fila.fecha, dias: fila.dias,
                cargando: false, error: null });
      if (!silencioso) notificar(`Tasa del BCV: ${nf(2).format(fila.tasa)} Bs/USD`);
      return;
    }

    // Respaldo: si la base todavía no tiene ninguna, se consulta afuera solo
    // para mostrarla. No se usa para convertir nada.
    try {
      const r = await obtenerTasaOficial();
      setTasa({ valor: r.tasa, fuente: r.fuente + " (referencia)",
                actualizada: r.actualizada, cargando: false, error: null });
      if (!silencioso) notificar(`Tasa de referencia: ${nf(2).format(r.tasa)} Bs/USD`);
    } catch (e) {
      setTasa((t) => ({ ...t, cargando: false, error: e.message }));
      if (!silencioso) fallo(e);
    }
  };
  useEffect(() => { if (sesion) actualizarTasa(true); }, [sesion]);

  /* ── Derivados ── */
  const sumaAlicuotas = useMemo(
    () => unidades.filter((u) => u.activa).reduce((s, u) => s + (Number(u.alicuota) || 0), 0),
    [unidades]);
  const porCobrar = saldos.reduce((s, v) => s + Math.max(0, Number(v.total) || 0), 0);
  const aFavor    = saldos.reduce((s, v) => s + Math.min(0, Number(v.total) || 0), 0);
  const conDeuda  = saldos.filter((v) => (Number(v.total) || 0) > 0.01).length;
  const periodoAbierto = periodos.find((p) => p.estado === "abierto") || null;
  const acento = org?.acento || "#FA8D4A";

  /* ── Pantallas previas a la aplicación ── */
  if (!cfg) return <Conexion onListo={(url, key) => setCfg({ url, key })} />;
  if (sesion === undefined) return <Cargando texto="Comprobando la sesión…" />;
  if (!sesion) return <Entrar sb={sb} notificar={notificar} />;
  if (orgs === null) return <Cargando texto="Cargando su administradora…" />;
  if (!org) return <Organizaciones sb={sb} orgs={orgs} notificar={notificar}
    onElegir={setOrg} onRecargar={cargarOrgs} />;

  const menu = [
    { id: "inicio", label: "Inicio", icono: "House" },
    { id: "propietarios", label: "Propietarios", icono: "Users" },
    { id: "cobros", label: "Cobros", icono: "ListChecks" },
    { id: "mes", label: "Cierre del mes", icono: "ReceiptText" },
    { id: "pagos", label: "Pagos", icono: "Wallet" },
    { id: "cortes", label: "Cortes de cuenta", icono: "Send" },
    { id: "accesos", label: "Accesos", icono: "KeyRound" },
  ];
  const menuBajo = [
    { id: "marca", label: "Marca", icono: "Palette" },
    { id: "ajustes", label: "Ajustes", icono: "Settings2" },
  ];

  const comun = { sb, org, edificio, unidades, saldos, conceptos, periodos, periodoAbierto,
    sumaAlicuotas, porCobrar, aFavor, conDeuda, tasa, notificar, fallo,
    recargar: cargarEdificio, recargarEdificios: cargarEdificios,
    setVista, verFicha: setFichaDe };

  return (
    <div style={{ background: T.fondo, minHeight: "100vh", color: T.tinta }}>
      <style>{`
        :root {
          --acento: ${acento};
          --acento-suave: ${mezclarBlanco(acento, 0.9)};
          --acento-sobre: ${letraSobre(acento)};
          --acento-texto: ${versionTexto(acento)};
        }
        .app { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
        input:focus, select:focus, textarea:focus {
          border-color: var(--acento) !important; box-shadow: 0 0 0 3px var(--acento-suave); }
        .nav:hover, .fila:hover { background: ${T.fondo}; }
        table { border-collapse: collapse; width: 100%; }
        th { font-size: 11.5px; font-weight: 600; color: ${T.tenue}; text-align: left;
             padding: 10px 14px; border-bottom: 1px solid ${T.linea}; white-space: nowrap; }
        td { padding: 13px 14px; border-bottom: 1px solid ${T.linea}; font-size: 13.5px; }
        tbody tr:last-child td { border-bottom: none; }
        .solo-movil { display: none; }
        .lateral { display: flex; position: sticky; }

/* ══════════════════════════════════════════════════════════════
   PRIMER EDIFICIO
   ══════════════════════════════════════════════════════════════ */
function PrimerEdificio({ sb, org, notificar, fallo, recargarEdificios }) {
  const [f, setF] = useState({ nombre: "", prefijo: "CON1", mora: "0", tolerancia: "0,01",
                               rif: "", direccion: "" });
  const set = (k, v) => setF({ ...f, [k]: v });
  const crear = async () => {
    if (!f.nombre.trim()) return notificar("Falta el nombre del edificio.", "error");
    const { data, error } = await sb.from("edificios").insert({
      org_id: org.id, nombre: f.nombre.trim(), rif: f.rif.trim() || null,
      direccion: f.direccion.trim() || null,
      prefijo_recibo: (f.prefijo.trim() || "CON1").toUpperCase(),
      interes_mora: num0(f.mora), tolerancia_alicuota: num0(f.tolerancia) || 0.01,
      honorario_monto: 0,
    }).select("id").single();
    if (error) return fallo(error);
    notificar("Edificio creado con sus cobros por omisión.");
    recargarEdificios(data.id);
  };
  return (
    <Tarjeta style={{ maxWidth: 620 }}>
      <Titulo sub="Un edificio, una urbanización de casas o un centro de oficinas: para el sistema es lo mismo.">
        Registre su primer edificio
      </Titulo>
      <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
        <div style={{ gridColumn: "1 / -1" }}>
          <Campo label="Nombre">
            <Entrada value={f.nombre} onChange={(e) => set("nombre", e.target.value)}
              placeholder="Edificio Administradora Unión" />
          </Campo>
        </div>
        <Campo label="Prefijo del recibo" ayuda="Único dentro de la administradora. Sale en cada número de recibo.">
          <Entrada mono value={f.prefijo} onChange={(e) => set("prefijo", e.target.value)} />
        </Campo>
        <Campo label="Interés de mora mensual %" ayuda="Cero si el condominio no cobra intereses.">
          <Entrada mono value={f.mora} onChange={(e) => set("mora", e.target.value)} />
        </Campo>
        <Campo label="Tolerancia de alícuotas"
          ayuda="Los documentos de condominio rara vez suman 100 exacto. 0,01 es un margen razonable.">
          <Entrada mono value={f.tolerancia} onChange={(e) => set("tolerancia", e.target.value)} />
        </Campo>
        <Campo label="RIF (opcional)">
          <Entrada mono value={f.rif} onChange={(e) => set("rif", e.target.value)} />
        </Campo>
        <div style={{ gridColumn: "1 / -1" }}>
          <Campo label="Dirección (opcional)">
            <Entrada value={f.direccion} onChange={(e) => set("direccion", e.target.value)} />
          </Campo>
        </div>
      </div>
      <div style={{ marginTop: 18 }}><Boton size="l" onClick={crear}>Crear edificio</Boton></div>
    </Tarjeta>
  );
}

/* ══════════════════════════════════════════════════════════════
   INICIO
   ══════════════════════════════════════════════════════════════ */
function Inicio({ unidades, saldos, sumaAlicuotas, porCobrar, aFavor, conDeuda,
                  edificio, periodoAbierto, periodos, conceptos, setVista, verFicha }) {
  if (!unidades.length) {
    return (
      <Vacio icono={icono("Building2")} titulo="Empiece por cargar los propietarios"
        texto="Registre las unidades con su alícuota y el saldo que arrastran hoy. Puede pegarlos desde su hoja de cálculo."
        accion={<Boton size="l" onClick={() => setVista("propietarios")}>Ir a Propietarios</Boton>} />
    );
  }

  const cerrados = periodos.filter((p) => p.estado === "cerrado");
  const ultimo = cerrados[0];
  const hayConceptos = conceptos.some((c) => c.activo);
  const usaPresupuesto = conceptos.some((c) => c.activo && c.modo.startsWith("presupuesto"));
  const morosos = [...saldos].filter((s) => (Number(s.total) || 0) > 0.01)
    .sort((a, b) => b.total - a.total).slice(0, 6);

  return (
    <div className="grid gap-5">
      <div className="grid gap-4 apila-movil" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(210px,1fr))" }}>
        <Metrica etiqueta="Por cobrar" valor={usd(porCobrar)} tono={porCobrar > 0 ? "rojo" : "verde"}
          icono={icono("TrendingDown")}
          pie={`${conDeuda} de ${saldos.length} unidades con deuda`} />
        <Metrica etiqueta="Saldos a favor" valor={usd(Math.abs(aFavor))} icono={icono("CircleDollarSign")}
          pie="Anticipos que ya pagaron" />
        <Metrica etiqueta="Último mes cerrado" valor={ultimo ? ultimo.etiqueta : "—"}
          icono={icono("ReceiptText")}
          pie={ultimo ? `${cerrados.length} meses cerrados` : "Todavía no se ha cerrado ninguno"} />
        <Metrica etiqueta="Mes abierto" valor={periodoAbierto ? periodoAbierto.etiqueta : "ninguno"}
          icono={icono("CalendarClock")} onClick={() => setVista("mes")}
          pie={periodoAbierto
            ? (usaPresupuesto
                ? (periodoAbierto.presupuesto ? `presupuesto ${usd(periodoAbierto.presupuesto)}` : "falta el presupuesto")
                : `gastos ${usd(periodoAbierto.total_gastos)}`)
            : "Abrir el mes para empezar"} />
      </div>

      {!hayConceptos && (
        <Aviso tono="rojo" titulo="Este edificio no tiene cobros configurados">
          Sin al menos un cobro activo el mes no se puede cerrar. Vaya a Cobros y defina
          qué se le cobra a cada unidad.
        </Aviso>
      )}
      {periodoAbierto && usaPresupuesto && !periodoAbierto.presupuesto && (
        <Aviso tono="ambar" titulo="Falta el presupuesto del mes">
          Este edificio cobra repartiendo un presupuesto, no el gasto ejecutado. Escriba el
          monto en Cierre del mes antes de cerrar.
        </Aviso>
      )}

      <Edificio saldos={saldos} sumaAlicuotas={sumaAlicuotas}
        tolerancia={edificio?.tolerancia_alicuota} onUnidad={verFicha} />

      {morosos.length > 0 && (
        <Tarjeta pad={false}>
          <div style={{ padding: "20px 20px 0" }}>
            <Titulo sub="Los seis saldos más altos. Haga clic para ver la cuenta completa.">
              Quién debe más
            </Titulo>
          </div>
          <div className="scroll-x">
            <table>
              <thead><tr><th>Unidad</th><th>Condominio</th><th>Administración</th>
                <th>Servicio</th><th style={{ textAlign: "right" }}>Total</th><th></th></tr></thead>
              <tbody>
                {morosos.map((m) => (
                  <tr key={m.unidad_id} className="fila" style={{ cursor: "pointer" }}
                    onClick={() => verFicha(m.unidad_id)}>
                    <td className="mono" style={{ fontWeight: 600 }}>{m.codigo}</td>
                    <td className="mono">{usd(m.condominio)}</td>
                    <td className="mono">{usd(m.administracion)}</td>
                    <td className="mono">{usd(m.servicio)}</td>
                    <td className="mono" style={{ textAlign: "right", fontWeight: 700, color: T.rojo }}>
                      {usd(m.total)}
                    </td>
                    <td style={{ width: 28 }}><Ic n="ChevronRight" size={15} style={{ color: T.tenue }} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Tarjeta>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   PROPIETARIOS
   El prototipo guardaba el propietario aplanado dentro de la unidad.
   La base los separa en personas + vínculos con vigencia, porque la ley
   obliga al propietario del momento: quien era dueño en marzo responde
   por marzo aunque venda en junio.
   ══════════════════════════════════════════════════════════════ */
const vigente = (u, tipo) =>
  (u.vinculos || []).find((v) => v.tipo === tipo && !v.hasta) || null;
const nombreDe = (v) => v?.personas
  ? [v.personas.prefijo, v.personas.nombre].filter(Boolean).join(" ") : "";

function Propietarios({ sb, org, edificio, unidades, saldos, sumaAlicuotas,
                        notificar, fallo, recargar, verFicha }) {
  const [busca, setBusca] = useState("");
  const [filtro, setFiltro] = useState("todos");
  const [alta, setAlta] = useState(false);
  const [pantalla, setPantalla] = useState("lista");   // lista | importar | saldos

  const mapaSaldo = useMemo(() => {
    const m = {}; saldos.forEach((s) => (m[s.unidad_id] = s)); return m;
  }, [saldos]);

  if (pantalla === "importar")
    return <ImportarUnidades {...{ sb, org, edificio, unidades, notificar, fallo, recargar }}
      onVolver={() => setPantalla("lista")} />;
  if (pantalla === "saldos")
    return <ImportarSaldos {...{ sb, edificio, unidades, notificar, fallo, recargar }}
      onVolver={() => setPantalla("lista")} />;

  const visibles = unidades.filter((u) => {
    const s = mapaSaldo[u.id];
    const total = Number(s?.total) || 0;
    if (filtro === "deuda" && !(total > 0.01)) return false;
    if (filtro === "aldia" && !(Math.abs(total) <= 0.01)) return false;
    if (filtro === "favor" && !(total < -0.01)) return false;
    if (filtro === "sinduenio" && vigente(u, "propietario")) return false;
    if (!busca) return true;
    const t = [u.codigo, nombreDe(vigente(u, "propietario")),
               nombreDe(vigente(u, "inquilino"))].join(" ").toLowerCase();
    return t.includes(busca.toLowerCase());
  });

  return (
    <div className="grid gap-5">
      <Tarjeta pad={false}>
        <div style={{ padding: "20px 20px 0" }}>
          <Titulo sub={`${unidades.length} unidades · las alícuotas suman ${pct(sumaAlicuotas)}`}
            accion={
              <div className="flex gap-2 flex-wrap">
                <Boton tipo="suave" size="s" onClick={() => setPantalla("saldos")}>
                  <Ic n="FileSpreadsheet" size={14} /> Cargar saldos
                </Boton>
                <Boton tipo="suave" size="s" onClick={() => setPantalla("importar")}>
                  <Ic n="Upload" size={14} /> Importar unidades
                </Boton>
                <Boton size="s" onClick={() => setAlta(true)}>
                  <Ic n="Plus" size={14} /> Nueva unidad
                </Boton>
              </div>
            }>
            Propietarios
          </Titulo>

          <div className="flex gap-2 flex-wrap items-center" style={{ marginBottom: 14 }}>
            <div style={{ position: "relative", flex: 1, minWidth: 200 }}>
              <Ic n="Search" size={15} style={{ position: "absolute", left: 12, top: 13, color: T.tenue }} />
              <Entrada value={busca} onChange={(e) => setBusca(e.target.value)}
                placeholder="Buscar por unidad o por nombre" style={{ paddingLeft: 34 }} />
            </div>
            {[["todos", "Todas"], ["deuda", "Con deuda"], ["aldia", "Al día"],
              ["favor", "A favor"], ["sinduenio", "Sin propietario"]].map(([k, t]) => (
              <Boton key={k} size="s" tipo={filtro === k ? "oscuro" : "suave"}
                onClick={() => setFiltro(k)}>{t}</Boton>
            ))}
          </div>
        </div>

        <div className="scroll-x">
          <table>
            <thead><tr>
              <th>Unidad</th><th>Alícuota</th><th>Propietario</th><th>Inquilino</th>
              <th style={{ textAlign: "right" }}>Saldo</th><th></th>
            </tr></thead>
            <tbody>
              {visibles.map((u) => {
                const s = mapaSaldo[u.id];
                const total = Number(s?.total) || 0;
                const p = vigente(u, "propietario"), i = vigente(u, "inquilino");
                return (
                  <tr key={u.id} className="fila" style={{ cursor: "pointer" }}
                    onClick={() => verFicha(u.id)}>
                    <td className="mono" style={{ fontWeight: 600 }}>
                      {u.codigo}{!u.activa && <span style={{ color: T.tenue }}> · inactiva</span>}
                    </td>
                    <td className="mono">{nf(5).format(u.alicuota)}</td>
                    <td>{nombreDe(p) || <span style={{ color: T.tenue }}>sin registrar</span>}
                      {p?.personas?.telefono && (
                        <div style={{ fontSize: 11.5, color: T.tenue }} className="mono">
                          {p.personas.telefono}
                        </div>
                      )}
                    </td>
                    <td>{nombreDe(i) || <span style={{ color: T.tenue }}>—</span>}</td>
                    <td className="mono" style={{ textAlign: "right", fontWeight: 600,
                      color: total > 0.01 ? T.rojo : total < -0.01 ? T.azul : T.verde }}>
                      {usd(total)}
                    </td>
                    <td style={{ width: 28 }}><Ic n="ChevronRight" size={15} style={{ color: T.tenue }} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {visibles.length === 0 && (
            <div style={{ padding: 34, textAlign: "center", color: T.tenue, fontSize: 14 }}>
              Ninguna unidad coincide con el filtro.
            </div>
          )}
        </div>
      </Tarjeta>

      {alta && <AltaUnidad {...{ sb, org, edificio, notificar, fallo, recargar }}
        onCerrar={() => setAlta(false)} />}
    </div>
  );
}

/* ── Alta de una unidad con su propietario ── */
function AltaUnidad({ sb, org, edificio, notificar, fallo, recargar, onCerrar }) {
  const [f, setF] = useState({ codigo: "", alicuota: "", saldo: "", saldoHon: "",
    prefijo: "Sr.", nombre: "", documento: "", telefono: "", correo: "" });
  const set = (k, v) => setF({ ...f, [k]: v });
  const [ocupado, setOcupado] = useState(false);

  const crear = async () => {
    if (!f.codigo.trim()) return notificar("Falta el código de la unidad.", "error");
    setOcupado(true);
    const { data: u, error: e1 } = await sb.from("unidades").insert({
      org_id: org.id, edificio_id: edificio.id, codigo: f.codigo.trim(),
      alicuota: num0(f.alicuota), saldo_inicial: num0(f.saldo),
      saldo_inicial_hon: num0(f.saldoHon),
    }).select("id").single();
    if (e1) { setOcupado(false); return fallo(e1); }

    if (f.nombre.trim()) {
      const { data: p, error: e2 } = await sb.from("personas").insert({
        org_id: org.id, prefijo: f.prefijo || null, nombre: f.nombre.trim(),
        documento: f.documento.trim() || null, telefono: f.telefono.trim() || null,
        correo: f.correo.trim() || null,
      }).select("id").single();
      if (e2) { setOcupado(false); return fallo(e2); }
      const { error: e3 } = await sb.from("vinculos").insert({
        org_id: org.id, unidad_id: u.id, persona_id: p.id, tipo: "propietario" });
      if (e3) { setOcupado(false); return fallo(e3); }
    }
    setOcupado(false);
    notificar("Unidad registrada.");
    onCerrar(); recargar();
  };

  return (
    <div onClick={onCerrar} style={{ position: "fixed", inset: 0, zIndex: 90,
      background: "rgba(73,59,52,.45)", display: "flex", alignItems: "center",
      justifyContent: "center", padding: 20 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: T.lienzo,
        borderRadius: T.r, maxWidth: 560, width: "100%", maxHeight: "92vh", overflow: "auto",
        boxShadow: T.sombraAlta, padding: 26 }}>
        <Titulo sub="La alícuota es el porcentaje del gasto que le toca a esta unidad.">
          Nueva unidad
        </Titulo>
        <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
          <Campo label="Código"><Entrada mono value={f.codigo}
            onChange={(e) => set("codigo", e.target.value)} placeholder="01A" /></Campo>
          <Campo label="Alícuota %"><Entrada mono value={f.alicuota}
            onChange={(e) => set("alicuota", e.target.value)} placeholder="2,41144" /></Campo>
          <Campo label="Saldo inicial de condominio"
            ayuda="Lo que arrastra del sistema anterior.">
            <Entrada mono value={f.saldo} onChange={(e) => set("saldo", e.target.value)} placeholder="0,00" />
          </Campo>
          <Campo label="Saldo inicial de administración">
            <Entrada mono value={f.saldoHon} onChange={(e) => set("saldoHon", e.target.value)} placeholder="0,00" />
          </Campo>
          <div style={{ gridColumn: "1 / -1", borderTop: `1px solid ${T.linea}`, paddingTop: 14 }}>
            <span style={{ fontSize: 12.5, color: T.tinta2, fontWeight: 600 }}>Propietario (opcional)</span>
          </div>
          <Campo label="Tratamiento">
            <Selector value={f.prefijo} onChange={(e) => set("prefijo", e.target.value)}>
              {["Sr.", "Sra.", "Sres.", "Dr.", "Dra.", ""].map((p) =>
                <option key={p} value={p}>{p || "sin tratamiento"}</option>)}
            </Selector>
          </Campo>
          <Campo label="Nombre"><Entrada value={f.nombre}
            onChange={(e) => set("nombre", e.target.value)} /></Campo>
          <Campo label="Cédula o RIF"><Entrada mono value={f.documento}
            onChange={(e) => set("documento", e.target.value)} /></Campo>
          <Campo label="Teléfono"><Entrada mono value={f.telefono}
            onChange={(e) => set("telefono", e.target.value)} placeholder="0414-1234567" /></Campo>
          <div style={{ gridColumn: "1 / -1" }}>
            <Campo label="Correo"><Entrada value={f.correo}
              onChange={(e) => set("correo", e.target.value)} /></Campo>
          </div>
        </div>
        <div className="flex gap-2 justify-end mt-5 flex-wrap">
          <Boton tipo="suave" onClick={onCerrar}>Cancelar</Boton>
          <Boton disabled={ocupado} onClick={crear}>Registrar</Boton>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   IMPORTAR UNIDADES
   Siempre con previa antes de aplicar: pegar 54 filas a ciegas y
   descubrir después que una alícuota entró mal cuesta un mes de cierre.
   ══════════════════════════════════════════════════════════════ */
function ImportarUnidades({ sb, org, edificio, unidades, notificar, fallo, recargar, onVolver }) {
  const [texto, setTexto] = useState("");
  const [ocupado, setOcupado] = useState(false);

  const previa = useMemo(() => {
    const filas = texto.split("\n").map((l) => l.trim()).filter(Boolean);
    const existentes = new Set(unidades.map((u) => normaliza(u.codigo)));
    const vistos = new Set();
    return filas.map((l) => {
      const p = l.split(/[\t;,]/).map((x) => x.trim());
      const codigo = p[0] || "";
      const alicuota = num(p[1]);
      const saldo = num(p[2]);
      const nombre = p[3] || "";
      const telefono = p[4] || "";
      const correo = p[5] || "";
      const k = normaliza(codigo);
      const errores = [];
      if (!codigo) errores.push("sin código");
      if (alicuota === null) errores.push("alícuota ilegible");
      if (existentes.has(k)) errores.push("ya existe en el edificio");
      if (vistos.has(k)) errores.push("repetida en el pegado");
      if (correo && !correoValido(correo)) errores.push("correo inválido");
      vistos.add(k);
      return { codigo, alicuota, saldo, nombre, telefono, correo, errores };
    });
  }, [texto, unidades]);

  const buenas = previa.filter((f) => !f.errores.length);
  const suma = buenas.reduce((s, f) => s + (f.alicuota || 0), 0)
    + unidades.filter((u) => u.activa).reduce((s, u) => s + Number(u.alicuota || 0), 0);
  const tol = edificio?.tolerancia_alicuota ?? 0.01;

  const aplicar = async () => {
    if (!buenas.length) return;
    setOcupado(true);
    const { data: nuevas, error } = await sb.from("unidades").insert(
      buenas.map((f) => ({ org_id: org.id, edificio_id: edificio.id, codigo: f.codigo,
        alicuota: f.alicuota || 0, saldo_inicial: f.saldo || 0 }))
    ).select("id,codigo");
    if (error) { setOcupado(false); return fallo(error); }

    /* Personas y vínculos, solo para las filas que traían nombre */
    const conNombre = buenas.map((f, i) => ({ ...f, id: nuevas[i]?.id }))
      .filter((f) => f.nombre && f.id);
    if (conNombre.length) {
      const { data: pers, error: e2 } = await sb.from("personas").insert(
        conNombre.map((f) => ({ org_id: org.id, nombre: f.nombre,
          telefono: f.telefono || null, correo: f.correo || null }))
      ).select("id");
      if (e2) { setOcupado(false); return fallo(e2); }
      const { error: e3 } = await sb.from("vinculos").insert(
        conNombre.map((f, i) => ({ org_id: org.id, unidad_id: f.id,
          persona_id: pers[i].id, tipo: "propietario" })));
      if (e3) { setOcupado(false); return fallo(e3); }
    }
    setOcupado(false);
    notificar(`${buenas.length} unidades cargadas.`);
    setTexto(""); recargar(); onVolver();
  };

  return (
    <div className="grid gap-5">
      <Tarjeta>
        <Titulo accion={<Boton tipo="suave" size="s" onClick={onVolver}>Volver</Boton>}
          sub="Una unidad por línea. Separe con coma, punto y coma o tabulación — puede pegar directo desde Excel.">
          Importar unidades
        </Titulo>
        <div style={{ background: T.fondo, borderRadius: T.rs, padding: "12px 14px",
          fontSize: 12.5, color: T.tinta2, marginBottom: 14 }} className="mono">
          código, alícuota, saldo inicial, propietario, teléfono, correo
        </div>
        <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={9}
          placeholder={"01A, 2,41144, 0, Grecia González, 0414-1234567, grecia@correo.com\n01B, 2,50809, 145,50"}
          style={{ ...estiloEntrada(false), fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }} />
        <p style={{ fontSize: 12, color: T.tenue, marginTop: 8 }}>
          Del tercer campo en adelante todo es opcional. Los montos aceptan coma o punto.
        </p>
      </Tarjeta>

      {previa.length > 0 && (
        <Tarjeta pad={false}>
          <div style={{ padding: "20px 20px 0" }}>
            <Titulo sub={`${buenas.length} de ${previa.length} filas se pueden cargar`}>
              Previa
            </Titulo>
            {Math.abs(suma - 100) > tol && (
              <div style={{ marginBottom: 14 }}>
                <Aviso tono="ambar" titulo="Con estas filas las alícuotas no van a cuadrar">
                  Quedarían en {pct(suma)}. La tolerancia del edificio es {nf(5).format(tol)}.
                  Puede cargarlas igual y corregir después, pero el mes no cerrará hasta que cuadre.
                </Aviso>
              </div>
            )}
          </div>
          <div className="scroll-x" style={{ maxHeight: 380 }}>
            <table>
              <thead><tr><th>Código</th><th>Alícuota</th><th>Saldo</th>
                <th>Propietario</th><th>Estado</th></tr></thead>
              <tbody>
                {previa.map((f, i) => (
                  <tr key={i} style={{ background: f.errores.length ? T.rojoBg : "transparent" }}>
                    <td className="mono">{f.codigo || "—"}</td>
                    <td className="mono">{f.alicuota === null ? "—" : nf(5).format(f.alicuota)}</td>
                    <td className="mono">{f.saldo === null ? "—" : nf(2).format(f.saldo)}</td>
                    <td>{f.nombre || <span style={{ color: T.tenue }}>—</span>}</td>
                    <td style={{ fontSize: 12 }}>
                      {f.errores.length
                        ? <span style={{ color: T.rojo }}>{f.errores.join(" · ")}</span>
                        : <span style={{ color: T.verde }}>lista</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding: 20, borderTop: `1px solid ${T.linea}` }} className="flex gap-2 flex-wrap">
            <Boton disabled={!buenas.length || ocupado} onClick={aplicar}>
              Cargar {buenas.length} unidades
            </Boton>
            <Boton tipo="suave" onClick={() => setTexto("")}>Limpiar</Boton>
          </div>
        </Tarjeta>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   CARGAR SALDOS DESDE UN ARCHIVO
   El saldo inicial solo manda hasta el primer cierre: después el saldo
   parte de la última instantánea. Por eso esta pantalla avisa.
   ══════════════════════════════════════════════════════════════ */
function ImportarSaldos({ sb, edificio, unidades, notificar, fallo, recargar, onVolver }) {
  const [filas, setFilas] = useState([]);
  const [leyendo, setLeyendo] = useState(false);
  const [ocupado, setOcupado] = useState(false);
  const [hayCierres, setHayCierres] = useState(null);

  useEffect(() => {
    sb.from("periodos").select("id", { count: "exact", head: true })
      .eq("edificio_id", edificio.id).eq("estado", "cerrado")
      .then(({ count }) => setHayCierres((count || 0) > 0));
  }, [edificio]);

  const porCodigo = useMemo(() => {
    const m = {}; unidades.forEach((u) => (m[normaliza(u.codigo)] = u)); return m;
  }, [unidades]);

  const leer = async (file) => {
    if (!file) return;
    setLeyendo(true);
    try {
      let crudas = [];
      if (/\.pdf$/i.test(file.name)) {
        const lineas = await leerPDF(file);
        crudas = lineas.map((l) => {
          const montos = l.match(/-?\d{1,3}(?:[.,]\d{3})*[.,]\d{2}\b/g) || [];
          const cod = (l.match(/^[A-Za-z0-9ºª.\- ]{1,12}/) || [""])[0].trim();
          return [cod, montos.length ? montos[montos.length - 1] : ""];
        });
      } else {
        crudas = await leerTabla(file);
      }
      /* Se descartan las filas de total: en las planillas reales siempre
         hay una al final que si entra, se carga como si fuera una unidad. */
      const limpias = crudas
        .map((f) => (Array.isArray(f) ? f : Object.values(f)))
        .filter((f) => f.length >= 2)
        .filter((f) => !/total|suma|deuda total/i.test(String(f[0] || "")));

      const res = limpias.map((f) => {
        const cod = String(f[0] || "").trim();
        let monto = null;
        for (let i = f.length - 1; i >= 1 && monto === null; i--) monto = parseMonto(f[i]);
        const u = porCodigo[normaliza(cod)];
        return { cod, monto, unidad: u || null };
      }).filter((r) => r.cod && r.monto !== null);

      setFilas(res);
      const cruzan = res.filter((r) => r.unidad).length;
      notificar(`${res.length} filas leídas, ${cruzan} cruzan con una unidad.`,
        cruzan ? "ok" : "error");
    } catch (e) { fallo(e); }
    setLeyendo(false);
  };

  const cruzan = filas.filter((f) => f.unidad);

  const aplicar = async () => {
    setOcupado(true);
    for (const f of cruzan) {
      const { error } = await sb.from("unidades")
        .update({ saldo_inicial: f.monto }).eq("id", f.unidad.id);
      if (error) { setOcupado(false); return fallo(error); }
    }
    setOcupado(false);
    notificar(`${cruzan.length} saldos aplicados.`);
    setFilas([]); recargar(); onVolver();
  };

  return (
    <div className="grid gap-5">
      <Tarjeta>
        <Titulo accion={<Boton tipo="suave" size="s" onClick={onVolver}>Volver</Boton>}
          sub="Excel, CSV o PDF. Se cruza por el código de la unidad, sin importar puntos ni espacios.">
          Cargar saldos iniciales
        </Titulo>

        {hayCierres && (
          <div style={{ marginBottom: 14 }}>
            <Aviso tono="rojo" titulo="Este edificio ya tiene meses cerrados">
              El saldo inicial solo se usa mientras no exista ningún cierre. Después, el saldo
              parte de la última instantánea y cambiar este número no lo mueve. Si necesita
              corregir una deuda de un mes ya cerrado, use una exoneración o un cargo puntual.
            </Aviso>
          </div>
        )}

        <input type="file" accept=".xlsx,.xls,.csv,.pdf" disabled={leyendo}
          onChange={(e) => leer(e.target.files?.[0])}
          style={{ ...estiloEntrada(false), padding: 10 }} />
        <p style={{ fontSize: 12, color: T.tenue, marginTop: 8 }}>
          Del archivo se toma la primera columna como código y el último número de la fila
          como monto. La lectura de Excel y CSV es exacta; la de PDF es interpretada, así que
          revise la previa con más cuidado.
        </p>
      </Tarjeta>

      {filas.length > 0 && (
        <Tarjeta pad={false}>
          <div style={{ padding: "20px 20px 0" }}>
            <Titulo sub={`${cruzan.length} de ${filas.length} filas cruzan con una unidad`}>Previa</Titulo>
          </div>
          <div className="scroll-x" style={{ maxHeight: 380 }}>
            <table>
              <thead><tr><th>Código del archivo</th><th>Unidad</th>
                <th style={{ textAlign: "right" }}>Saldo a aplicar</th></tr></thead>
              <tbody>
                {filas.map((f, i) => (
                  <tr key={i} style={{ background: f.unidad ? "transparent" : T.ambarBg }}>
                    <td className="mono">{f.cod}</td>
                    <td className="mono">{f.unidad ? f.unidad.codigo
                      : <span style={{ color: T.ambar }}>no se encontró</span>}</td>
                    <td className="mono" style={{ textAlign: "right" }}>{nf(2).format(f.monto)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding: 20, borderTop: `1px solid ${T.linea}` }} className="flex gap-2 flex-wrap">
            <Boton disabled={!cruzan.length || ocupado} onClick={aplicar}>
              Aplicar {cruzan.length} saldos
            </Boton>
            <Boton tipo="suave" onClick={() => setFilas([])}>Descartar</Boton>
          </div>
        </Tarjeta>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   FICHA DE LA UNIDAD
   El historial ya no se arma en el navegador: lo devuelve
   historial_unidad(). Los pagos reportados sin conciliar se agregan
   aquí solo para mostrarlos — no mueven el saldo, porque todavía no
   se confirmó que el dinero entró.
   ══════════════════════════════════════════════════════════════ */
function imprimirEstado({ edificio, org, unidad, propietario, inquilino, filas, saldoFinal, tasa }) {
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const filasHtml = filas.map((f) => `
    <tr><td>${esc(f.fecha || "—")}</td>
    <td><b>${esc(f.concepto)}</b>${f.detalle ? `<br><span class="d">${esc(f.detalle)}</span>` : ""}</td>
    <td class="n">${f.cargo ? nf(2).format(f.cargo) : ""}</td>
    <td class="n ${f.tipo === "pendiente" ? "p" : "a"}">${f.abono ? nf(2).format(f.abono)
      : f.tipo === "pendiente" ? "(" + nf(2).format(f.monto || 0) + ")" : ""}</td>
    <td class="n s">${f.tipo === "pendiente" ? "" : nf(2).format(f.saldo)}</td></tr>`).join("");

  const html = `<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Estado de cuenta ${esc(unidad.codigo)}</title><style>
*{box-sizing:border-box} body{font-family:Arial,Helvetica,sans-serif;color:#493B34;margin:32px;font-size:12px}
h1{font-size:19px;margin:0 0 2px} .sub{color:#7A6B61;font-size:12px;margin-bottom:18px}
.caja{border:1px solid #EBE3D6;padding:12px 14px;margin-bottom:18px;background:#FDF7EB;border-radius:8px}
.caja b{display:inline-block;min-width:96px;color:#7A6B61;font-weight:400}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{background:#493B34;color:#fff;text-align:left;padding:7px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
td{padding:7px 9px;border-bottom:1px solid #EBE3D6;vertical-align:top}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap} .a{color:#3E7A5E} .p{color:#8A5E10} .s{font-weight:bold}
.d{color:#7A6B61;font-size:10.5px}
.tot{margin-top:18px;border-top:2px solid #493B34;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.tot .v{font-size:22px;font-weight:bold}
.pie{margin-top:26px;color:#7A6B61;font-size:10px;border-top:1px solid #EBE3D6;padding-top:10px}
@media print{body{margin:14mm}.noimp{display:none}}
</style></head><body>
<h1>${esc(edificio.nombre || "Estado de cuenta")}</h1>
<div class="sub">${esc(edificio.rif ? "RIF " + edificio.rif + " · " : "")}${esc(edificio.direccion || org.nombre || "")}</div>
<div class="caja">
  <div><b>Unidad</b> ${esc(unidad.codigo)}</div>
  <div><b>Propietario</b> ${esc(propietario || "sin registrar")}</div>
  ${inquilino ? `<div><b>Inquilino</b> ${esc(inquilino)}</div>` : ""}
  <div><b>Alícuota</b> ${nf(4).format(unidad.alicuota || 0)} %</div>
  <div><b>Emitido</b> ${new Date().toLocaleDateString("es-VE", { day: "2-digit", month: "long", year: "numeric" })}</div>
</div>
<table><thead><tr><th>Fecha</th><th>Concepto</th><th class="n">Cargo</th>
<th class="n">Abono</th><th class="n">Saldo</th></tr></thead>
<tbody>${filasHtml || '<tr><td colspan="5">Sin movimientos registrados.</td></tr>'}</tbody></table>
<div class="tot"><span>${saldoFinal > 0.009 ? "Saldo pendiente"
  : saldoFinal < -0.009 ? "Saldo a favor del propietario" : "Unidad solvente"}</span>
<span class="v">$ ${nf(2).format(Math.abs(saldoFinal))}</span></div>
${tasa ? `<div style="text-align:right;color:#7A6B61;margin-top:4px">Equivalente: Bs ${nf(2).format(Math.abs(saldoFinal) * tasa)} · tasa ${nf(2).format(tasa)}</div>` : ""}
<div class="pie">Documento generado a partir de los movimientos registrados. Los montos en bolívares son referenciales.</div>
<div class="noimp" style="margin-top:22px"><button onclick="window.print()"
  style="padding:10px 18px;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid #DDD2C2;background:#fff">
  Imprimir o guardar como PDF</button></div>
</body></html>`;
  const v = window.open("", "_blank");
  if (!v) return false;
  v.document.write(html); v.document.close();

function Ficha({ sb, org, edificio, unidades, saldos, unidadId, tasa,
                 notificar, fallo, recargar, onCerrar }) {
  const u = unidades.find((x) => x.id === unidadId);
  const s = saldos.find((x) => x.unidad_id === unidadId);
  const [pest, setPest] = useState("cuenta");
  const [filas, setFilas] = useState(null);
  const [pendientes, setPendientes] = useState([]);
  const [editando, setEditando] = useState(false);

  useEffect(() => {
    if (!unidadId) return;
    setFilas(null);
    Promise.all([
      sb.rpc("historial_unidad", { p_unidad: unidadId }),
      sb.from("pagos").select("id,fecha,monto_usd,metodo,referencia,destino")
        .eq("unidad_id", unidadId).eq("estado", "reportado").order("fecha"),
    ]).then(([h, p]) => {
      if (h.error) return fallo(h.error);
      setFilas(h.data || []);
      setPendientes(p.data || []);
    });
  }, [unidadId]);

  if (!u) return null;
  const prop = vigente(u, "propietario"), inq = vigente(u, "inquilino");
  const total = Number(s?.total) || 0;

  const filasImpresion = [
    ...(filas || []),
    ...pendientes.map((p) => ({ fecha: p.fecha, concepto: "Pago reportado, sin conciliar",
      detalle: [p.metodo, p.referencia ? `ref ${p.referencia}` : ""].filter(Boolean).join(" · "),
      cargo: 0, abono: 0, monto: p.monto_usd, saldo: 0, tipo: "pendiente" })),
  ];

  const tarjeta = (etiqueta, valor, color) => (
    <div style={{ background: T.fondo, borderRadius: T.rs, padding: "12px 14px" }}>
      <div style={{ fontSize: 11.5, color: T.tinta2 }}>{etiqueta}</div>
      <div className="mono" style={{ fontSize: 17, fontWeight: 700, color }}>{usd(valor)}</div>
    </div>
  );

  return (
    <div onClick={onCerrar} style={{ position: "fixed", inset: 0, zIndex: 80,
      background: "rgba(73,59,52,.45)", display: "flex", justifyContent: "flex-end" }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: T.fondo,
        width: "100%", maxWidth: 720, height: "100%", overflow: "auto",
        boxShadow: T.sombraAlta }}>
        <div style={{ padding: "20px 24px", background: T.lienzo,
          borderBottom: `1px solid ${T.linea}`, position: "sticky", top: 0, zIndex: 5 }}
          className="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <div className="flex items-center gap-3 flex-wrap">
              <h2 className="mono" style={{ fontFamily: "'IBM Plex Mono', monospace",
                fontSize: 22, fontWeight: 700, margin: 0 }}>{u.codigo}</h2>
              <Pastilla tono={total > 0.01 ? "rojo" : total < -0.01 ? "azul" : "verde"}>
                {total > 0.01 ? "debe" : total < -0.01 ? "a favor" : "al día"} {usd(Math.abs(total))}
              </Pastilla>
            </div>
            <p style={{ fontSize: 13, color: T.tinta2, margin: "4px 0 0" }}>
              {nombreDe(prop) || "Sin propietario registrado"} · alícuota {pct(u.alicuota)}
            </p>
          </div>
          <button onClick={onCerrar} style={{ border: "none", background: "transparent",
            cursor: "pointer", color: T.tenue }}><Ic n="X" size={20} /></button>
        </div>

        <div style={{ padding: "16px 24px 0" }} className="flex gap-2 flex-wrap">
          <Boton size="s" tipo={pest === "cuenta" ? "oscuro" : "suave"}
            onClick={() => setPest("cuenta")}>Estado de cuenta</Boton>
          <Boton size="s" tipo={pest === "datos" ? "oscuro" : "suave"}
            onClick={() => setPest("datos")}>Datos</Boton>
        </div>

        <div style={{ padding: 24 }} className="grid gap-4">
          {pest === "cuenta" && (
            <>
              <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))" }}>
                {tarjeta("Condominio", s?.condominio, T.tinta)}
                {tarjeta("Administración", s?.administracion, T.tinta)}
                {tarjeta("Servicio", s?.servicio, T.tinta)}
                {tarjeta("Total", total, total > 0.01 ? T.rojo : total < -0.01 ? T.azul : T.verde)}
              </div>

              {pendientes.length > 0 && (
                <Aviso tono="ambar" titulo="Hay pagos reportados sin conciliar">
                  {pendientes.length} pago(s) por {usd(pendientes.reduce((a, p) => a + Number(p.monto_usd), 0))}.
                  No bajan el saldo hasta que se confirme que el dinero entró.
                </Aviso>
              )}

              <Tarjeta pad={false}>
                <div className="scroll-x">
                  {filas === null ? <Cargando /> : (
                    <table>
                      <thead><tr><th>Fecha</th><th>Concepto</th>
                        <th style={{ textAlign: "right" }}>Cargo</th>
                        <th style={{ textAlign: "right" }}>Abono</th>
                        <th style={{ textAlign: "right" }}>Saldo</th></tr></thead>
                      <tbody>
                        {filasImpresion.map((f, i) => (
                          <tr key={i}>
                            <td className="mono" style={{ color: T.tinta2, whiteSpace: "nowrap" }}>
                              {f.fecha || "—"}</td>
                            <td>
                              <div style={{ fontWeight: 600,
                                color: f.tipo === "pendiente" ? T.ambar : T.tinta }}>{f.concepto}</div>
                              {f.detalle && <div style={{ fontSize: 11.5, color: T.tenue }}>{f.detalle}</div>}
                            </td>
                            <td className="mono" style={{ textAlign: "right" }}>
                              {Number(f.cargo) ? nf(2).format(f.cargo) : ""}</td>
                            <td className="mono" style={{ textAlign: "right",
                              color: f.tipo === "pendiente" ? T.ambar : T.verde }}>
                              {Number(f.abono) ? nf(2).format(f.abono)
                                : f.tipo === "pendiente" ? `(${nf(2).format(f.monto)})` : ""}</td>
                            <td className="mono" style={{ textAlign: "right", fontWeight: 600 }}>
                              {f.tipo === "pendiente" ? "" : nf(2).format(f.saldo)}</td>
                          </tr>
                        ))}
                        {filasImpresion.length === 0 && (
                          <tr><td colSpan={5} style={{ textAlign: "center", color: T.tenue, padding: 28 }}>
                            Sin movimientos registrados.</td></tr>
                        )}
                      </tbody>
                    </table>
                  )}
                </div>
              </Tarjeta>

              <div className="flex gap-2 flex-wrap">
                <Boton tipo="suave" onClick={() => imprimirEstado({
                  edificio, org, unidad: u, propietario: nombreDe(prop), inquilino: nombreDe(inq),
                  filas: filasImpresion, saldoFinal: total, tasa: tasa.valor })}>
                  <Ic n="Printer" size={15} /> Imprimir o guardar en PDF
                </Boton>
                {prop?.personas?.telefono && normalizarTel(prop.personas.telefono) && (
                  <Boton tipo="suave"
                    href={`https://wa.me/${normalizarTel(prop.personas.telefono)}?text=` +
                      encodeURIComponent(`Hola ${nombreDe(prop)}. Le escribimos de ${edificio.nombre} ` +
                        `sobre la unidad ${u.codigo}. Su saldo actual es ${usd(total)}.`)}>
                    <Ic n="MessageCircle" size={15} /> WhatsApp
                  </Boton>
                )}
              </div>
            </>
          )}

          {pest === "datos" && (
            <DatosUnidad {...{ sb, org, unidad: u, prop, inq, notificar, fallo, recargar }} />
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Datos de la unidad, propietario e inquilino ── */
function DatosUnidad({ sb, org, unidad, prop, inq, notificar, fallo, recargar }) {
  const [u, setU] = useState({ codigo: unidad.codigo, alicuota: String(unidad.alicuota),
    saldo: String(unidad.saldo_inicial), saldoHon: String(unidad.saldo_inicial_hon),
    activa: unidad.activa });
  const persona = (v) => ({ prefijo: v?.personas?.prefijo || "Sr.", nombre: v?.personas?.nombre || "",
    documento: v?.personas?.documento || "", telefono: v?.personas?.telefono || "",
    correo: v?.personas?.correo || "", enviar: v ? v.enviar_corte : true });
  const [p, setP] = useState(persona(prop));
  const [i, setI] = useState(persona(inq));
  const [ocupado, setOcupado] = useState(false);

  const guardarVinculo = async (tipo, f, actual) => {
    if (!f.nombre.trim()) return;
    const campos = { org_id: org.id, prefijo: f.prefijo || null, nombre: f.nombre.trim(),
      documento: f.documento.trim() || null, telefono: f.telefono.trim() || null,
      correo: f.correo.trim() || null };
    if (actual?.personas?.id) {
      const { error } = await sb.from("personas").update(campos).eq("id", actual.personas.id);
      if (error) throw error;
      const { error: e2 } = await sb.from("vinculos")
        .update({ enviar_corte: f.enviar }).eq("id", actual.id);
      if (e2) throw e2;
    } else {
      const { data, error } = await sb.from("personas").insert(campos).select("id").single();
      if (error) throw error;
      const { error: e2 } = await sb.from("vinculos").insert({ org_id: org.id,
        unidad_id: unidad.id, persona_id: data.id, tipo, enviar_corte: f.enviar });
      if (e2) throw e2;
    }
  };

  const guardar = async () => {
    setOcupado(true);
    try {
      const { error } = await sb.from("unidades").update({
        codigo: u.codigo.trim(), alicuota: num0(u.alicuota),
        saldo_inicial: num0(u.saldo), saldo_inicial_hon: num0(u.saldoHon),
        activa: u.activa }).eq("id", unidad.id);
      if (error) throw error;
      await guardarVinculo("propietario", p, prop);
      await guardarVinculo("inquilino", i, inq);
      notificar("Datos guardados.");
      recargar();
    } catch (e) { fallo(e); }
    setOcupado(false);
  };

  const bloque = (titulo, f, setF, ayuda) => (
    <Tarjeta>
      <Titulo sub={ayuda}>{titulo}</Titulo>
      <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
        <Campo label="Tratamiento">
          <Selector value={f.prefijo} onChange={(e) => setF({ ...f, prefijo: e.target.value })}>
            {["Sr.", "Sra.", "Sres.", "Dr.", "Dra.", ""].map((x) =>
              <option key={x} value={x}>{x || "sin tratamiento"}</option>)}
          </Selector>
        </Campo>
        <Campo label="Nombre"><Entrada value={f.nombre}
          onChange={(e) => setF({ ...f, nombre: e.target.value })} /></Campo>
        <Campo label="Cédula o RIF"><Entrada mono value={f.documento}
          onChange={(e) => setF({ ...f, documento: e.target.value })} /></Campo>
        <Campo label="Teléfono"><Entrada mono value={f.telefono}
          onChange={(e) => setF({ ...f, telefono: e.target.value })} /></Campo>
        <div style={{ gridColumn: "1 / -1" }}>
          <Campo label="Correo"
            mal={f.correo && !correoValido(f.correo)}>
            <Entrada value={f.correo} mal={!!f.correo && !correoValido(f.correo)}
              onChange={(e) => setF({ ...f, correo: e.target.value })} />
          </Campo>
        </div>
        <label className="flex items-center gap-2" style={{ gridColumn: "1 / -1", fontSize: 13.5 }}>
          <input type="checkbox" checked={f.enviar}
            onChange={(e) => setF({ ...f, enviar: e.target.checked })} />
          Enviarle el corte de cuenta
        </label>
      </div>
    </Tarjeta>
  );

  return (
    <div className="grid gap-4">
      <Tarjeta>
        <Titulo sub="El código sale en el número de cada recibo, así que cambiarlo cambia la numeración de los recibos futuros.">
          La unidad
        </Titulo>
        <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
          <Campo label="Código"><Entrada mono value={u.codigo}
            onChange={(e) => setU({ ...u, codigo: e.target.value })} /></Campo>
          <Campo label="Alícuota %"><Entrada mono value={u.alicuota}
            onChange={(e) => setU({ ...u, alicuota: e.target.value })} /></Campo>
          <Campo label="Saldo inicial de condominio"
            ayuda="Solo cuenta mientras el edificio no tenga ningún mes cerrado.">
            <Entrada mono value={u.saldo} onChange={(e) => setU({ ...u, saldo: e.target.value })} />
          </Campo>
          <Campo label="Saldo inicial de administración">
            <Entrada mono value={u.saldoHon} onChange={(e) => setU({ ...u, saldoHon: e.target.value })} />
          </Campo>
          <label className="flex items-center gap-2" style={{ gridColumn: "1 / -1", fontSize: 13.5 }}>
            <input type="checkbox" checked={u.activa}
              onChange={(e) => setU({ ...u, activa: e.target.checked })} />
            Unidad activa · una unidad inactiva no se factura, pero conserva su historia
          </label>
        </div>
      </Tarjeta>

      {bloque("Propietario", p, setP,
        "La ley obliga al propietario del momento: quien era dueño en marzo responde por marzo, aunque venda en junio.")}
      {bloque("Inquilino", i, setI,
        "Se registra para poder enviarle el corte, pero la deuda sigue siendo del propietario.")}

      <div><Boton disabled={ocupado} onClick={guardar}>Guardar cambios</Boton></div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   COBROS
   Pantalla nueva: no existía en el prototipo. Es la que reemplaza al
   honorario de tres modos fijos. Cada fila dice cómo se calcula, cuánto,
   con qué IVA y a qué bolsillo va el dinero.
   ══════════════════════════════════════════════════════════════ */
function Cobros({ sb, org, edificio, conceptos, notificar, fallo, recargar }) {
  const [nuevo, setNuevo] = useState({ nombre: "", bolsillo: "condominio",
    modo: "presupuesto_alicuota", monto: "0", iva: "0" });
  const [borrar, setBorrar] = useState(null);

  const editar = async (id, cambios) => {
    const { error } = await sb.from("conceptos_cobro").update(cambios).eq("id", id);
    if (error) return fallo(error);
    notificar("Guardado."); recargar();
  };
  const agregar = async () => {
    if (!nuevo.nombre.trim()) return notificar("Falta el nombre.", "error");
    const { error } = await sb.from("conceptos_cobro").insert({
      org_id: org.id, edificio_id: edificio.id, nombre: nuevo.nombre.trim(),
      bolsillo: nuevo.bolsillo, modo: nuevo.modo,
      monto: num0(nuevo.monto), iva: num0(nuevo.iva), orden: 5 });
    if (error) return fallo(error);
    setNuevo({ ...nuevo, nombre: "", monto: "0" });
    notificar("Cobro agregado."); recargar();
  };
  const eliminar = async () => {
    const { error } = await sb.from("conceptos_cobro").delete().eq("id", borrar.id);
    setBorrar(null);
    if (error) return fallo(error);
    notificar("Cobro eliminado."); recargar();
  };

  const usaPresupuesto = conceptos.some((c) => c.activo && c.modo.startsWith("presupuesto"));
  const usaGasto = conceptos.some((c) => c.activo && c.modo.startsWith("gasto"));

  return (
    <div className="grid gap-5">
      <Tarjeta pad={false}>
        <div style={{ padding: "20px 20px 0" }}>
          <Titulo sub="Todo lo que aparece en el recibo sale de esta lista. Agregar un cobro nuevo es agregar una fila, no programar.">
            Qué se le cobra a cada unidad
          </Titulo>
          {!conceptos.some((c) => c.activo) && (
            <div style={{ marginBottom: 14 }}>
              <Aviso tono="rojo" titulo="Sin cobros activos el mes no se puede cerrar">
                Un edificio necesita al menos un cobro encendido.
              </Aviso>
            </div>
          )}
          {usaPresupuesto && usaGasto && (
            <div style={{ marginBottom: 14 }}>
              <Aviso tono="ambar" titulo="Este edificio mezcla presupuesto y gasto ejecutado">
                Se puede hacer, pero conviene revisarlo: normalmente un condominio cobra de
                una forma o de la otra, no de las dos a la vez.
              </Aviso>
            </div>
          )}
        </div>

        <div className="scroll-x">
          <table>
            <thead><tr><th>Nombre en el recibo</th><th>Bolsillo</th><th>Cómo se calcula</th>
              <th style={{ textAlign: "right" }}>Monto o %</th>
              <th style={{ textAlign: "right" }}>IVA %</th><th></th><th></th></tr></thead>
            <tbody>
              {conceptos.map((c) => {
                const deVecitap = c.bolsillo === "servicio";
                return (
                  <tr key={c.id} style={{ opacity: c.activo ? 1 : .5 }}>
                    <td>
                      <Entrada value={c.nombre} disabled={deVecitap}
                        onChange={(e) => editar(c.id, { nombre: e.target.value })}
                        style={{ padding: "7px 9px", fontSize: 13 }} />
                    </td>
                    <td><Pastilla tono={c.bolsillo === "condominio" ? "neutro"
                      : c.bolsillo === "administracion" ? "azul" : "marca"} size="s">
                      {BOLSILLOS[c.bolsillo]?.t}</Pastilla></td>
                    <td>
                      <Selector value={c.modo} disabled={deVecitap}
                        onChange={(e) => editar(c.id, { modo: e.target.value })}
                        style={{ padding: "7px 9px", fontSize: 13 }}>
                        {Object.entries(MODOS_COBRO).map(([k, v]) =>
                          <option key={k} value={k}>{v}</option>)}
                      </Selector>
                    </td>
                    <td style={{ width: 110 }}>
                      <Entrada mono defaultValue={String(c.monto)} disabled={deVecitap}
                        onBlur={(e) => { const v = num0(e.target.value);
                          if (v !== Number(c.monto)) editar(c.id, { monto: v }); }}
                        style={{ padding: "7px 9px", fontSize: 13, textAlign: "right" }} />
                    </td>
                    <td style={{ width: 84 }}>
                      <Entrada mono defaultValue={String(c.iva)} disabled={deVecitap}
                        onBlur={(e) => { const v = num0(e.target.value);
                          if (v !== Number(c.iva)) editar(c.id, { iva: v }); }}
                        style={{ padding: "7px 9px", fontSize: 13, textAlign: "right" }} />
                    </td>
                    <td style={{ width: 96 }}>
                      <Boton size="s" tipo="suave" disabled={deVecitap}
                        onClick={() => editar(c.id, { activo: !c.activo })}>
                        {c.activo ? "Apagar" : "Encender"}
                      </Boton>
                    </td>
