const leerTema = () => {
  try { return localStorage.getItem("vecitap-tema") === "oscuro" ? "oscuro" : "claro"; }
  catch (e) { return "claro"; }
};
let T = { ...TEMAS[leerTema()] };
const ponerTema = (n) => {
  Object.assign(T, TEMAS[n] || TEMAS.claro);
  try { localStorage.setItem("vecitap-tema", n); } catch (e) {}
  try {
    const r = document.documentElement.style;
    r.setProperty("--campo", n === "oscuro" ? "#070C1C" : "#FFFFFF");
    r.setProperty("--lineaF", T.lineaF);
    r.setProperty("--tinta", T.tinta);
    document.body.style.background = T.papel;
    document.body.style.color = T.tinta;
  } catch (e) {}
};
ponerTema(leerTema());

/* El logo va como archivo al lado del HTML. Si no está, cae al nombre
   escrito y la página no se rompe. */
const LogoVecitap = ({ alto = 24, tema, style }) => {
  const [falla, setFalla] = useState(false);
  if (falla) return (
    <span style={{ fontWeight:700, fontSize: alto*0.72, color:T.tinta,
      letterSpacing:"-.01em", ...style }}>vecitap</span>
  );
  return <img src={tema === "oscuro" ? "logo-oscuro.png" : "logo-claro.png"}
    alt="Vecitap" onError={() => setFalla(true)}
    style={{ height: alto, width:"auto", display:"block", ...style }} />;
};

const nf = (d=2) => new Intl.NumberFormat("es-VE",{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = (v) => "$ " + nf(2).format(Number(v)||0);
const bs  = (v) => "Bs " + nf(2).format(Number(v)||0);
const hoyISO = () => new Date().toISOString().slice(0,10);
/* En Venezuela se escribe 5.630,15. Un input numérico descarta la coma
   y devuelve vacío: por eso todos los montos son de texto. */
const num = (v) => {
  const t = String(v ?? "").trim();
  if (t === "") return null;
  const n = Number(t.replace(/\.(?=\d{3}\b)/g,"").replace(",","."));
  return Number.isFinite(n) ? n : null;
};
const guardar = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const leer    = (k)   => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const fechaCorta = (iso) => {
  if (!iso) return "";
  const [a,m,d] = String(iso).slice(0,10).split("-");
  return `${d}/${m}/${a}`;
};
const fechaLarga = (iso) => {
  if (!iso) return "";
  const [a,m,d] = String(iso).slice(0,10).split("-");
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio",
                 "agosto","septiembre","octubre","noviembre","diciembre"];
  return `${Number(d)} de ${meses[Number(m)-1]} de ${a}`;
};

/* ═══════════════════════════════════════════════════════════════════
   APLICACIÓN
   ═══════════════════════════════════════════════════════════════ */
function App() {
  const [cfg, setCfg] = useState(() => {
    if (CONFIG.url && CONFIG.key) return CONFIG;
    const u = leer("vecitap_url"), k = leer("vecitap_key");
    return u && k ? { url:u, key:k } : null;
  });
  /* Cada página guarda su sesión con una llave propia. Las tres viven en
     el mismo dominio, y con la llave por omisión entrar como residente en
     una pisaba la sesión de administrador en la otra: la aplicación se
     quedaba viendo una sola unidad sin que nadie entendiera por qué. */
  const sb = useMemo(() => cfg ? createClient(cfg.url, cfg.key,
    { auth: { storageKey: "vecitap-residente" } }) : null, [cfg]);
  const [sesion, setSesion] = useState(undefined);
  const [unidades, setUnidades] = useState(null);
  const [elegida, setElegida] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [tema, setTema] = useState(leerTema);
  /* Se mira la dirección ANTES de que Supabase la limpie: al entrar por
     el enlace del correo, la marca viene en el pedacito después del #. */
  const [recuperando, setRecuperando] = useState(() => {
    try { return /type=recovery/.test(window.location.hash || ""); }
    catch (e) { return false; }
  });
  const tmp = useRef(null);

  useEffect(() => { ponerTema(tema); }, [tema]);

  const notificar = (t, tipo="ok") => {
    setAviso({ t, tipo });
    if (tmp.current) clearTimeout(tmp.current);
    tmp.current = setTimeout(() => setAviso(null), 5000);
  };
  const fallo = (e) => notificar(e?.message || String(e), "error");

  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSesion(data.session || null));
    const { data: s } = sb.auth.onAuthStateChange((evento, ses) => {
      if (evento === "PASSWORD_RECOVERY") setRecuperando(true);
      setSesion(ses || null);
      if (!ses) { setUnidades(null); setElegida(null); setRecuperando(false); } });
    return () => s?.subscription?.unsubscribe();
  }, [sb]);

  const cargar = async () => {
    const { data, error } = await sb.rpc("mis_unidades");
    if (error) return fallo(error);
    setUnidades(data || []);
    setElegida((a) => (data || []).find((u) => u.unidad_id === a?.unidad_id) || (data || [])[0] || null);
  };
  useEffect(() => { if (sb && sesion) cargar(); }, [sb, sesion]);

  if (!cfg) return <Conexion onListo={(url,key) => setCfg({url,key})} />;
  if (sesion === undefined) return <Centro><Tarjeta>Abriendo su sesión…</Tarjeta></Centro>;
  if (!sesion) return <Entrar sb={sb} aviso={aviso} notificar={notificar} fallo={fallo} />;

  if (recuperando)
    return <ClaveNueva sb={sb} sesion={sesion} aviso={aviso} notificar={notificar}
             fallo={fallo} onListo={() => {
               setRecuperando(false);
               try { history.replaceState(null, "", location.pathname); } catch (e) {}
             }} />;

  if (unidades === null) return <Centro><Tarjeta>Cargando…</Tarjeta></Centro>;

  if (unidades.length === 0)
    return <Invitacion sb={sb} sesion={sesion} aviso={aviso}
             notificar={notificar} fallo={fallo} onListo={cargar} />;

  /* Los dos botones de la banda: sobre tinta no pueden usar el tono
     "fantasma" del tema claro, que ahí queda invisible. */
  const botonBanda = {
    padding:"8px 11px", fontSize:13, borderRadius:9, cursor:"pointer",
    fontFamily:"inherit", fontWeight:600,
    background:"rgba(255,255,255,.07)", color:T.bandaTextoOn,
    border:`1px solid ${T.bandaLinea}`,
  };

  return (
    <>
      <header style={{ background:T.bandaFondo, color:T.bandaTexto,
        borderBottom:`1px solid ${T.bandaLinea}` }}>
        <div className="flex ai-s jc-b g3"
          style={{ maxWidth:640, margin:"0 auto", padding:"16px 16px 18px" }}>
          <div style={{ minWidth:0 }}>
            {/* La banda es oscura siempre, así que el logotipo va
                siempre en su versión crema. */}
            <LogoVecitap alto={22} tema="oscuro" style={{ marginBottom:6 }} />
            <h1 style={{ fontSize:21, margin:0, fontWeight:700, color:T.bandaTextoOn }}>
              Mi condominio</h1>
            <div style={{ fontSize:12.5, color:T.bandaTexto, marginTop:3,
              overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
              {sesion.user.email}</div>
          </div>
          <div className="flex g2" style={{ flexShrink:0 }}>
            <button style={botonBanda} title="Cambiar entre claro y oscuro"
              onClick={() => { const n = tema === "oscuro" ? "claro" : "oscuro";
                               ponerTema(n); setTema(n); }}>
              {tema === "oscuro" ? "Claro" : "Oscuro"}
            </button>
            <button style={botonBanda}
              onClick={() => sb.auth.signOut()}>Salir</button>
          </div>
        </div>
      </header>

    <div style={{ maxWidth:640, margin:"0 auto", padding:"18px 16px 60px" }}>

      {aviso && (
        <div className="mb4" style={{ padding:"12px 14px", borderRadius:10, fontSize:14,
          lineHeight:1.5,
          background: aviso.tipo==="error" ? T.rojoBg : T.verdeBg,
          color: aviso.tipo==="error" ? T.rojo : T.verde,
          border:`1px solid ${T.linea}` }}>{aviso.t}</div>
      )}

      {unidades.length > 1 && (
        <div className="flex g2 wrap mb4">
          {unidades.map((u) => (
            <Boton key={u.unidad_id} tono={elegida?.unidad_id===u.unidad_id?"primario":"suave"}
              style={{ padding:"9px 13px", fontSize:13.5 }}
              onClick={() => setElegida(u)}>{u.edificio} · {u.codigo}</Boton>
          ))}
        </div>
      )}

      {elegida && <Unidad sb={sb} u={elegida} sesion={sesion}
        notificar={notificar} fallo={fallo} recargar={cargar} />}
    </div>
    </>
  );
}

/* ── Conexión (solo si no se dejó configurada arriba) ── */
function Conexion({ onListo }) {
  const [url, setUrl] = useState(leer("vecitap_url") || "");
  const [key, setKey] = useState(leer("vecitap_key") || "");
  return (
    <Centro>
      <Tarjeta>
        <h2 style={{ margin:"0 0 6px", fontSize:18 }}>Conectar</h2>
        <p style={{ color:T.tinta2, fontSize:13.5, lineHeight:1.6, marginTop:0 }}>
          Pídale a su administración la dirección y la clave pública del sistema. Se
          guardan en este teléfono y no se las vuelve a pedir.
        </p>
        <Campo label="Dirección del sistema">
          <input className="mono" value={url} onChange={(e)=>setUrl(e.target.value)}
            placeholder="https://xxxx.supabase.co" autoCapitalize="off" /></Campo>
        <Campo label="Clave pública">
          <input className="mono" value={key} onChange={(e)=>setKey(e.target.value)}
            placeholder="eyJhbGciOi…" autoCapitalize="off" /></Campo>
        <Boton style={{ width:"100%" }} onClick={() => {
          if (!url.trim() || !key.trim()) return;
          guardar("vecitap_url", url.trim()); guardar("vecitap_key", key.trim());
          onListo(url.trim(), key.trim());
        }}>Conectar</Boton>
      </Tarjeta>
    </Centro>
  );
}

/* ── Entrar o crear la cuenta ── */
function Entrar({ sb, aviso, notificar, fallo }) {
  const [modo, setModo] = useState("entrar");   // entrar · crear · olvide
  const [correo, setCorreo] = useState("");
  const [clave, setClave] = useState("");
  const [ocupado, setOcupado] = useState(false);

  /* La recuperación vuelve a ESTA misma página. Cada panel se encarga de
     la suya: así el residente no termina en la pantalla del
     administrador con una sesión a medio hacer. */
  const recuperar = async () => {
    const c = correo.trim().toLowerCase();
    if (!/.+@.+\..+/.test(c)) return notificar("Escriba su correo primero.", "error");
    setOcupado(true);
    const { error } = await sb.auth.resetPasswordForEmail(c, {
      redirectTo: window.location.href.split("#")[0].split("?")[0] });
    setOcupado(false);
    if (error) return fallo(error);
    notificar("Le mandamos un enlace a " + c + ". Revise su correo, y también la carpeta de spam.");
    setModo("entrar");
  };

  const enviar = async () => {
    if (modo === "olvide") return recuperar();
    if (!correo.trim() || !clave) return notificar("Falta el correo o la clave.", "error");
    setOcupado(true);
    const f = modo === "entrar"
      ? await sb.auth.signInWithPassword({ email: correo.trim().toLowerCase(), password: clave })
      : await sb.auth.signUp({ email: correo.trim().toLowerCase(), password: clave });
    setOcupado(false);
    if (f.error) return fallo(f.error);
    if (modo === "crear")
      notificar("Cuenta creada. Si le pedimos confirmar el correo, revise su bandeja.");
  };

  return (
    <Centro>
      <Tarjeta>
        <LogoVecitap alto={30} tema={leerTema()} style={{ marginBottom:14 }} />
        <h2 style={{ margin:"0 0 4px", fontSize:19 }}>
          {modo === "entrar" ? "Entrar"
            : modo === "crear" ? "Crear mi cuenta" : "Recuperar mi clave"}</h2>
        <p style={{ color:T.tinta2, fontSize:13.5, lineHeight:1.6, marginTop:0 }}>
          {modo === "olvide"
            ? "Le mandamos un enlace para poner una clave nueva. Va al correo con el que entra, y solo sirve una vez."
            : "Use el mismo correo al que le llegó la invitación de su administración."}
        </p>

        {aviso && (
          <div className="mb3" style={{ padding:"11px 13px", borderRadius:10, fontSize:13.5,
            lineHeight:1.5,
            background: aviso.tipo==="error" ? T.rojoBg : T.verdeBg,
            color: aviso.tipo==="error" ? T.rojo : T.verde }}>{aviso.t}</div>
        )}

        <Campo label="Correo">
          <input type="email" inputMode="email" autoCapitalize="off" value={correo}
            onChange={(e)=>setCorreo(e.target.value)} /></Campo>
        {modo !== "olvide" && (
          <Campo label="Contraseña"
            ayuda={modo==="crear" ? "Mínimo 8 caracteres." : ""}>
            <ClaveEntrada value={clave} onChange={(e)=>setClave(e.target.value)}
              autoComplete={modo==="crear" ? "new-password" : "current-password"}
              onKeyDown={(e)=> e.key==="Enter" && enviar()} /></Campo>
        )}

        <Boton style={{ width:"100%" }} disabled={ocupado} onClick={enviar}>
          {ocupado ? "Un momento…"
            : modo==="entrar" ? "Entrar"
            : modo==="crear" ? "Crear la cuenta" : "Mandarme el enlace"}</Boton>

        <div style={{ textAlign:"center", marginTop:14 }}>
          <Boton tono="fantasma" style={{ fontSize:13.5, padding:"6px 8px" }}
            onClick={() => setModo(modo==="entrar" ? "crear" : "entrar")}>
            {modo==="entrar" ? "No tengo cuenta todavía" : "Ya tengo cuenta"}</Boton>
        </div>
        {modo !== "olvide" && (
          <div style={{ textAlign:"center", marginTop:2 }}>
            <Boton tono="fantasma" style={{ fontSize:13, padding:"6px 8px" }}
              onClick={() => setModo("olvide")}>Olvidé mi clave</Boton>
          </div>
        )}
      </Tarjeta>
    </Centro>
  );
}

/* ── Volvió del correo de recuperación: poner clave nueva ──
   Supabase deja abierta una sesión especial al entrar por ese enlace.
   Mientras esa sesión está viva hay que cambiar la clave: si el usuario
   se va sin hacerlo, queda dentro sin saberlo. Por eso esta pantalla no
   tiene salida más que poner la clave o cerrar sesión. */
function ClaveNueva({ sb, sesion, aviso, notificar, fallo, onListo }) {
  const [clave, setClave] = useState("");
  const [otra, setOtra] = useState("");
  const [ocupado, setOcupado] = useState(false);

  const guardar = async () => {
    if (clave.length < 8) return notificar("La clave necesita al menos 8 caracteres.", "error");
    if (clave !== otra) return notificar("Las dos claves no son iguales.", "error");
    setOcupado(true);
    const { error } = await sb.auth.updateUser({ password: clave });
    setOcupado(false);
    if (error) return fallo(error);
    notificar("Clave cambiada. Ya puede entrar con la nueva.");
    onListo();
  };

  return (
    <Centro>
      <Tarjeta>
        <LogoVecitap alto={26} tema={leerTema()} style={{ marginBottom:14 }} />
        <h2 style={{ margin:"0 0 4px", fontSize:19 }}>Poner una clave nueva</h2>
        <p style={{ color:T.tinta2, fontSize:13.5, lineHeight:1.6, marginTop:0 }}>
          Para <b>{sesion?.user?.email}</b>. El enlace que usó no sirve otra vez.
        </p>
        {aviso && (
          <div className="mb3" style={{ padding:"11px 13px", borderRadius:10, fontSize:13.5,
            lineHeight:1.5,
            background: aviso.tipo==="error" ? T.rojoBg : T.verdeBg,
            color: aviso.tipo==="error" ? T.rojo : T.verde }}>{aviso.t}</div>
        )}
        <Campo label="Clave nueva" ayuda="Mínimo 8 caracteres.">
          <ClaveEntrada value={clave} onChange={(e)=>setClave(e.target.value)}
            autoComplete="new-password" autoFocus /></Campo>
        <Campo label="Repítala">
          <ClaveEntrada value={otra} onChange={(e)=>setOtra(e.target.value)}
            autoComplete="new-password"
            onKeyDown={(e)=> e.key==="Enter" && guardar()} /></Campo>
        <Boton style={{ width:"100%" }} disabled={ocupado} onClick={guardar}>
          {ocupado ? "Guardando…" : "Guardar la clave"}</Boton>
        <div style={{ textAlign:"center", marginTop:12 }}>
          <Boton tono="fantasma" style={{ fontSize:13 }}
            onClick={() => sb.auth.signOut()}>Cancelar y salir</Boton>
        </div>
      </Tarjeta>
    </Centro>
  );
}

/* ── Tiene cuenta pero todavía no está asociado a ninguna unidad ── */
function Invitacion({ sb, sesion, aviso, notificar, fallo, onListo }) {
  const [cod, setCod] = useState("");
  const [ocupado, setOcupado] = useState(false);

  const aceptar = async () => {
    if (!cod.trim()) return notificar("Pegue el código de la invitación.", "error");
    setOcupado(true);
    const { error } = await sb.rpc("aceptar_invitacion", { p_token: cod.trim() });
    setOcupado(false);
    if (error) return fallo(error);
    notificar("Listo, ya tiene acceso a su unidad.");
    onListo();
  };

  return (
    <Centro>
      <Tarjeta>
        <h2 style={{ margin:"0 0 6px", fontSize:18 }}>Falta un paso</h2>
        <p style={{ color:T.tinta2, fontSize:13.5, lineHeight:1.6, marginTop:0 }}>
          Su cuenta existe pero todavía no está asociada a ninguna unidad. Pegue el código
          que le envió su administración. Si no lo tiene, pídaselo: la invitación va a
          <b> {sesion.user.email}</b> y no sirve para otro correo.
        </p>
        {aviso && (
          <div className="mb3" style={{ padding:"11px 13px", borderRadius:10, fontSize:13.5,
            background: aviso.tipo==="error" ? T.rojoBg : T.verdeBg,
            color: aviso.tipo==="error" ? T.rojo : T.verde }}>{aviso.t}</div>
        )}
        <Campo label="Código de invitación">
          <input className="mono" value={cod} onChange={(e)=>setCod(e.target.value)}
            autoCapitalize="off" placeholder="a1b2c3…" /></Campo>
        <Boton style={{ width:"100%" }} disabled={ocupado} onClick={aceptar}>
          {ocupado ? "Comprobando…" : "Usar la invitación"}</Boton>
        <div style={{ textAlign:"center", marginTop:12 }}>
          <Boton tono="fantasma" style={{ fontSize:13 }}
            onClick={() => sb.auth.signOut()}>Salir</Boton>
        </div>
      </Tarjeta>
    </Centro>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   LA UNIDAD: estado, reportar el pago, mis reportes
   ═══════════════════════════════════════════════════════════════ */
function Unidad({ sb, u, sesion, notificar, fallo, recargar }) {
  const [pest, setPest] = useState("estado");
  /* La pestaña de visitas solo existe si el edificio tiene contratado
     el panel de garita. Si la consulta falla no se muestra: es
     preferible una pestaña de menos que una que da error al tocarla. */
  const [verVisitas, setVerVisitas] = useState(false);
  const [pagos, setPagos] = useState([]);
  const [recibo, setRecibo] = useState(null);
  const [falloRecibo, setFalloRecibo] = useState(null);

  const cargar = async () => {
    const { data } = await sb.from("pagos")
      .select("id,fecha,monto,moneda,monto_usd,tasa_aplicada,metodo,referencia,banco,estado,nota")
      .eq("unidad_id", u.unidad_id).order("fecha", { ascending:false }).limit(40);
    setPagos(data || []);
    /* El recibo se lee directo de la tabla, no por una función.
       La función mi_recibo() devolvía el recibo correctamente en la base
       pero cero filas a través de la API, y perseguir esa diferencia no
       vale la pena: leyendo la tabla hay una pieza menos en el camino y
       quien decide qué puede ver cada quien es la seguridad por fila,
       que es justo para lo que está.

       El orden lo pone el calendario del período, nunca la hora en que
       se escribió la fila: varios meses cerrados en una misma
       transacción comparten esa marca y el orden saldría al azar. */
    const { data: r, error: er } = await sb
      .from("recibos")
      .select("numero,total,cuota,directos,anterior,a_favor,mora,honorario," +
              "servicio,conceptos,detalle,tasa_bcv,vence_el,alicuota," +
              "periodos!inner(anio,mes,etiqueta,estado)")
      .eq("unidad_id", u.unidad_id)
      .eq("periodos.estado", "cerrado")
      .limit(36);

    /* La tasa de HOY, no la del día en que se emitió el recibo.
       La deuda está en dólares: lo que el propietario va a pagar en
       bolívares se calcula con la tasa del día en que pague, y esa es
       la que hay que enseñarle. Mostrar la congelada le dice que debe
       menos de lo que debe, transfiere de menos y queda debiendo un
       resto que nadie entiende de dónde salió. */
    const { data: tv } = await sb.rpc("tasa_atrasada");
    const filaTasa = Array.isArray(tv) ? tv[0] : tv;
    const tasaHoy = filaTasa && Number(filaTasa.tasa) > 0
      ? { valor: Number(filaTasa.tasa), fecha: filaTasa.fecha, dias: filaTasa.dias }
      : null;

    if (er) { setFalloRecibo(er.message || String(er)); setRecibo(null); }
    else {
      const filas = (r || []).slice().sort((a, b) =>
        (b.periodos.anio - a.periodos.anio) || (b.periodos.mes - a.periodos.mes));
      const ult = filas[0];
      setFalloRecibo(null);
      setRecibo(ult ? { ...ult, anio: ult.periodos.anio, mes: ult.periodos.mes,
                        etiqueta: ult.periodos.etiqueta, edificio: u.edificio,
                        tasaHoy } : null);
    }
  };
  useEffect(() => { cargar(); }, [u.unidad_id]);

  useEffect(() => {
    let vivo = true;
    sb.rpc("mis_modulos", { p_edificio: u.edificio_id }).then(({ data, error }) => {
      if (!vivo || error) return;
      const g = (data || []).find((m) => m.clave === "garita");
      setVerVisitas(!!(g && g.activo));
    });
    return () => { vivo = false; };
  }, [u.edificio_id]);

  const mios = pagos.filter((p) => true);   // la base ya decide qué puede ver

  return (
    <>
      <Tarjeta style={{ marginBottom:16 }}>
        <div className="flex ai-s jc-b g3 wrap">
          <div>
            <div style={{ fontSize:12, color:T.tenue, textTransform:"uppercase",
              letterSpacing:".08em" }}>{u.edificio}</div>
            <div style={{ fontSize:26, fontWeight:700, lineHeight:1.15 }}>{u.codigo}</div>
            <div style={{ fontSize:12.5, color:T.tinta2, marginTop:2 }}>
              {u.relacion === "inquilino" ? "Inquilino" : "Propietario"} ·
              alícuota <span className="mono">{nf(4).format(u.alicuota)}%</span>
            </div>
          </div>
          <div style={{ textAlign:"right" }}>
            {u.saldo === null ? (
              <div style={{ fontSize:13, color:T.tenue, maxWidth:170, lineHeight:1.5 }}>
                Su administración no muestra el saldo acumulado en esta unidad.
              </div>
            ) : (
              <>
                <div style={{ fontSize:12, color:T.tenue }}>
                  {Number(u.saldo) > 0 ? "Debe" : Number(u.saldo) < 0 ? "A su favor" : "Al día"}</div>
                <div className="mono" style={{ fontSize:26, fontWeight:700,
                  color: Number(u.saldo) > 0 ? T.rojo : T.verde }}>
                  {usd(Math.abs(Number(u.saldo)))}</div>
              </>
            )}
          </div>
        </div>
      </Tarjeta>

      <div className="flex g2 mb4">
        {[["estado","Mi recibo"],["reportar","Reportar un pago"],["pagos","Mis pagos"],
          ...(verVisitas ? [["visitas","Mis visitas"]] : [])].map(([k,t]) => (
          <Boton key={k} tono={pest===k?"primario":"suave"} onClick={()=>setPest(k)}
            style={{ flex:1, padding:"10px 8px", fontSize:13.5 }}>{t}</Boton>
        ))}
      </div>

      {pest === "estado" && <Recibo u={u} recibo={recibo} falla={falloRecibo} />}

      {pest === "reportar" && (
        <Reportar sb={sb} u={u} sesion={sesion} notificar={notificar} fallo={fallo}
          onListo={() => { cargar(); recargar(); setPest("pagos"); }} />
      )}

      {pest === "pagos" && <MisPagos sb={sb} pagos={mios} />}

      {pest === "visitas" && verVisitas && (
        <Visitas sb={sb} u={u} notificar={notificar} fallo={fallo} />
      )}
    </>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   RECIBO EN PAPEL · una sola plantilla para la aplicación y el portal
   ─────────────────────────────────────────────────────────────────
   Decisiones de diseño, para que nadie las deshaga sin querer:

   · Todo va dentro de una <table> con <thead>. Es la única forma que
     respetan todos los navegadores para REPETIR EL ENCABEZADO cuando
     el recibo se pasa a una segunda hoja.
   · El desglose va a dos columnas. Un edificio con 25 partidas cabía
     en dos hojas con una sola columna y cabe en una con dos.
   · Los cortes de categoría llevan break-inside: avoid, así una
     categoría no se parte por la mitad entre columnas ni entre hojas.
   · print-color-adjust: exact para que los fondos de marca salgan
     impresos; sin eso el navegador los blanquea "para ahorrar tinta".
   ═════════════════════════════════════════════════════════════════ */
/* ── Mis visitas · invitar, anular y ver quién entró ──

   El código de la invitación es lo único que viaja en el QR: no lleva
   dentro ni la unidad ni el nombre de nadie. Un código perdido o
   reenviado no dice a quién iban a visitar, y de todos modos vence y
   se gasta al usarse.

   El QR se dibuja acá en el teléfono, no lo manda la base: así el
   código no pasa por ningún servicio de imágenes de terceros. */
function Visitas({ sb, u, notificar, fallo }) {
  const [inv, setInv] = useState([]);
  const [visitas, setVisitas] = useState([]);
  const [autos, setAutos] = useState([]);
  const [nueva, setNueva] = useState(null);      // la recién creada, con su QR
  const [qr, setQr] = useState("");
  const [tarjeta, setTarjeta] = useState("");    // el QR con marca, para compartir
  /* La tarjeta del código aparece ARRIBA del formulario y de la lista.
     Quien la pide está mirando más abajo, así que sin esto la tarjeta
     sale fuera de la pantalla y parece que el botón no hizo nada.
     Pasó de verdad: "cuando le das ver el código, no se carga nada". */
  const refCodigo = useRef(null);
  useEffect(() => {
    if (!nueva || !refCodigo.current) return;
    try {
      refCodigo.current.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (e) {
      refCodigo.current.scrollIntoView();
    }
  }, [nueva]);
  const [ocupado, setOcupado] = useState(false);
  const [f, setF] = useState({ nombre:"", documento:"", placa:"", usos:"1",
                               hasta: "" });
  const [auto, setAuto] = useState({ placa:"", marca:"", modelo:"", color:"", puesto:"" });

  const enDosHoras = () => {
    const d = new Date(Date.now() + 2 * 3600 * 1000);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  };

  const cargar = async () => {
    const [ri, rv, ra] = await Promise.all([
      sb.from("invitaciones_visita")
        .select("id,codigo,nombre,documento,placa,desde,hasta,usos,usos_max,estado")
        .eq("unidad_id", u.unidad_id).order("creada_en", { ascending:false }).limit(20),
      sb.rpc("mis_visitas", { p_unidad: u.unidad_id, p_limite: 20 }),
      sb.from("vehiculos").select("id,placa,marca,modelo,color,puesto,activo")
        .eq("unidad_id", u.unidad_id).order("placa"),
    ]);
    if (ri.error) fallo(ri.error); else setInv(ri.data || []);
    if (rv.error) fallo(rv.error); else setVisitas(rv.data || []);
    if (ra.error) fallo(ra.error); else setAutos(ra.data || []);
  };
  useEffect(() => { setF((x) => ({ ...x, hasta: enDosHoras() })); cargar(); }, [u.unidad_id]);

  /* El dibujante del QR se baja solo cuando de verdad hace falta, y si
     no se puede bajar queda el código en letras grandes: la garita
     siempre lo puede escribir a mano.

     Con el QR se arma una TARJETA: el código, a quién pertenece, la
     unidad, hasta cuándo vale, y abajo la marca. Eso es lo que se manda
     por WhatsApp o se descarga — un QR suelto no le dice nada a quien
     lo recibe tres días después. */
  const armarTarjeta = async (inv) => {
    setQr(""); setTarjeta("");
    let url = "";
    try {
      const m = await import("https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm");
      const QR = m.default || m;
      url = await QR.toDataURL(inv.codigo, { margin: 1, width: 560,
        color: { dark: "#0A1128", light: "#FFFFFF" } });
      setQr(url);
    } catch (e) { setQr(""); return; }

    try { setTarjeta(await componerTarjeta(inv, url)); } catch (e) { setTarjeta(""); }
  };

  const cargarImagen = (src) => new Promise((ok, mal) => {
    const i = new Image();
    i.onload = () => ok(i);
    i.onerror = mal;
    i.src = src;
  });

  const componerTarjeta = async (inv, qrUrl) => {
    const W = 760, H = 1060, P = 28;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const x = c.getContext("2d");

    x.fillStyle = "#F8FAFC"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#FFFFFF";
    if (x.roundRect) { x.beginPath(); x.roundRect(P, P, W - P * 2, H - P * 2, 26); x.fill(); }
    else x.fillRect(P, P, W - P * 2, H - P * 2);

    const centro = (t, y, font, color) => {
      x.font = font; x.fillStyle = color; x.textAlign = "center";
      x.fillText(t, W / 2, y);
    };
    const F = "-apple-system, Segoe UI, Roboto, Arial, sans-serif";
    const M = "ui-monospace, Menlo, Consolas, monospace";

    centro((u.edificio || "").toUpperCase(), 104, "600 21px " + F, "#64748B");
    centro("Unidad " + (u.codigo || ""), 142, "700 30px " + F, "#0A1128");
    centro("Visita de", 200, "400 20px " + F, "#64748B");
    centro(inv.nombre || "", 240, "700 34px " + F, "#0A1128");

    const qr = await cargarImagen(qrUrl);
    const lado = 420, qx = (W - lado) / 2, qy = 286;
    x.fillStyle = "#FFFFFF"; x.fillRect(qx - 14, qy - 14, lado + 28, lado + 28);
    x.drawImage(qr, qx, qy, lado, lado);

    centro(inv.codigo || "", qy + lado + 58, "700 27px " + M, "#0A1128");
    if (inv.hasta) {
      const d = new Date(inv.hasta).toLocaleString("es-VE",
        { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
      centro("Vence el " + d, qy + lado + 96, "400 21px " + F, "#92400E");
    }
    centro("Muéstrelo en la garita", qy + lado + 134, "400 20px " + F, "#64748B");

    // El pie de marca: "powered by" y el logo, como en el recibo
    const yPie = H - 96;
    x.strokeStyle = "#E4E9F0"; x.lineWidth = 1;
    x.beginPath(); x.moveTo(P + 40, yPie - 34); x.lineTo(W - P - 40, yPie - 34); x.stroke();
    centro("powered by", yPie, "400 17px " + F, "#64748B");
    try {
      const logo = await cargarImagen("logo-claro.png");
      const alto = 30, ancho = logo.width * (alto / logo.height);
      x.drawImage(logo, (W - ancho) / 2, yPie + 12, ancho, alto);
    } catch (e) {
      centro("vecitap", yPie + 36, "700 27px " + F, "#0A1128");
    }
    return c.toDataURL("image/png");
  };

  const nombreArchivo = (inv) =>
    "visita-" + String(inv.nombre || "invitado").normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-")
      .toLowerCase().replace(/^-|-$/g, "") + ".png";

  const descargar = (inv) => {
    if (!tarjeta) return notificar("La imagen todavía se está armando.", "error");
    const a = document.createElement("a");
    a.href = tarjeta; a.download = nombreArchivo(inv);
    document.body.appendChild(a); a.click(); a.remove();
  };

  const copiarImagen = async (inv) => {
    if (!tarjeta) return notificar("La imagen todavía se está armando.", "error");
    try {
      const blob = await (await fetch(tarjeta)).blob();
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      notificar("Imagen copiada. Péguela donde quiera.");
    } catch (e) {
      try {
        await navigator.clipboard.writeText(inv.codigo);
        notificar("Su navegador no copia imágenes. Se copió el código.", "error");
      } catch (e2) {
        notificar("No se pudo copiar. Use Descargar.", "error");
      }
    }
  };

  const porWhatsApp = async (inv) => {
    const txt = `Hola ${inv.nombre}: este es su acceso a ${u.edificio}, unidad ` +
      `${u.codigo}. Muestre el código en la garita.\n\n${inv.codigo}`;
    try {
      if (tarjeta && navigator.canShare) {
        const blob = await (await fetch(tarjeta)).blob();
        const arch = new File([blob], nombreArchivo(inv), { type: "image/png" });
        if (navigator.canShare({ files: [arch] })) {
          await navigator.share({ files: [arch], text: txt });
          return;
        }
      }
    } catch (e) { /* si cancela o no se puede, se cae al enlace de abajo */ }
    window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
  };

  const crear = async () => {
    const nombre = (f.nombre || "").trim();
    if (!nombre) return notificar("Falta el nombre de la visita.", "error");
    if (!f.hasta) return notificar("Falta hasta cuándo vale la invitación.", "error");
    setOcupado(true);
    const { data, error } = await sb.rpc("crear_invitacion_visita", {
      p_unidad: u.unidad_id, p_nombre: nombre,
      p_hasta: new Date(f.hasta).toISOString(),
      p_documento: (f.documento || "").trim() || null,
      p_placa: (f.placa || "").trim() || null,
      p_desde: null, p_usos: Math.max(1, parseInt(f.usos, 10) || 1), p_nota: null });
    setOcupado(false);
    if (error) return fallo(error);
    const r = Array.isArray(data) ? data[0] : data;
    if (!r) return;
    setNueva({ ...r, nombre });
    armarTarjeta({ ...r, nombre });
    setF({ nombre:"", documento:"", placa:"", usos:"1", hasta: enDosHoras() });
    cargar();
  };

  const anular = async (id) => {
    const { error } = await sb.rpc("anular_invitacion_visita", { p_invitacion: id });
    if (error) return fallo(error);
    notificar("Invitación anulada.");
    if (nueva && nueva.id === id) { setNueva(null); setQr(""); setTarjeta(""); }
    cargar();
  };

  const guardarAuto = async () => {
    const placa = (auto.placa || "").trim().toUpperCase();
    if (!placa) return notificar("Falta la placa.", "error");
    const { error } = await sb.from("vehiculos").insert({
      org_id: u.org_id, edificio_id: u.edificio_id, unidad_id: u.unidad_id,
      placa, marca: auto.marca || null, modelo: auto.modelo || null,
      color: auto.color || null, puesto: auto.puesto || null });
    if (error) return fallo(error);
    setAuto({ placa:"", marca:"", modelo:"", color:"", puesto:"" });
    notificar("Vehículo agregado a la lista del edificio.");
    cargar();
  };

  const quitarAuto = async (id) => {
    const { error } = await sb.from("vehiculos").delete().eq("id", id);
    if (error) return fallo(error);
    notificar("Vehículo quitado.");
    cargar();
  };

  const fechaHora = (t) => t
    ? new Date(t).toLocaleString("es-VE",
        { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" })
    : "—";

  const activas = inv.filter((i) => i.estado === "activa"
    && new Date(i.hasta) > new Date() && i.usos < i.usos_max);

  return (
    <div className="grid g3">

      {nueva && (
        <div ref={refCodigo}>
        <Tarjeta style={{ textAlign:"center" }}>
          <div style={{ fontSize:12, color:T.tinta2, textTransform:"uppercase",
            letterSpacing:".08em", fontWeight:600 }}>Código para {nueva.nombre}</div>
          {tarjeta
            ? <img src={tarjeta} alt="Invitación con el código QR"
                style={{ width:"100%", maxWidth:300, margin:"14px auto 4px",
                  display:"block", borderRadius:12 }} />
            : qr
              ? <img src={qr} alt="Código QR de la invitación"
                  style={{ width:220, height:220, margin:"14px auto 8px", display:"block",
                    borderRadius:12, background:"#fff", padding:8 }} />
              : <div style={{ fontSize:13, color:T.tenue, margin:"14px 0 8px" }}>
                  Armando la imagen… Si no aparece, pase el código escrito.</div>}
          <div className="mono" style={{ fontSize:19, fontWeight:700, letterSpacing:".06em",
            wordBreak:"break-all", marginTop:10 }}>{nueva.codigo}</div>
          <div style={{ fontSize:12.5, color:T.tenue, marginTop:8, lineHeight:1.5 }}>
            Muéstrelo en la garita. Vence solo y se gasta al usarse.
          </div>
          <div className="flex g2 wrap" style={{ justifyContent:"center", marginTop:14 }}>
            <Boton onClick={() => porWhatsApp(nueva)}>Enviar por WhatsApp</Boton>
            <Boton tono="suave" onClick={() => descargar(nueva)}>Descargar</Boton>
            <Boton tono="suave" onClick={() => copiarImagen(nueva)}>Copiar imagen</Boton>
          </div>
          <div style={{ marginTop:10 }}>
            <Boton tono="fantasma" style={{ fontSize:13 }}
              onClick={() => { setNueva(null); setQr(""); setTarjeta(""); }}>Listo</Boton>
          </div>
        </Tarjeta>
        </div>
      )}

      <Tarjeta>
        <h3 style={{ fontSize:16, fontWeight:700, margin:"0 0 14px" }}>Invitar a alguien</h3>
        <Campo label="Nombre de quien viene">
          <input value={f.nombre} onChange={(e)=>setF({...f, nombre:e.target.value})}
            placeholder="Nombre y apellido" /></Campo>
        <Campo label="Hasta cuándo vale">
          <input type="datetime-local" className="mono" value={f.hasta}
            onChange={(e)=>setF({...f, hasta:e.target.value})} /></Campo>
        <div className="flex g2 wrap">

          <Campo label="Placa (opcional)">

        <p style={{ fontSize:12.5, color:T.tenue, margin:"0 0 14px" }}>

        </p>
        {activas.length === 0
          ? <div style={{ fontSize:13.5, color:T.tenue }}>No hay invitaciones activas.</div>
          : <div className="grid" style={{ gap:8 }}>

                <div key={i.id} className="flex ai-c jc-b g3 wrap"

                  <div>
                    <div style={{ fontSize:14.5, fontWeight:600 }}>{i.nombre}</div>
                    <div style={{ fontSize:12, color:T.tenue }}>
                      Hasta {fechaHora(i.hasta)} · {i.usos} de {i.usos_max} usadas
                    </div>
                  </div>
                  <div className="flex g2">
                    <Boton tono="suave" onClick={() => { setNueva(i); armarTarjeta(i); }}
                      style={{ padding:"8px 12px", fontSize:13 }}>Ver el código</Boton>
                    <Boton tono="fantasma" onClick={() => anular(i.id)}
                      style={{ padding:"8px 12px", fontSize:13, color:T.rojo }}>Anular</Boton>
                  </div>
                </div>
              ))}
            </div>}
      </Tarjeta>

      <Tarjeta>
        <h3 style={{ fontSize:16, fontWeight:700, margin:"0 0 4px" }}>Mis vehículos</h3>
        <p style={{ fontSize:12.5, color:T.tenue, margin:"0 0 14px" }}>
          La garita usa esta lista para saber qué carros son del edificio.
        </p>
        {autos.length > 0 && (
          <div className="grid" style={{ gap:8, marginBottom:14 }}>
            {autos.map((v) => (
              <div key={v.id} className="flex ai-c jc-b g3 wrap"
                style={{ background:T.papel, borderRadius:10, padding:"11px 13px" }}>
                <div>
                  <div className="mono" style={{ fontSize:15, fontWeight:700 }}>{v.placa}</div>
                  <div style={{ fontSize:12, color:T.tenue }}>
                    {[v.marca, v.modelo, v.color].filter(Boolean).join(" ") || "sin detalle"}
                    {v.puesto ? ` · puesto ${v.puesto}` : ""}
                  </div>
                </div>
                <Boton tono="fantasma" onClick={() => quitarAuto(v.id)}
                  style={{ padding:"8px 12px", fontSize:13, color:T.rojo }}>Quitar</Boton>
              </div>
            ))}
          </div>
        )}
        <div className="flex g2 wrap">
          <Campo label="Placa">
            <input className="mono" value={auto.placa} autoCapitalize="characters"
              onChange={(e)=>setAuto({...auto, placa:e.target.value})}
              placeholder="AB123CD" /></Campo>
          <Campo label="Marca y modelo">
            <input value={auto.marca}
              onChange={(e)=>setAuto({...auto, marca:e.target.value})}
              placeholder="Toyota Corolla" /></Campo>
        </div>
        <div className="flex g2 wrap">
          <Campo label="Color">
            <input value={auto.color}
              onChange={(e)=>setAuto({...auto, color:e.target.value})} /></Campo>
          <Campo label="Puesto (opcional)">
            <input value={auto.puesto}
              onChange={(e)=>setAuto({...auto, puesto:e.target.value})} /></Campo>
        </div>
        <Boton tono="suave" onClick={guardarAuto} style={{ width:"100%" }}>
          Agregar el vehículo</Boton>
      </Tarjeta>

      <Tarjeta>
        <h3 style={{ fontSize:16, fontWeight:700, margin:"0 0 14px" }}>Quién ha entrado</h3>
        {visitas.length === 0
          ? <div style={{ fontSize:13.5, color:T.tenue }}>Todavía no hay visitas registradas.</div>
          : <div className="grid" style={{ gap:8 }}>
              {visitas.map((v, i) => (
                <div key={i} className="flex ai-c jc-b g3 wrap"
                  style={{ background:T.papel, borderRadius:10, padding:"11px 13px" }}>
                  <div>
                    <div style={{ fontSize:14.5, fontWeight:600 }}>{v.nombre}</div>
                    <div style={{ fontSize:12, color:T.tenue }}>
                      {fechaHora(v.entrada_en)}
                      {v.placa ? ` · ${v.placa}` : ""}
                      {v.tipo === "anunciada" ? " · anunciada" : " · sin anunciar"}
                    </div>
                  </div>
                  <span style={{ fontSize:12, fontWeight:600,
                    color: v.estado === "dentro" ? T.ambar : T.tenue }}>
                    {v.estado === "dentro" ? "Adentro" : "Salió " + fechaHora(v.salida_en)}
                  </span>
                </div>
              ))}
            </div>}
      </Tarjeta>
    </div>
  );
}

function papelRecibo(d) {
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const nf = (n) => new Intl.NumberFormat("es-VE",
    { minimumFractionDigits: n, maximumFractionDigits: n });
  const m = (v) => "$ " + nf(2).format(Number(v) || 0);
  const r = d.recibo || {};
  const det = Array.isArray(r.detalle) ? r.detalle : [];
  const con = Array.isArray(r.conceptos) ? r.conceptos : [];
  const base = (typeof location !== "undefined")
    ? String(location.href).replace(/[^/]*$/, "") : "";

  const linea = (t, v, cls) =>
    `<tr class="${cls || ""}"><td>${esc(t)}</td><td class="d">${m(v)}</td></tr>`;

  const resumen = [
    ...con.map((l) => linea(l.nombre, l.monto)),
    Number(r.directos) > 0 ? linea("Cargos de su unidad", r.directos) : "",
    Number(r.anterior) > 0 ? linea("Saldo del mes anterior", r.anterior) : "",
    Number(r.a_favor)  > 0 ? linea("A su favor", -r.a_favor) : "",
    Number(r.mora)     > 0 ? linea("Intereses de mora", r.mora) : "",
    linea("Total", r.total, "tot"),
  ].join("");

  /* Con pocas partidas, dos columnas dejan la hoja medio vacía y cada
     concepto apretado en la mitad del ancho. El desglose decide solo:
     hasta 14 renglones va a todo el ancho, de ahí en adelante a dos
     columnas. El corte no es un capricho: 14 renglones a una columna
     ocupan más o menos lo mismo que 28 a dos, y por debajo de eso la
     página se ve rota. */
  const renglones = det.reduce((n, c) => n + 1 + (c.lineas || []).length, 0);
  const anchoCompleto = renglones <= 14;

  const desglose = det.map((cat) => `<div class="cat">
      <div class="cn">${esc(cat.categoria)}</div>
      <table class="dt">${(cat.lineas || []).map((l) => `<tr>
        <td class="c">${esc(l.concepto)}${l.referencia
          ? `<span class="rf"> · ${esc(l.referencia)}</span>` : ""}</td>
        <td class="d gr">${m(l.monto)}</td>
        <td class="d pa">${m(l.parte)}</td></tr>`).join("")}</table>
    </div>`).join("");

  const cab = `
    <div class="cab">
      <div class="cab-i">
        ${d.logoOrg ? `<img class="logo-org" src="${esc(d.logoOrg)}" alt="">` : ""}
        <div>
          <div class="ed">${esc(d.edificio || "")}</div>
          <div class="or">${esc(d.rif ? "RIF " + d.rif + " · " : "")}${esc(d.organizacion || "")}</div>
        </div>
      </div>
      <div class="cab-d">
        <div class="et">Recibo</div>
        <div class="nu">${esc(r.numero || "")}</div>
        <div class="or">${esc(r.etiqueta || "")}</div>
      </div>
    </div>
    <div class="uni">
      <div><span class="et">Unidad</span><div class="ud">${esc(d.unidad || "")}</div></div>
      <div><span class="et">Alícuota</span><div class="uv">${nf(4).format(r.alicuota || 0)} %</div></div>
      ${d.propietario ? `<div class="pr"><span class="et">Propietario</span>
        <div class="uv">${esc(d.propietario)}</div></div>` : ""}
    </div>`;

  return `<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>${esc(r.numero || "Recibo")}</title>
<style>
  @page { size: Letter; margin: 12mm 13mm 10mm; }
  *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact }
  html,body{ margin:0; padding:0 }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        color:#0A1128; font-size:9.5pt; line-height:1.35 }

  .hoja{ width:100%; border-collapse:collapse }
  .hoja > thead{ display:table-header-group }
  .hoja > thead > tr > td,
  .hoja > tbody > tr > td{ padding:0; border:0 }

  /* ── Encabezado, se repite en cada hoja ── */
  .cab{ display:flex; justify-content:space-between; align-items:flex-start;
        gap:16px; padding-bottom:9px; border-bottom:2.5px solid #0A1128 }
  .cab-i{ display:flex; align-items:center; gap:10px }
  .logo-org{ max-height:34px; max-width:120px }
  .ed{ font-size:15pt; font-weight:700; letter-spacing:-.01em; line-height:1.1 }
  .or{ font-size:8pt; color:#64748B; margin-top:1px }
  .cab-d{ text-align:right; white-space:nowrap }
  .et{ font-size:6.7pt; text-transform:uppercase; letter-spacing:.1em;
       color:#64748B; font-weight:700; display:block }
  .nu{ font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
       font-size:11pt; font-weight:700; letter-spacing:-.02em }

  .uni{ display:flex; gap:26px; padding:8px 0 10px; border-bottom:1px solid #DDE3EC }
  .ud{ font-size:15pt; font-weight:700; line-height:1.1;
       font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace }
  .uv{ font-size:10pt; font-weight:600; line-height:1.25; margin-top:2px }
  .pr{ max-width:52% }

  /* ── Cifra principal ── */
  .plata{ display:flex; align-items:stretch; gap:0; margin:11px 0 12px;
          border:1.5px solid #0A1128; border-radius:9px; overflow:hidden }
  .plata > div{ padding:9px 13px; flex:1 }
  .plata > div + div{ border-left:1px solid #CBD5E1 }
  .plata .fuerte{ background:#0A1128; color:#F8FAFC; flex:0 0 34% }
  .plata .fuerte .et{ color:#A3B4D4 }
  .cifra{ font-size:19pt; font-weight:700; letter-spacing:-.02em; line-height:1.15;
          font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace }
  .cifra-s{ font-size:12pt; white-space:nowrap; font-weight:700; line-height:1.2;
            font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace }
  .nota-t{ font-size:7.4pt; color:#64748B; margin-top:2px }
  .vence{ color:#92400E }

  /* ── Resumen ── */
  table.res{ width:100%; border-collapse:collapse; margin-bottom:13px }
  table.res td{ padding:5px 0; border-bottom:1px solid #DDE3EC; font-size:9.5pt }
  table.res td.d{ text-align:right; white-space:nowrap;
                  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace }
  table.res tr.tot td{ font-weight:700; font-size:11pt; border-bottom:0;
                       border-top:1.5px solid #0A1128; padding-top:7px }

  /* ── Desglose a dos columnas ── */
  h2{ font-size:8.5pt; text-transform:uppercase; letter-spacing:.1em;
      margin:0 0 2px; font-weight:700 }
  .ayuda{ font-size:7.8pt; color:#64748B; margin:0 0 8px }
  .cols{ column-count:2; column-gap:20px; column-rule:1px solid #DDE3EC }
  /* Pocas partidas: una sola columna a todo el ancho, con el renglón
     un poco más suelto porque sobra sitio. */
  .cols.uno{ column-count:1 }
  .cols.uno table.dt td{ padding:3.4px 0; font-size:9pt }
  .cols.uno table.dt td.gr{ font-size:8.3pt }
  .cols.uno .cn{ font-size:7.4pt; padding-bottom:3px; margin-bottom:3px }
  .cols.uno .cat{ margin-bottom:12px }
  .cols.uno table.dt td.c{ padding-right:14px }
  .cat{ break-inside:avoid; page-break-inside:avoid; margin-bottom:9px }
  .cn{ font-size:7pt; text-transform:uppercase; letter-spacing:.09em;
       color:#F98513; font-weight:700; padding-bottom:2px;
       border-bottom:1px solid #CBD5E1; margin-bottom:2px }
  table.dt{ width:100%; border-collapse:collapse }
  table.dt td{ padding:2.2px 0; font-size:8.3pt; vertical-align:top }
  table.dt td.c{ padding-right:6px }
  table.dt td.d{ text-align:right; white-space:nowrap;
                 font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace }
  table.dt td.gr{ color:#64748B; font-size:7.8pt; padding-right:7px }
  table.dt td.pa{ font-weight:600 }
  .rf{ color:#64748B; font-size:7.4pt }

  /* ── Pie ── */
  .pie{ margin-top:14px; padding-top:8px; border-top:1px solid #CBD5E1;
        display:flex; justify-content:space-between; align-items:flex-end; gap:18px }
  .pie p{ margin:0; font-size:7.4pt; color:#64748B; line-height:1.5; max-width:74% }
  .marca{ text-align:right; white-space:nowrap }
  .marca span{ font-size:6.5pt; color:#64748B; letter-spacing:.05em;
               display:block; margin-bottom:2px }
  .marca img{ height:15px }
  .marca b{ font-size:9pt; color:#0A1128 }
</style></head><body>

<table class="hoja"><thead><tr><td>${cab}</td></tr></thead>
<tbody><tr><td>

  <div class="plata">
    <div class="fuerte">
      <span class="et">Total a pagar</span>
      <div class="cifra">${m(r.total)}</div>
    </div>
    ${(() => {
      /* La tasa del PAPEL tiene que ser la de hoy, no la de la emisión.
         Este documento se genera en el momento en que alguien lo pide y
         es el que la persona se lleva al banco: si trae la tasa vieja,
         transfiere de menos y queda debiendo un resto que no entiende.
         Se estampa la fecha de la tasa para que el papel envejezca a la
         vista y no engañe a quien lo encuentre dentro de dos semanas. */
      const viva = Number(d.tasaHoy && d.tasaHoy.valor) > 0;
      const t = viva ? Number(d.tasaHoy.valor) : Number(r.tasa_bcv);
      if (!(t > 0)) return "";
      const cuando = viva && d.tasaHoy.fecha
        ? " del " + String(d.tasaHoy.fecha).split("-").reverse().join("/")
        : "";
      return `<div>
      <span class="et">Referencial en bolívares</span>
      <div class="cifra-s">Bs ${nf(2).format(Number(r.total) * t)}</div>
      <div class="nota-t">tasa ${nf(2).format(t)}${cuando}${viva ? "" : " · del recibo"}</div>
    </div>`;
    })()}
    ${d.vence ? `<div>
      <span class="et">Vence</span>
      <div class="cifra-s vence">${esc(d.vence)}</div>
      <div class="nota-t">después de esa fecha corre mora</div>
    </div>` : ""}
  </div>

  <table class="res">${resumen}</table>

  ${desglose ? `<h2>En qué se gastó este mes</h2>
  <p class="ayuda">A la izquierda el gasto completo del edificio; a la derecha la parte que
     le toca según su alícuota.</p>
  <div class="cols${anchoCompleto ? " uno" : ""}">${desglose}</div>` : ""}

  <div class="pie">
    <p>Lo que se debe está en dólares. La cifra en bolívares vale para el día
       que dice arriba: si paga otro día, la conversión se hace con la tasa del Banco
       Central de ese día y el monto en bolívares será distinto.${d.organizacion
       ? " Emitido por " + esc(d.organizacion) + "." : ""}</p>
    <div class="marca">
      <span>powered by</span>
      <img src="${base}logo-claro.png" alt="Vecitap"
           onerror="this.outerHTML='<b>vecitap</b>'">
    </div>
  </div>

</td></tr></tbody></table>
</body></html>`;
}

function Recibo({ u, recibo, falla }) {
  /* Este estado va arriba de todo: un hook detrás de un return solo se
     ejecuta a veces, y React tumba la pantalla entera cuando la cuenta
     le cambia entre un dibujado y otro. */
  const [abierto, setAbierto] = useState(false);

  /* Un error de la base y "todavía no hay recibo" son cosas distintas y
     antes se veían igual. Ahora el error se dice. */
  if (falla) return (
    <Tarjeta><div style={{ color:T.rojo, fontSize:14, lineHeight:1.6 }}>
      No se pudo traer su recibo. Muéstrele este mensaje a su administración:
      <div className="mono" style={{ marginTop:8, fontSize:12.5, color:T.tinta2,
        background:T.papel, padding:10, borderRadius:8 }}>{falla}</div>
    </div></Tarjeta>
  );
  if (!recibo) return (
    <Tarjeta><div style={{ color:T.tinta2, fontSize:14, lineHeight:1.6 }}>
      {u.recibo_numero
        ? <>Su recibo <b className="mono">{u.recibo_numero}</b> de {u.recibo_periodo} existe,
            pero esta pantalla no logró traer el detalle. Avísele a su administración.</>
        : <>Todavía no hay ningún recibo emitido para esta unidad. Aparece aquí en cuanto su
            administración cierre el mes.</>}
    </div></Tarjeta>
  );
  const lineas = Array.isArray(recibo.conceptos) ? recibo.conceptos : [];
  const det    = Array.isArray(recibo.detalle)   ? recibo.detalle   : [];
  const fila = (t, v, fuerte) => (
    <div className="flex jc-b g3" style={{ padding:"9px 0",
      borderBottom:`1px solid ${T.linea}`, fontWeight: fuerte?700:400 }}>
      <span style={{ color: fuerte?T.tinta:T.tinta2 }}>{t}</span>
      <span className="mono">{usd(v)}</span>
    </div>
  );
  return (
    <Tarjeta>
      <div className="flex jc-b ai-c g3 mb3 wrap">
        <div>
          <div style={{ fontSize:12, color:T.tenue }}>Recibo</div>
          <div className="mono" style={{ fontSize:16, fontWeight:600 }}>{recibo.numero}</div>
        </div>
        {(() => {
          /* Se usa la tasa viva. Solo si la base no la dio se cae a la
             del recibo, y entonces se dice de cuándo es. */
          const viva = recibo.tasaHoy && recibo.tasaHoy.valor > 0;
          const tasa = viva ? recibo.tasaHoy.valor : Number(recibo.tasa_bcv);
          if (!(tasa > 0)) return null;
          return (
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:12, color:T.tenue }}>Si paga hoy</div>
              <div className="mono" style={{ fontSize:15, fontWeight:600 }}>
                {bs(Number(recibo.total) * tasa)}</div>
              <div style={{ fontSize:11, color:T.tenue }}>
                tasa {nf(2).format(tasa)}{viva ? " de hoy" : " del recibo"}
              </div>
            </div>
          );
        })()}
      </div>

      {lineas.map((l, i) => fila(l.nombre, l.monto))}
      {Number(recibo.directos) > 0 && fila("Cargos de su unidad", recibo.directos)}
      {Number(recibo.anterior) > 0 && fila("Saldo del mes anterior", recibo.anterior)}
      {Number(recibo.a_favor)  > 0 && fila("A su favor", -recibo.a_favor)}
      {Number(recibo.mora)     > 0 && fila("Intereses de mora", recibo.mora)}
      {fila("Total", recibo.total, true)}

      {recibo.vence_el && (
        <div style={{ marginTop:12, padding:"10px 12px", borderRadius:9,
          background:T.ambarBg, color:T.ambar, fontSize:13, fontWeight:600 }}>
          Vence el {fechaLarga(recibo.vence_el)}
        </div>
      )}

      {/* En qué se fue la plata. Es lo primero que pregunta cualquiera
          que recibe un recibo de condominio, y hasta ahora no estaba. */}
      {det.length > 0 && (
        <div style={{ marginTop:16, borderTop:`1px solid ${T.linea}`, paddingTop:14 }}>
          <button onClick={() => setAbierto(!abierto)}
            style={{ background:"none", border:"none", padding:0, cursor:"pointer",
              color:T.tinta, fontSize:14, fontWeight:600, fontFamily:"inherit" }}>
            {abierto ? "Ocultar" : "Ver"} en qué se gastó este mes
          </button>

          {abierto && (
            <div style={{ marginTop:12 }}>
              <div style={{ fontSize:12.5, color:T.tenue, lineHeight:1.6, marginBottom:12 }}>
                Su alícuota es {nf(4).format(recibo.alicuota)} %. La columna de la derecha es
                la parte que le toca de cada gasto.
              </div>
              {det.map((cat, i) => (
                <div key={i} style={{ marginBottom:14 }}>
                  <div style={{ fontSize:11.5, textTransform:"uppercase",
                    letterSpacing:".07em", color:T.tenue, fontWeight:700,
                    marginBottom:6 }}>{cat.categoria}</div>
                  {(cat.lineas || []).map((l, j) => (
                    <div key={j} className="flex jc-b g3" style={{ padding:"7px 0",
                      borderBottom:`1px solid ${T.linea}`, fontSize:13.5 }}>
                      <span style={{ color:T.tinta2, flex:1, minWidth:0 }}>
                        {l.concepto}
                        {l.referencia && <span style={{ color:T.tenue, fontSize:12 }}>
                          {" · "}{l.referencia}</span>}
                      </span>
                      <span className="mono" style={{ color:T.tenue, fontSize:12.5,
                        whiteSpace:"nowrap" }}>{usd(l.monto)}</span>
                      <span className="mono" style={{ fontWeight:600,
                        whiteSpace:"nowrap" }}>{usd(l.parte)}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div style={{ marginTop:16 }}>
        <Boton tono="suave" style={{ width:"100%" }}
          onClick={() => {
            const w = window.open("", "_blank");
            if (!w) return;
            w.document.write(papelRecibo({
              edificio: recibo.edificio || u.edificio,
              organizacion: u.organizacion,
              unidad: u.codigo,
              vence: fechaCorta(recibo.vence_el),
              /* La tasa viva viaja al papel: el PDF se genera ahora, no
                 el día en que se emitió el recibo. */
              tasaHoy: recibo.tasaHoy,
              recibo,
            }));
            w.document.close();
            w.onload = () => { w.focus(); w.print(); };
            setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 700);
          }}>
          Descargar o imprimir mi recibo
        </Boton>
        <div style={{ fontSize:12, color:T.tenue, marginTop:6, lineHeight:1.5 }}>
          Se abre listo para imprimir. En el mismo cuadro puede elegir
          «Guardar como PDF».
        </div>
      </div>

      <p style={{ fontSize:12.5, color:T.tenue, lineHeight:1.6, marginBottom:0, marginTop:14 }}>
        El monto en bolívares es referencial y cambia todos los días: su cuota está en
        dólares y se convierte con la tasa del Banco Central del día en que usted pague.
        Si paga mañana, el monto en bolívares será otro.
      </p>
    </Tarjeta>
  );
}

/* ── Reportar un pago con su comprobante ── */
/* Cada método de pago se identifica con datos distintos. Pedir siempre
   los mismos campos hace que la administradora reciba reportes que no
   puede cruzar contra el banco, que es de lo que se trata todo esto. */
const METODOS = {
  "Pago móvil":     { banco:true, telefono:true, documento:true, referencia:true },
  "Transferencia":  { banco:true, referencia:true },
  "Zelle":          { correo:true, referencia:true },
  "Punto de venta": { banco:true, referencia:true },
  "Efectivo":       { },
  "Otro":           { referencia:true },
};
const MAX_BYTES = 5 * 1024 * 1024;

async function comprimirImagen(archivo) {
  // Las fotos de teléfono pesan 3 o 4 MB y el depósito admite 5. Se
  // reduce el lado mayor a 1600 px, que sigue siendo legible para leer
  // una referencia bancaria.
  if (!/^image\//.test(archivo.type) || archivo.size < 900 * 1024) return archivo;
  try {
    const url = URL.createObjectURL(archivo);
    const img = await new Promise((ok, mal) => {
      const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    const lado = Math.max(img.width, img.height);
    const escala = lado > 1600 ? 1600 / lado : 1;
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.82));
    if (!blob || blob.size >= archivo.size) return archivo;
    return new File([blob], archivo.name.replace(/\.\w+$/, "") + ".jpg", { type:"image/jpeg" });
  } catch (e) { return archivo; }
}

async function huella(archivo) {
  try {
    const buf = await archivo.arrayBuffer();
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map((b)=>b.toString(16).padStart(2,"0")).join("");
  } catch (e) { return null; }
}

function Reportar({ sb, u, sesion, notificar, fallo, onListo }) {
  const [f, setF] = useState({ fecha: hoyISO(), monto:"", moneda:"VES",
    metodo:"Pago móvil", referencia:"", banco:"", telefono:"", documento:"", correo:"" });
  const [bancos, setBancos] = useState([]);
  const [tf, setTf] = useState(null);
  const [errTasa, setErrTasa] = useState(null);
  const [archivo, setArchivo] = useState(null);
  const [ocupado, setOcupado] = useState(false);
  const entrada = useRef(null);

  useEffect(() => {
    sb.from("bancos").select("codigo,nombre,corto").eq("activo", true).order("orden")
      .then(({ data }) => setBancos(data || []));
  }, []);

  useEffect(() => {
    if (f.moneda !== "VES") { setTf(null); setErrTasa(null); return; }
    sb.rpc("tasa_de_esa_fecha", { p_fecha: f.fecha }).then(({ data, error }) => {
      // El error se muestra: una tasa que "no carga" sin decir por qué
      // deja a la persona sin saber si es culpa suya o del sistema.
      setErrTasa(error ? error.message : null);
      const r = Array.isArray(data) ? data[0] : data;
      setTf(r && Number(r.tasa) > 0 ? { ...r, tasa: Number(r.tasa) } : null);
    });
  }, [f.fecha, f.moneda]);

  const pide = METODOS[f.metodo] || {};

  const elegir = async (e) => {
    const a = e.target.files && e.target.files[0];
    if (!a) return;
    if (a.size > MAX_BYTES * 3)
      return notificar("Ese archivo es demasiado grande. Tome la foto de nuevo.", "error");
    const chico = await comprimirImagen(a);
    if (chico.size > MAX_BYTES)
      return notificar("El comprobante pesa más de 5 MB. Use una foto más pequeña.", "error");
    setArchivo(chico);
  };

  const enviar = async () => {
    const monto = num(f.monto);
    if (monto === null || monto <= 0) return notificar("El monto no se entiende.", "error");
    if (f.fecha > hoyISO()) return notificar("La fecha del pago no puede ser futura.", "error");
    if (f.moneda === "VES" && !tf)
      return notificar("Todavía no hay tasa del Banco Central para ese día. " +
                       "Avísele a su administración.", "error");

    if (pide.banco && !f.banco) return notificar("Elija el banco.", "error");
    if (pide.telefono && !f.telefono.trim())
      return notificar("Falta el teléfono desde el que hizo el pago móvil.", "error");
    if (pide.correo && !f.correo.trim())
      return notificar("Falta el correo desde el que envió el Zelle.", "error");
    if (pide.referencia && !f.referencia.trim())
      return notificar("Falta la referencia. Sin ella su pago es muy difícil de ubicar.", "error");

    setOcupado(true);

    const { data: pago, error } = await sb.from("pagos").insert({
      org_id: u.org_id, unidad_id: u.unidad_id, fecha: f.fecha, monto,
      moneda: f.moneda, monto_usd: 0, metodo: f.metodo, destino: "condominio",
      referencia: f.referencia.trim() || null,
      banco_codigo: pide.banco ? (f.banco || null) : null,
      telefono_origen:  pide.telefono  ? f.telefono.trim()  : null,
      documento_origen: pide.documento ? f.documento.trim() : null,
      correo_origen:    pide.correo    ? f.correo.trim()    : null,
      estado: "reportado",
    }).select("id").single();

    if (error) { setOcupado(false); return fallo(error); }

    if (archivo) {
      const ext = (archivo.name.match(/\.(\w+)$/) || [,"jpg"])[1].toLowerCase();
      const ruta = `${u.org_id}/${u.unidad_id}/${pago.id}.${ext}`;
      const sha = await huella(archivo);
      const su = await sb.storage.from("comprobantes")
        .upload(ruta, archivo, { contentType: archivo.type, upsert:false });

      if (su.error) {
        setOcupado(false);
        return notificar("El pago quedó reportado, pero el comprobante no se pudo subir: " +
                         su.error.message, "error");
      }
      const cf = await sb.from("comprobantes").insert({
        org_id: u.org_id, unidad_id: u.unidad_id, pago_id: pago.id, ruta,
        tipo: archivo.type, bytes: archivo.size, sha256: sha,
        subido_por: sesion.user.id });
      if (cf.error) {
        setOcupado(false);
        return notificar("El pago quedó reportado, pero no se pudo registrar el " +
                         "comprobante: " + cf.error.message, "error");
      }
    }

    setOcupado(false);
    setF({ ...f, monto:"", referencia:"" });
    setArchivo(null);
    if (entrada.current) entrada.current.value = "";
    notificar("Pago reportado. Su administración lo va a revisar y confirmar.");
    onListo();
  };

  return (
    <Tarjeta>
      <p style={{ fontSize:13.5, color:T.tinta2, lineHeight:1.6, marginTop:0 }}>
        Reportar un pago no lo da por recibido: su administración lo revisa contra el
        banco y lo confirma. Mientras tanto aparece como <b>esperando revisión</b>.
      </p>

      <Campo label="Fecha del pago"
        ayuda="La del día en que hizo la transferencia, no la de hoy.">
        <input type="date" className="mono" value={f.fecha} max={hoyISO()}
          onChange={(e)=>setF({...f, fecha:e.target.value})} /></Campo>

      <Campo label="Moneda">
        <select value={f.moneda} onChange={(e)=>setF({...f, moneda:e.target.value})}>
          <option value="VES">Bolívares</option>
          <option value="USD">Dólares</option>
        </select></Campo>

      <Campo label={f.moneda==="VES" ? "Monto en bolívares" : "Monto en dólares"}
        ayuda="Puede escribirlo con coma: 3.450,75">
        <input className="mono" inputMode="decimal" value={f.monto}
          onChange={(e)=>setF({...f, monto:e.target.value})} /></Campo>

      {f.moneda === "VES" && (
        <div className="mb3" style={{ padding:"11px 13px", borderRadius:10,
          background: tf ? T.azulBg : T.ambarBg, fontSize:13, lineHeight:1.55,
          color: tf ? T.azul : T.ambar }}>
          {errTasa ? ("No se pudo consultar la tasa: " + errTasa) : tf ? (<>
            Tasa del Banco Central del {fechaLarga(tf.fecha)}:{" "}
            <b className="mono">{nf(2).format(tf.tasa)}</b>
            {num(f.monto) ? <> · su pago equivale a{" "}
              <b className="mono">{usd(num(f.monto)/tf.tasa)}</b></> : null}
            {!tf.propia && <><br />No hubo publicación ese día, se usa la última anterior.</>}
          </>) : "Todavía no hay tasa del Banco Central para esa fecha. " +
                 "Avísele a su administración antes de reportar."}
        </div>
      )}

      <Campo label="Cómo pagó">
        <select value={f.metodo} onChange={(e)=>setF({...f, metodo:e.target.value})}>
          {Object.keys(METODOS).map((m)=><option key={m}>{m}</option>)}
        </select></Campo>

      {pide.banco && (
        <Campo label="Banco desde el que pagó">
          <select value={f.banco} onChange={(e)=>setF({...f, banco:e.target.value})}>
            <option value="">Elija el banco…</option>
            {bancos.map((b)=>(
              <option key={b.codigo} value={b.codigo}>{b.codigo} · {b.nombre}</option>))}
          </select></Campo>
      )}

      {pide.telefono && (
        <Campo label="Teléfono desde el que pagó"
          ayuda="El que tiene afiliado al pago móvil. Es lo que aparece en el estado de cuenta.">
          <input className="mono" inputMode="tel" value={f.telefono} placeholder="04121234567"
            onChange={(e)=>setF({...f, telefono:e.target.value})} /></Campo>
      )}

      {pide.documento && (
        <Campo label="Cédula o RIF del que paga"
          ayuda="Solo los números, sin puntos.">
          <input className="mono" inputMode="numeric" value={f.documento} placeholder="12345678"
            onChange={(e)=>setF({...f, documento:e.target.value})} /></Campo>
      )}

      {pide.correo && (
        <Campo label="Correo desde el que envió el Zelle">
          <input type="email" inputMode="email" autoCapitalize="off" value={f.correo}
            onChange={(e)=>setF({...f, correo:e.target.value})} /></Campo>
      )}

      {pide.referencia && (
        <Campo label={f.metodo === "Zelle" ? "Número de confirmación" : "Referencia"}
          ayuda="El número que le dio el banco. Es lo que permite encontrar su pago.">
          <input className="mono" inputMode="numeric" value={f.referencia}
            onChange={(e)=>setF({...f, referencia:e.target.value})} /></Campo>
      )}

      <Campo label="Comprobante"
        ayuda="Foto de la pantalla o PDF del banco. Máximo 5 MB. Solo lo ven usted y su administración.">
        <input ref={entrada} type="file" accept="image/*,application/pdf"
          onChange={elegir} style={{ padding:9 }} /></Campo>

      {archivo && (
        <div className="mb3" style={{ fontSize:12.5, color:T.tinta2 }}>
          {archivo.name} · {nf(0).format(archivo.size/1024)} KB
        </div>
      )}

      <Boton style={{ width:"100%" }} disabled={ocupado} onClick={enviar}>
        {ocupado ? "Enviando…" : "Reportar el pago"}</Boton>
    </Tarjeta>
  );
}

function MisPagos({ sb, pagos }) {
  if (!pagos.length) return (
    <Tarjeta><div style={{ color:T.tinta2, fontSize:14, lineHeight:1.6 }}>
      Todavía no ha reportado ningún pago.</div></Tarjeta>
  );
  return (
    <div className="flex" style={{ flexDirection:"column", gap:10 }}>
      {pagos.map((p) => (
        <Tarjeta key={p.id} style={{ padding:15 }}>
          <div className="flex jc-b ai-s g3">
            <div>
              <div className="mono" style={{ fontSize:17, fontWeight:700 }}>
                {p.moneda === "VES" ? bs(p.monto) : usd(p.monto)}</div>
              <div style={{ fontSize:12.5, color:T.tinta2, marginTop:2 }}>
                {fechaLarga(p.fecha)}</div>
              <div style={{ fontSize:12.5, color:T.tenue, marginTop:2 }}>
                {p.metodo}{p.referencia ? ` · ref ${p.referencia}` : ""}
                {p.banco ? ` · ${p.banco}` : ""}</div>
              {p.moneda === "VES" && p.tasa_aplicada > 0 && (
                <div style={{ fontSize:12, color:T.tenue, marginTop:2 }}>
                  {usd(p.monto_usd)} a la tasa {nf(2).format(p.tasa_aplicada)}</div>
              )}
            </div>
            <Pastilla estado={p.estado} />
          </div>
          {p.nota && (
            <div className="mt3" style={{ fontSize:12.5, color:T.tinta2,
              borderTop:`1px solid ${T.linea}`, paddingTop:10, lineHeight:1.55 }}>
              {p.nota}</div>
          )}
        </Tarjeta>
      ))}
    </div>
  );
}


/* Si el CDN no cargó, se explica en vez de dejar la pantalla vacía. */
if (!createClient) {
  document.getElementById("raiz").innerHTML =
    '<div style="font-family:system-ui;max-width:520px;margin:14vh auto;padding:24px;' +
    'background:#fff;border-radius:14px;color:#0A1128;line-height:1.6">' +
    '<h1 style="font-size:19px;margin:0 0 10px">No se pudo cargar la aplicación</h1>' +
    '<p style="margin:0 0 10px">Falta una biblioteca que se descarga de internet ' +
    '(cdn.jsdelivr.net). Suele ser un corte momentáneo o una red que la bloquea.</p>' +
    '<p style="margin:0 0 10px">Pruebe recargar con Ctrl+Shift+R. Si sigue igual, ' +
    'intente desde otra red o desde el teléfono con datos.</p>' +
    '<p style="margin:0;font-size:12px;color:#64748B">Detalle: ' +
    String((fallaCDN && fallaCDN.message) || fallaCDN) + '</p></div>';
} else {
  ReactDOM.createRoot(document.getElementById("raiz")).render(<App />);
}
