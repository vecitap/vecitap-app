const leerTema = () => {
  try { return localStorage.getItem("vecitap-tema") === "oscuro" ? "oscuro" : "claro"; }
  catch (e) { return "claro"; }
};
let T = { ...TEMAS[leerTema()] };
const ponerTema = (n) => {
  Object.assign(T, TEMAS[n] || TEMAS.claro);
  try { localStorage.setItem("vecitap-tema", n); } catch (e) {}
  try {
    const r = document.documentElement.style;
    r.setProperty("--campo", n === "oscuro" ? "#0B0B2E" : "#FFFFFF");
    r.setProperty("--lineaF", T.lineaF);
    r.setProperty("--tinta", T.tinta);
    document.body.style.background = T.papel;
    document.body.style.color = T.tinta;
  } catch (e) {}
};
ponerTema(leerTema());

/* El logo va como archivo al lado del HTML. Si no está, cae al nombre
   escrito y la página no se rompe. */

  const [falla, setFalla] = useState(false);
  if (falla) return (
    <span style={{ fontWeight:700, fontSize: alto*0.72, color:T.tinta,
      letterSpacing:"-.01em", ...style }}>vecitap</span>
  );
  return <img src={tema === "oscuro" ? "logo-oscuro.png" : "logo-claro.png"}
    alt="Vecitap" onError={() => setFalla(true)}
    style={{ height: alto, width:"auto", display:"block", ...style }} />;
};

const nf = (d=2) => new Intl.NumberFormat("es-VE",{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = (v) => "$ " + nf(2).format(Number(v)||0);
const bs  = (v) => "Bs " + nf(2).format(Number(v)||0);
const hoyISO = () => new Date().toISOString().slice(0,10);
/* En Venezuela se escribe 5.630,15. Un input numérico descarta la coma
   y devuelve vacío: por eso todos los montos son de texto. */
const num = (v) => {
  const t = String(v ?? "").trim();
  if (t === "") return null;
  const n = Number(t.replace(/\.(?=\d{3}\b)/g,"").replace(",","."));
  return Number.isFinite(n) ? n : null;
};
const guardar = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const leer    = (k)   => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const fechaCorta = (iso) => {
  if (!iso) return "";
  const [a,m,d] = String(iso).slice(0,10).split("-");
  return `${d}/${m}/${a}`;
};
const fechaLarga = (iso) => {
  if (!iso) return "";
  const [a,m,d] = String(iso).slice(0,10).split("-");
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio",
                 "agosto","septiembre","octubre","noviembre","diciembre"];
  return `${Number(d)} de ${meses[Number(m)-1]} de ${a}`;
};

/* ═══════════════════════════════════════════════════════════════════
   APLICACIÓN
   ═══════════════════════════════════════════════════════════════ */
function App() {
  const [cfg, setCfg] = useState(() => {
    if (CONFIG.url && CONFIG.key) return CONFIG;
    const u = leer("vecitap_url"), k = leer("vecitap_key");
    return u && k ? { url:u, key:k } : null;
  });
  /* Cada página guarda su sesión con una llave propia. Las tres viven en
     el mismo dominio, y con la llave por omisión entrar como residente en
     una pisaba la sesión de administrador en la otra: la aplicación se
     quedaba viendo una sola unidad sin que nadie entendiera por qué. */
  const sb = useMemo(() => cfg ? createClient(cfg.url, cfg.key,
    { auth: { storageKey: "vecitap-residente" } }) : null, [cfg]);
  const [sesion, setSesion] = useState(undefined);
  const [unidades, setUnidades] = useState(null);
  const [elegida, setElegida] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [tema, setTema] = useState(leerTema);
  const tmp = useRef(null);

  useEffect(() => { ponerTema(tema); }, [tema]);

  const notificar = (t, tipo="ok") => {
    setAviso({ t, tipo });
    if (tmp.current) clearTimeout(tmp.current);
    tmp.current = setTimeout(() => setAviso(null), 5000);
  };
  const fallo = (e) => notificar(e?.message || String(e), "error");

  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSesion(data.session || null));
    const { data: s } = sb.auth.onAuthStateChange((_e, ses) => {
      setSesion(ses || null); if (!ses) { setUnidades(null); setElegida(null); } });
    return () => s?.subscription?.unsubscribe();
  }, [sb]);

  const cargar = async () => {
    const { data, error } = await sb.rpc("mis_unidades");
    if (error) return fallo(error);
    setUnidades(data || []);
    setElegida((a) => (data || []).find((u) => u.unidad_id === a?.unidad_id) || (data || [])[0] || null);
  };
  useEffect(() => { if (sb && sesion) cargar(); }, [sb, sesion]);

  if (!cfg) return <Conexion onListo={(url,key) => setCfg({url,key})} />;
  if (sesion === undefined) return <Centro><Tarjeta>Abriendo su sesión…</Tarjeta></Centro>;
  if (!sesion) return <Entrar sb={sb} aviso={aviso} notificar={notificar} fallo={fallo} />;
  if (unidades === null) return <Centro><Tarjeta>Cargando…</Tarjeta></Centro>;

  if (unidades.length === 0)
    return <Invitacion sb={sb} sesion={sesion} aviso={aviso}
             notificar={notificar} fallo={fallo} onListo={cargar} />;

  return (
    <div style={{ maxWidth:640, margin:"0 auto", padding:"18px 16px 60px" }}>
      <header className="flex ai-s jc-b g3 mb4">
        <div>
          <LogoVecitap alto={22} tema={tema} style={{ marginBottom:6 }} />
          <h1 style={{ fontSize:21, margin:0, fontWeight:700 }}>Mi condominio</h1>
          <div style={{ fontSize:12.5, color:T.tenue, marginTop:3 }}>{sesion.user.email}</div>
        </div>
        <div className="flex g2">
          <Boton tono="fantasma" style={{ padding:"8px 10px", fontSize:13 }}
            title="Cambiar entre claro y oscuro"
            onClick={() => { const n = tema === "oscuro" ? "claro" : "oscuro";
                             ponerTema(n); setTema(n); }}>
            {tema === "oscuro" ? "Claro" : "Oscuro"}
          </Boton>
          <Boton tono="fantasma" style={{ padding:"8px 10px", fontSize:13 }}
            onClick={() => sb.auth.signOut()}>Salir</Boton>
        </div>
      </header>

      {aviso && (
        <div className="mb4" style={{ padding:"12px 14px", borderRadius:10, fontSize:14,
          lineHeight:1.5,
          background: aviso.tipo==="error" ? T.rojoBg : T.verdeBg,
          color: aviso.tipo==="error" ? T.rojo : T.verde,
          border:`1px solid ${T.linea}` }}>{aviso.t}</div>
      )}

      {unidades.length > 1 && (
        <div className="flex g2 wrap mb4">
          {unidades.map((u) => (
            <Boton key={u.unidad_id} tono={elegida?.unidad_id===u.unidad_id?"primario":"suave"}
              style={{ padding:"9px 13px", fontSize:13.5 }}
              onClick={() => setElegida(u)}>{u.edificio} · {u.codigo}</Boton>
          ))}
        </div>
      )}

      {elegida && <Unidad sb={sb} u={elegida} sesion={sesion}
        notificar={notificar} fallo={fallo} recargar={cargar} />}
    </div>
  );
}

/* ── Conexión (solo si no se dejó configurada arriba) ── */
function Conexion({ onListo }) {
  const [url, setUrl] = useState(leer("vecitap_url") || "");
  const [key, setKey] = useState(leer("vecitap_key") || "");
  return (
    <Centro>
      <Tarjeta>
        <h2 style={{ margin:"0 0 6px", fontSize:18 }}>Conectar</h2>
        <p style={{ color:T.tinta2, fontSize:13.5, lineHeight:1.6, marginTop:0 }}>
          Pídale a su administración la dirección y la clave pública del sistema. Se
          guardan en este teléfono y no se las vuelve a pedir.
        </p>
        <Campo label="Dirección del sistema">
          <input className="mono" value={url} onChange={(e)=>setUrl(e.target.value)}
            placeholder="https://xxxx.supabase.co" autoCapitalize="off" /></Campo>
        <Campo label="Clave pública">
          <input className="mono" value={key} onChange={(e)=>setKey(e.target.value)}

          onListo(url.trim(), key.trim());
        }}>Conectar</Boton>
      </Tarjeta>

}

/* ── Entrar o crear la cuenta ── */
function Entrar({ sb, aviso, notificar, fallo }) {
  const [modo, setModo] = useState("entrar");
  const [correo, setCorreo] = useState("");
  const [clave, setClave] = useState("");
  const [ocupado, setOcupado] = useState(false);

  const enviar = async () => {
    if (!correo.trim() || !clave) return notificar("Falta el correo o la clave.", "error");
    setOcupado(true);
    const f = modo === "entrar"
      ? await sb.auth.signInWithPassword({ email: correo.trim().toLowerCase(), password: clave })
      : await sb.auth.signUp({ email: correo.trim().toLowerCase(), password: clave });
    setOcupado(false);
    if (f.error) return fallo(f.error);
    if (modo === "crear")
      notificar("Cuenta creada. Si le pedimos confirmar el correo, revise su bandeja.");
  };

  return (
    <Centro>
      <Tarjeta>
        <LogoVecitap alto={30} tema={leerTema()} style={{ marginBottom:14 }} />
        <h2 style={{ margin:"0 0 4px", fontSize:19 }}>
          {modo === "entrar" ? "Entrar" : "Crear mi cuenta"}</h2>
        <p style={{ color:T.tinta2, fontSize:13.5, lineHeight:1.6, marginTop:0 }}>
          Use el mismo correo al que le llegó la invitación de su administración.
        </p>

        {aviso && (
          <div className="mb3" style={{ padding:"11px 13px", borderRadius:10, fontSize:13.5,
            lineHeight:1.5,
            background: aviso.tipo==="error" ? T.rojoBg : T.verdeBg,
            color: aviso.tipo==="error" ? T.rojo : T.verde }}>{aviso.t}</div>
        )}

        <Campo label="Correo">
          <input type="email" inputMode="email" autoCapitalize="off" value={correo}
            onChange={(e)=>setCorreo(e.target.value)} /></Campo>
        <Campo label="Contraseña"
          ayuda={modo==="crear" ? "Mínimo 6 caracteres." : ""}>
          <input type="password" value={clave} onChange={(e)=>setClave(e.target.value)}
            onKeyDown={(e)=> e.key==="Enter" && enviar()} /></Campo>

        <Boton style={{ width:"100%" }} disabled={ocupado} onClick={enviar}>
          {ocupado ? "Un momento…" : modo==="entrar" ? "Entrar" : "Crear la cuenta"}</Boton>

        <div style={{ textAlign:"center", marginTop:14 }}>
          <Boton tono="fantasma" style={{ fontSize:13.5, padding:"6px 8px" }}
            onClick={() => setModo(modo==="entrar" ? "crear" : "entrar")}>
            {modo==="entrar" ? "No tengo cuenta todavía" : "Ya tengo cuenta"}</Boton>
        </div>
      </Tarjeta>
    </Centro>
  );
}

/* ── Tiene cuenta pero todavía no está asociado a ninguna unidad ── */
function Invitacion({ sb, sesion, aviso, notificar, fallo, onListo }) {
  const [cod, setCod] = useState("");
  const [ocupado, setOcupado] = useState(false);

  const aceptar = async () => {
    if (!cod.trim()) return notificar("Pegue el código de la invitación.", "error");
    setOcupado(true);
    const { error } = await sb.rpc("aceptar_invitacion", { p_token: cod.trim() });
    setOcupado(false);
    if (error) return fallo(error);
    notificar("Listo, ya tiene acceso a su unidad.");
    onListo();
  };

  return (
    <Centro>
      <Tarjeta>
        <h2 style={{ margin:"0 0 6px", fontSize:18 }}>Falta un paso</h2>
        <p style={{ color:T.tinta2, fontSize:13.5, lineHeight:1.6, marginTop:0 }}>
          Su cuenta existe pero todavía no está asociada a ninguna unidad. Pegue el código
          que le envió su administración. Si no lo tiene, pídaselo: la invitación va a
          <b> {sesion.user.email}</b> y no sirve para otro correo.
        </p>
        {aviso && (
          <div className="mb3" style={{ padding:"11px 13px", borderRadius:10, fontSize:13.5,
            background: aviso.tipo==="error" ? T.rojoBg : T.verdeBg,
            color: aviso.tipo==="error" ? T.rojo : T.verde }}>{aviso.t}</div>
        )}
        <Campo label="Código de invitación">
          <input className="mono" value={cod} onChange={(e)=>setCod(e.target.value)}
            autoCapitalize="off" placeholder="a1b2c3…" /></Campo>
        <Boton style={{ width:"100%" }} disabled={ocupado} onClick={aceptar}>
          {ocupado ? "Comprobando…" : "Usar la invitación"}</Boton>
        <div style={{ textAlign:"center", marginTop:12 }}>
          <Boton tono="fantasma" style={{ fontSize:13 }}
            onClick={() => sb.auth.signOut()}>Salir</Boton>
        </div>
      </Tarjeta>
    </Centro>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   LA UNIDAD: estado, reportar el pago, mis reportes
   ═══════════════════════════════════════════════════════════════ */
function Unidad({ sb, u, sesion, notificar, fallo, recargar }) {
  const [pest, setPest] = useState("estado");
  const [pagos, setPagos] = useState([]);
  const [recibo, setRecibo] = useState(null);
  const [falloRecibo, setFalloRecibo] = useState(null);

  const cargar = async () => {
    const { data } = await sb.from("pagos")
      .select("id,fecha,monto,moneda,monto_usd,tasa_aplicada,metodo,referencia,banco,estado,nota")
      .eq("unidad_id", u.unidad_id).order("fecha", { ascending:false }).limit(40);
    setPagos(data || []);
    /* El recibo se lee directo de la tabla, no por una función.
       La función mi_recibo() devolvía el recibo correctamente en la base
       pero cero filas a través de la API, y perseguir esa diferencia no
       vale la pena: leyendo la tabla hay una pieza menos en el camino y
       quien decide qué puede ver cada quien es la seguridad por fila,
       que es justo para lo que está.

       El orden lo pone el calendario del período, nunca la hora en que
       se escribió la fila: varios meses cerrados en una misma
       transacción comparten esa marca y el orden saldría al azar. */
    const { data: r, error: er } = await sb
      .from("recibos")
      .select("numero,total,cuota,directos,anterior,a_favor,mora,honorario," +
              "servicio,conceptos,detalle,tasa_bcv,vence_el,alicuota," +
              "periodos!inner(anio,mes,etiqueta,estado)")
      .eq("unidad_id", u.unidad_id)
      .eq("periodos.estado", "cerrado")
      .limit(36);

    if (er) { setFalloRecibo(er.message || String(er)); setRecibo(null); }
    else {
      const filas = (r || []).slice().sort((a, b) =>
        (b.periodos.anio - a.periodos.anio) || (b.periodos.mes - a.periodos.mes));
      const ult = filas[0];
      setFalloRecibo(null);
      setRecibo(ult ? { ...ult, anio: ult.periodos.anio, mes: ult.periodos.mes,
                        etiqueta: ult.periodos.etiqueta, edificio: u.edificio } : null);
    }
  };
  useEffect(() => { cargar(); }, [u.unidad_id]);

  const mios = pagos.filter((p) => true);   // la base ya decide qué puede ver

  return (
    <>
      <Tarjeta style={{ marginBottom:16 }}>
        <div className="flex ai-s jc-b g3 wrap">
          <div>
            <div style={{ fontSize:12, color:T.tenue, textTransform:"uppercase",
              letterSpacing:".08em" }}>{u.edificio}</div>
            <div style={{ fontSize:26, fontWeight:700, lineHeight:1.15 }}>{u.codigo}</div>
            <div style={{ fontSize:12.5, color:T.tinta2, marginTop:2 }}>
              {u.relacion === "inquilino" ? "Inquilino" : "Propietario"} ·
              alícuota <span className="mono">{nf(4).format(u.alicuota)}%</span>
            </div>
          </div>
          <div style={{ textAlign:"right" }}>
            {u.saldo === null ? (
              <div style={{ fontSize:13, color:T.tenue, maxWidth:170, lineHeight:1.5 }}>
                Su administración no muestra el saldo acumulado en esta unidad.
              </div>
            ) : (
              <>
                <div style={{ fontSize:12, color:T.tenue }}>
                  {Number(u.saldo) > 0 ? "Debe" : Number(u.saldo) < 0 ? "A su favor" : "Al día"}</div>
                <div className="mono" style={{ fontSize:26, fontWeight:700,
                  color: Number(u.saldo) > 0 ? T.rojo : T.verde }}>
                  {usd(Math.abs(Number(u.saldo)))}</div>
              </>
            )}
          </div>
        </div>
      </Tarjeta>

      <div className="flex g2 mb4">
        {[["estado","Mi recibo"],["reportar","Reportar un pago"],["pagos","Mis pagos"]].map(([k,t]) => (
          <Boton key={k} tono={pest===k?"primario":"suave"} onClick={()=>setPest(k)}
            style={{ flex:1, padding:"10px 8px", fontSize:13.5 }}>{t}</Boton>
        ))}
      </div>

      {pest === "estado" && <Recibo u={u} recibo={recibo} falla={falloRecibo} />}

      {pest === "reportar" && (
        <Reportar sb={sb} u={u} sesion={sesion} notificar={notificar} fallo={fallo}
          onListo={() => { cargar(); recargar(); setPest("pagos"); }} />
      )}

      {pest === "pagos" && <MisPagos sb={sb} pagos={mios} />}
    </>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   RECIBO EN PAPEL · una sola plantilla para la aplicación y el portal
   ─────────────────────────────────────────────────────────────────
   Decisiones de diseño, para que nadie las deshaga sin querer:

   · Todo va dentro de una <table> con <thead>. Es la única forma que
     respetan todos los navegadores para REPETIR EL ENCABEZADO cuando
     el recibo se pasa a una segunda hoja.
   · El desglose va a dos columnas. Un edificio con 25 partidas cabía
     en dos hojas con una sola columna y cabe en una con dos.
   · Los cortes de categoría llevan break-inside: avoid, así una
     categoría no se parte por la mitad entre columnas ni entre hojas.
   · print-color-adjust: exact para que los fondos de marca salgan
     impresos; sin eso el navegador los blanquea "para ahorrar tinta".
   ═════════════════════════════════════════════════════════════════ */
function papelRecibo(d) {
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const nf = (n) => new Intl.NumberFormat("es-VE",
    { minimumFractionDigits: n, maximumFractionDigits: n });

function Recibo({ u, recibo, falla }) {
  /* Este estado va arriba de todo: un hook detrás de un return solo se
     ejecuta a veces, y React tumba la pantalla entera cuando la cuenta
     le cambia entre un dibujado y otro. */
  const [abierto, setAbierto] = useState(false);

  /* Un error de la base y "todavía no hay recibo" son cosas distintas y
     antes se veían igual. Ahora el error se dice. */
  if (falla) return (
    <Tarjeta><div style={{ color:T.rojo, fontSize:14, lineHeight:1.6 }}>
      No se pudo traer su recibo. Muéstrele este mensaje a su administración:
      <div className="mono" style={{ marginTop:8, fontSize:12.5, color:T.tinta2,
        background:T.papel, padding:10, borderRadius:8 }}>{falla}</div>
    </div></Tarjeta>
  );
  if (!recibo) return (
    <Tarjeta><div style={{ color:T.tinta2, fontSize:14, lineHeight:1.6 }}>
      {u.recibo_numero
        ? <>Su recibo <b className="mono">{u.recibo_numero}</b> de {u.recibo_periodo} existe,
            pero esta pantalla no logró traer el detalle. Avísele a su administración.</>
        : <>Todavía no hay ningún recibo emitido para esta unidad. Aparece aquí en cuanto su
            administración cierre el mes.</>}
    </div></Tarjeta>
  );
  const lineas = Array.isArray(recibo.conceptos) ? recibo.conceptos : [];
  const det    = Array.isArray(recibo.detalle)   ? recibo.detalle   : [];
  const fila = (t, v, fuerte) => (
    <div className="flex jc-b g3" style={{ padding:"9px 0",
      borderBottom:`1px solid ${T.linea}`, fontWeight: fuerte?700:400 }}>
      <span style={{ color: fuerte?T.tinta:T.tinta2 }}>{t}</span>
      <span className="mono">{usd(v)}</span>
    </div>
  );
  return (
    <Tarjeta>
      <div className="flex jc-b ai-c g3 mb3 wrap">
        <div>
          <div style={{ fontSize:12, color:T.tenue }}>Recibo</div>
          <div className="mono" style={{ fontSize:16, fontWeight:600 }}>{recibo.numero}</div>
        </div>
        {recibo.tasa_bcv > 0 && (
          <div style={{ textAlign:"right" }}>
            <div style={{ fontSize:12, color:T.tenue }}>Equivale a</div>
            <div className="mono" style={{ fontSize:15, fontWeight:600 }}>
              {bs(Number(recibo.total) * Number(recibo.tasa_bcv))}</div>
            <div style={{ fontSize:11, color:T.tenue }}>
              tasa {nf(2).format(recibo.tasa_bcv)}</div>
          </div>
        )}
      </div>

      {lineas.map((l, i) => fila(l.nombre, l.monto))}
      {Number(recibo.directos) > 0 && fila("Cargos de su unidad", recibo.directos)}
      {Number(recibo.anterior) > 0 && fila("Saldo del mes anterior", recibo.anterior)}
      {Number(recibo.a_favor)  > 0 && fila("A su favor", -recibo.a_favor)}
      {Number(recibo.mora)     > 0 && fila("Intereses de mora", recibo.mora)}
      {fila("Total", recibo.total, true)}

      {recibo.vence_el && (
        <div style={{ marginTop:12, padding:"10px 12px", borderRadius:9,
          background:T.ambarBg, color:T.ambar, fontSize:13, fontWeight:600 }}>
          Vence el {fechaLarga(recibo.vence_el)}
        </div>
      )}

      {/* En qué se fue la plata. Es lo primero que pregunta cualquiera
          que recibe un recibo de condominio, y hasta ahora no estaba. */}
      {det.length > 0 && (
        <div style={{ marginTop:16, borderTop:`1px solid ${T.linea}`, paddingTop:14 }}>
          <button onClick={() => setAbierto(!abierto)}
            style={{ background:"none", border:"none", padding:0, cursor:"pointer",
              color:T.tinta, fontSize:14, fontWeight:600, fontFamily:"inherit" }}>
            {abierto ? "Ocultar" : "Ver"} en qué se gastó este mes
          </button>

          {abierto && (
            <div style={{ marginTop:12 }}>
              <div style={{ fontSize:12.5, color:T.tenue, lineHeight:1.6, marginBottom:12 }}>
                Su alícuota es {nf(4).format(recibo.alicuota)} %. La columna de la derecha es
                la parte que le toca de cada gasto.
              </div>
              {det.map((cat, i) => (
                <div key={i} style={{ marginBottom:14 }}>
                  <div style={{ fontSize:11.5, textTransform:"uppercase",
                    letterSpacing:".07em", color:T.tenue, fontWeight:700,
                    marginBottom:6 }}>{cat.categoria}</div>
                  {(cat.lineas || []).map((l, j) => (
                    <div key={j} className="flex jc-b g3" style={{ padding:"7px 0",
                      borderBottom:`1px solid ${T.linea}`, fontSize:13.5 }}>
                      <span style={{ color:T.tinta2, flex:1, minWidth:0 }}>
                        {l.concepto}
                        {l.referencia && <span style={{ color:T.tenue, fontSize:12 }}>
                          {" · "}{l.referencia}</span>}
                      </span>
                      <span className="mono" style={{ color:T.tenue, fontSize:12.5,
                        whiteSpace:"nowrap" }}>{usd(l.monto)}</span>
                      <span className="mono" style={{ fontWeight:600,
                        whiteSpace:"nowrap" }}>{usd(l.parte)}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div style={{ marginTop:16 }}>
        <Boton tono="suave" style={{ width:"100%" }}
          onClick={() => {
            const w = window.open("", "_blank");
            if (!w) return;
            w.document.write(papelRecibo({
              edificio: recibo.edificio || u.edificio,
              organizacion: u.organizacion,
              unidad: u.codigo,
              vence: fechaCorta(recibo.vence_el),
              recibo,
            }));
            w.document.close();
            w.onload = () => { w.focus(); w.print(); };
            setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 700);
          }}>
          Descargar o imprimir mi recibo
        </Boton>
        <div style={{ fontSize:12, color:T.tenue, marginTop:6, lineHeight:1.5 }}>
          Se abre listo para imprimir. En el mismo cuadro puede elegir
          «Guardar como PDF».
        </div>
      </div>

      <p style={{ fontSize:12.5, color:T.tenue, lineHeight:1.6, marginBottom:0, marginTop:14 }}>
        El monto en bolívares es referencial: se convierte a la tasa del Banco Central del
        día en que usted pague, no a la de hoy.
      </p>
    </Tarjeta>
  );
}

/* ── Reportar un pago con su comprobante ── */
/* Cada método de pago se identifica con datos distintos. Pedir siempre
   los mismos campos hace que la administradora reciba reportes que no
   puede cruzar contra el banco, que es de lo que se trata todo esto. */
const METODOS = {
  "Pago móvil":     { banco:true, telefono:true, documento:true, referencia:true },
  "Transferencia":  { banco:true, referencia:true },
  "Zelle":          { correo:true, referencia:true },
  "Punto de venta": { banco:true, referencia:true },
  "Efectivo":       { },
  "Otro":           { referencia:true },
};
const MAX_BYTES = 5 * 1024 * 1024;

async function comprimirImagen(archivo) {
  // Las fotos de teléfono pesan 3 o 4 MB y el depósito admite 5. Se
  // reduce el lado mayor a 1600 px, que sigue siendo legible para leer
  // una referencia bancaria.
  if (!/^image\//.test(archivo.type) || archivo.size < 900 * 1024) return archivo;
  try {
    const url = URL.createObjectURL(archivo);
    const img = await new Promise((ok, mal) => {
      const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    const lado = Math.max(img.width, img.height);
    const escala = lado > 1600 ? 1600 / lado : 1;
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.82));
    if (!blob || blob.size >= archivo.size) return archivo;
    return new File([blob], archivo.name.replace(/\.\w+$/, "") + ".jpg", { type:"image/jpeg" });
  } catch (e) { return archivo; }
}

async function huella(archivo) {
  try {
    const buf = await archivo.arrayBuffer();
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map((b)=>b.toString(16).padStart(2,"0")).join("");
  } catch (e) { return null; }
}

function Reportar({ sb, u, sesion, notificar, fallo, onListo }) {
  const [f, setF] = useState({ fecha: hoyISO(), monto:"", moneda:"VES",
    metodo:"Pago móvil", referencia:"", banco:"", telefono:"", documento:"", correo:"" });
  const [bancos, setBancos] = useState([]);
  const [tf, setTf] = useState(null);
  const [errTasa, setErrTasa] = useState(null);
  const [archivo, setArchivo] = useState(null);
  const [ocupado, setOcupado] = useState(false);
  const entrada = useRef(null);

  useEffect(() => {
    sb.from("bancos").select("codigo,nombre,corto").eq("activo", true).order("orden")
      .then(({ data }) => setBancos(data || []));
  }, []);

  useEffect(() => {
    if (f.moneda !== "VES") { setTf(null); setErrTasa(null); return; }
    sb.rpc("tasa_de_esa_fecha", { p_fecha: f.fecha }).then(({ data, error }) => {
      // El error se muestra: una tasa que "no carga" sin decir por qué
      // deja a la persona sin saber si es culpa suya o del sistema.
      setErrTasa(error ? error.message : null);
      const r = Array.isArray(data) ? data[0] : data;
      setTf(r && Number(r.tasa) > 0 ? { ...r, tasa: Number(r.tasa) } : null);
    });
  }, [f.fecha, f.moneda]);

  const pide = METODOS[f.metodo] || {};

  const elegir = async (e) => {
    const a = e.target.files && e.target.files[0];
    if (!a) return;
    if (a.size > MAX_BYTES * 3)
      return notificar("Ese archivo es demasiado grande. Tome la foto de nuevo.", "error");
    const chico = await comprimirImagen(a);
    if (chico.size > MAX_BYTES)
      return notificar("El comprobante pesa más de 5 MB. Use una foto más pequeña.", "error");
    setArchivo(chico);
  };

  const enviar = async () => {
    const monto = num(f.monto);
    if (monto === null || monto <= 0) return notificar("El monto no se entiende.", "error");
    if (f.fecha > hoyISO()) return notificar("La fecha del pago no puede ser futura.", "error");
    if (f.moneda === "VES" && !tf)
      return notificar("Todavía no hay tasa del Banco Central para ese día. " +
                       "Avísele a su administración.", "error");

    if (pide.banco && !f.banco) return notificar("Elija el banco.", "error");
    if (pide.telefono && !f.telefono.trim())
      return notificar("Falta el teléfono desde el que hizo el pago móvil.", "error");
    if (pide.correo && !f.correo.trim())
      return notificar("Falta el correo desde el que envió el Zelle.", "error");
    if (pide.referencia && !f.referencia.trim())
      return notificar("Falta la referencia. Sin ella su pago es muy difícil de ubicar.", "error");

    setOcupado(true);

    const { data: pago, error } = await sb.from("pagos").insert({
      org_id: u.org_id, unidad_id: u.unidad_id, fecha: f.fecha, monto,
      moneda: f.moneda, monto_usd: 0, metodo: f.metodo, destino: "condominio",
      referencia: f.referencia.trim() || null,
      banco_codigo: pide.banco ? (f.banco || null) : null,
      telefono_origen:  pide.telefono  ? f.telefono.trim()  : null,
      documento_origen: pide.documento ? f.documento.trim() : null,
      correo_origen:    pide.correo    ? f.correo.trim()    : null,
      estado: "reportado",
    }).select("id").single();

    if (error) { setOcupado(false); return fallo(error); }

    if (archivo) {
      const ext = (archivo.name.match(/\.(\w+)$/) || [,"jpg"])[1].toLowerCase();
      const ruta = `${u.org_id}/${u.unidad_id}/${pago.id}.${ext}`;
      const sha = await huella(archivo);
      const su = await sb.storage.from("comprobantes")
        .upload(ruta, archivo, { contentType: archivo.type, upsert:false });

      if (su.error) {
        setOcupado(false);
        return notificar("El pago quedó reportado, pero el comprobante no se pudo subir: " +
                         su.error.message, "error");
      }
      const cf = await sb.from("comprobantes").insert({
        org_id: u.org_id, unidad_id: u.unidad_id, pago_id: pago.id, ruta,
        tipo: archivo.type, bytes: archivo.size, sha256: sha,
        subido_por: sesion.user.id });
      if (cf.error) {
        setOcupado(false);
        return notificar("El pago quedó reportado, pero no se pudo registrar el " +
                         "comprobante: " + cf.error.message, "error");
      }
    }

    setOcupado(false);
    setF({ ...f, monto:"", referencia:"" });
    setArchivo(null);
    if (entrada.current) entrada.current.value = "";
    notificar("Pago reportado. Su administración lo va a revisar y confirmar.");
    onListo();
  };

  return (
    <Tarjeta>
      <p style={{ fontSize:13.5, color:T.tinta2, lineHeight:1.6, marginTop:0 }}>
        Reportar un pago no lo da por recibido: su administración lo revisa contra el
        banco y lo confirma. Mientras tanto aparece como <b>esperando revisión</b>.
      </p>

      <Campo label="Fecha del pago"
        ayuda="La del día en que hizo la transferencia, no la de hoy.">
        <input type="date" className="mono" value={f.fecha} max={hoyISO()}
          onChange={(e)=>setF({...f, fecha:e.target.value})} /></Campo>

      <Campo label="Moneda">
        <select value={f.moneda} onChange={(e)=>setF({...f, moneda:e.target.value})}>
          <option value="VES">Bolívares</option>
          <option value="USD">Dólares</option>
        </select></Campo>

      <Campo label={f.moneda==="VES" ? "Monto en bolívares" : "Monto en dólares"}
        ayuda="Puede escribirlo con coma: 3.450,75">
        <input className="mono" inputMode="decimal" value={f.monto}
          onChange={(e)=>setF({...f, monto:e.target.value})} /></Campo>

      {f.moneda === "VES" && (
        <div className="mb3" style={{ padding:"11px 13px", borderRadius:10,
          background: tf ? T.azulBg : T.ambarBg, fontSize:13, lineHeight:1.55,
          color: tf ? T.azul : T.ambar }}>
          {errTasa ? ("No se pudo consultar la tasa: " + errTasa) : tf ? (<>
            Tasa del Banco Central del {fechaLarga(tf.fecha)}:{" "}
            <b className="mono">{nf(2).format(tf.tasa)}</b>
            {num(f.monto) ? <> · su pago equivale a{" "}
              <b className="mono">{usd(num(f.monto)/tf.tasa)}</b></> : null}
            {!tf.propia && <><br />No hubo publicación ese día, se usa la última anterior.</>}
          </>) : "Todavía no hay tasa del Banco Central para esa fecha. " +
                 "Avísele a su administración antes de reportar."}
        </div>
      )}

      <Campo label="Cómo pagó">
        <select value={f.metodo} onChange={(e)=>setF({...f, metodo:e.target.value})}>
          {Object.keys(METODOS).map((m)=><option key={m}>{m}</option>)}
        </select></Campo>

      {pide.banco && (
        <Campo label="Banco desde el que pagó">
          <select value={f.banco} onChange={(e)=>setF({...f, banco:e.target.value})}>
            <option value="">Elija el banco…</option>
            {bancos.map((b)=>(
              <option key={b.codigo} value={b.codigo}>{b.codigo} · {b.nombre}</option>))}
          </select></Campo>
      )}

      {pide.telefono && (
        <Campo label="Teléfono desde el que pagó"
          ayuda="El que tiene afiliado al pago móvil. Es lo que aparece en el estado de cuenta.">
          <input className="mono" inputMode="tel" value={f.telefono} placeholder="04121234567"
            onChange={(e)=>setF({...f, telefono:e.target.value})} /></Campo>
      )}

      {pide.documento && (
        <Campo label="Cédula o RIF del que paga"
          ayuda="Solo los números, sin puntos.">
          <input className="mono" inputMode="numeric" value={f.documento} placeholder="12345678"
            onChange={(e)=>setF({...f, documento:e.target.value})} /></Campo>
      )}

      {pide.correo && (
        <Campo label="Correo desde el que envió el Zelle">
          <input type="email" inputMode="email" autoCapitalize="off" value={f.correo}
            onChange={(e)=>setF({...f, correo:e.target.value})} /></Campo>
      )}

      {pide.referencia && (
        <Campo label={f.metodo === "Zelle" ? "Número de confirmación" : "Referencia"}
          ayuda="El número que le dio el banco. Es lo que permite encontrar su pago.">
          <input className="mono" inputMode="numeric" value={f.referencia}
            onChange={(e)=>setF({...f, referencia:e.target.value})} /></Campo>
      )}

      <Campo label="Comprobante"
        ayuda="Foto de la pantalla o PDF del banco. Máximo 5 MB. Solo lo ven usted y su administración.">
        <input ref={entrada} type="file" accept="image/*,application/pdf"
          onChange={elegir} style={{ padding:9 }} /></Campo>

      {archivo && (
        <div className="mb3" style={{ fontSize:12.5, color:T.tinta2 }}>
          {archivo.name} · {nf(0).format(archivo.size/1024)} KB
        </div>
      )}

      <Boton style={{ width:"100%" }} disabled={ocupado} onClick={enviar}>
        {ocupado ? "Enviando…" : "Reportar el pago"}</Boton>
    </Tarjeta>
  );
}

function MisPagos({ sb, pagos }) {
  if (!pagos.length) return (
    <Tarjeta><div style={{ color:T.tinta2, fontSize:14, lineHeight:1.6 }}>
      Todavía no ha reportado ningún pago.</div></Tarjeta>
  );
  return (
    <div className="flex" style={{ flexDirection:"column", gap:10 }}>
      {pagos.map((p) => (
        <Tarjeta key={p.id} style={{ padding:15 }}>
          <div className="flex jc-b ai-s g3">
            <div>
              <div className="mono" style={{ fontSize:17, fontWeight:700 }}>
                {p.moneda === "VES" ? bs(p.monto) : usd(p.monto)}</div>
              <div style={{ fontSize:12.5, color:T.tinta2, marginTop:2 }}>
                {fechaLarga(p.fecha)}</div>
              <div style={{ fontSize:12.5, color:T.tenue, marginTop:2 }}>
                {p.metodo}{p.referencia ? ` · ref ${p.referencia}` : ""}
                {p.banco ? ` · ${p.banco}` : ""}</div>
              {p.moneda === "VES" && p.tasa_aplicada > 0 && (
                <div style={{ fontSize:12, color:T.tenue, marginTop:2 }}>
                  {usd(p.monto_usd)} a la tasa {nf(2).format(p.tasa_aplicada)}</div>
              )}
            </div>
            <Pastilla estado={p.estado} />
          </div>
          {p.nota && (
            <div className="mt3" style={{ fontSize:12.5, color:T.tinta2,
              borderTop:`1px solid ${T.linea}`, paddingTop:10, lineHeight:1.55 }}>
              {p.nota}</div>
          )}
        </Tarjeta>
      ))}
    </div>
  );
}


/* Si el CDN no cargó, se explica en vez de dejar la pantalla vacía. */
if (!createClient) {
  document.getElementById("raiz").innerHTML =
    '<div style="font-family:system-ui;max-width:520px;margin:14vh auto;padding:24px;' +
    'background:#fff;border-radius:14px;color:#111144;line-height:1.6">' +
    '<h1 style="font-size:19px;margin:0 0 10px">No se pudo cargar la aplicación</h1>' +
    '<p style="margin:0 0 10px">Falta una biblioteca que se descarga de internet ' +
    '(cdn.jsdelivr.net). Suele ser un corte momentáneo o una red que la bloquea.</p>' +
    '<p style="margin:0 0 10px">Pruebe recargar con Ctrl+Shift+R. Si sigue igual, ' +
    'intente desde otra red o desde el teléfono con datos.</p>' +
    '<p style="margin:0;font-size:12px;color:#66668A">Detalle: ' +
    String((fallaCDN && fallaCDN.message) || fallaCDN) + '</p></div>';
} else {
  ReactDOM.createRoot(document.getElementById("raiz")).render(<App />);
}

</script>
