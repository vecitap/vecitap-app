                <div className="mono" style={{ fontSize: 12, color: T.tenue }}>
                  {viendo.pago.fecha} · {viendo.pago.metodo}
                  {viendo.pago.referencia ? ` · ref ${viendo.pago.referencia}` : ""}
                </div>
              </div>
              <Boton size="s" tipo="suave" onClick={() => setViendo(null)}>Cerrar</Boton>
            </div>
            {/^image\//.test(viendo.tipo)
              ? <img src={viendo.url} alt="Comprobante"
                  style={{ maxWidth: "100%", borderRadius: T.rs, display: "block" }} />
              : <iframe src={viendo.url} title="Comprobante"
                  style={{ width: "100%", height: "70vh", border: `1px solid ${T.linea}`,
                    borderRadius: T.rs }} />}
            <div style={{ fontSize: 11.5, color: T.tenue, marginTop: 10, wordBreak: "break-all" }}>
              Huella del archivo: <span className="mono">{viendo.ficha.sha256 || "sin huella"}</span>
              <br />
              Sirve para comprobar dentro de dos años que un comprobante que le muestren es
              exactamente este, aunque la imagen ya se haya borrado.
            </div>
          </div>
        </div>
      )}

      <Tarjeta pad={false}>
        <div style={{ padding: "20px 20px 0" }}>
          <Titulo accion={
            <div className="flex gap-2 flex-wrap">
              {[["reportado", "Reportados"], ["conciliado", "Conciliados"],
                ["anulado", "Anulados"], ["todos", "Todos"]].map(([k, t]) => (
                <Boton key={k} size="s" tipo={filtro === k ? "oscuro" : "suave"}
                  onClick={() => setFiltro(k)}>{t}</Boton>
              ))}
            </div>
          }>Movimientos registrados</Titulo>
        </div>
        <div className="scroll-x">
          <table className="apila">
            <thead><tr><th>Fecha</th><th>Unidad</th><th>Método</th><th>Ref.</th>
              <th>Origen</th><th>Abona a</th><th style={{ textAlign: "right" }}>USD</th>
              <th>Estado</th><th></th></tr></thead>
            <tbody>
              {visibles.map((p) => (
                <tr key={p.id}>
                  <td className="mono" data-t="Fecha">{p.fecha}</td>
                  <td className="mono cabeza">{codigo(p.unidad_id)}</td>
                  <td data-t="Método">
                    <div>{p.metodo}{p.moneda === "VES" &&
                    <div style={{ fontSize: 11.5, color: T.tenue }} className="mono">
                      {bs(p.monto)} a {nf(2).format(p.tasa_aplicada)}</div>}</div></td>
                  <td className="mono" data-t="Referencia">{p.referencia || "—"}</td>
                  <td data-t="Origen" style={{ fontSize: 12 }}><div>
                    {p.banco || <span style={{ color: T.tenue }}>—</span>}
                    {p.telefono_origen && <div className="mono" style={{ color: T.tenue }}>
                      {p.telefono_origen}</div>}
                    {p.correo_origen && <div style={{ color: T.tenue }}>{p.correo_origen}</div>}
                    {comps[p.id] && (
                      <Boton size="s" tipo="fantasma" style={{ padding: "3px 0", fontSize: 12 }}
                        onClick={() => verComprobante(p)}>
                        {comps[p.id].imagen_borrada_en ? "comprobante vencido" : "ver comprobante"}
                      </Boton>
                    )}
                  </div></td>
                  <td data-t="Abona a">{BOLSILLOS[p.destino === "honorarios" ? "administracion" : p.destino]?.t}</td>
                  <td className="mono" data-t="Monto" style={{ textAlign: "right", fontWeight: 600 }}>{usd(p.monto_usd)}</td>
                  <td data-t="Estado">
                    <Pastilla size="s" tono={p.estado === "conciliado" ? "verde"
                      : p.estado === "anulado" ? "rojo" : "ambar"}>
                      {p.estado}{p.periodo_cierre_id ? " · en cierre" : ""}
                    </Pastilla>
                  </td>
                  <td className="acciones" style={{ width: 150 }}>
                    {p.estado === "reportado" && (
                      <div className="flex gap-1 flex-wrap">
                        <Boton size="s" onClick={() => cambiarEstado(p, "conciliado")}>Conciliar</Boton>
                        <Boton size="s" tipo="suave" onClick={() => cambiarEstado(p, "anulado")}>Anular</Boton>
                      </div>
                    )}
                    {p.estado === "conciliado" && !p.periodo_cierre_id && (
                      <Boton size="s" tipo="suave" onClick={() => cambiarEstado(p, "anulado")}>Anular</Boton>
                    )}
                    {p.periodo_cierre_id && (
                      <span style={{ fontSize: 11.5, color: T.tenue }}>
                        ya está dentro de un cierre
                      </span>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {visibles.length === 0 && (
            <div style={{ padding: 34, textAlign: "center", color: T.tenue, fontSize: 14 }}>
              No hay pagos con ese filtro.
            </div>
          )}
        </div>
      </Tarjeta>

      <Tarjeta>
        <Titulo sub="Las imágenes de los comprobantes se borran a los 3 meses de conciliado el pago y con el mes ya cerrado. El pago, su referencia y la huella del archivo se quedan para siempre: la evidencia sobrevive al borrado.">
          Comprobantes vencidos
        </Titulo>
        <div className="flex gap-3 items-center flex-wrap">
          <Boton tipo="suave" onClick={purgarVencidos}>Borrar las imágenes vencidas</Boton>
          {purga !== null && (
            <span style={{ fontSize: 13, color: T.tinta2 }}>
              {purga === 0 ? "No había ninguna." : `${purga} borradas.`}
            </span>
          )}
        </div>
      </Tarjeta>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   ACCESOS · quién entra a cada unidad y qué ve
   ══════════════════════════════════════════════════════════════ */
function Accesos({ sb, org, edificio, edificios, unidades, hayModulo,
                  notificar, fallo, recargar }) {
  const [pest, setPest] = useState("invitar");
  /* Los vigilantes solo aparecen si el edificio tiene contratada la
     garita. Sin el módulo, invitar a un vigilante sería darle una
     cuenta para entrar a una pantalla donde la base le niega todo. */
  const verVigilantes = hayModulo ? hayModulo("garita") : false;
  const [vigis, setVigis] = useState([]);
  const [fv, setFv] = useState({ correo: "", edificio: "" });
  const [codigoVig, setCodigoVig] = useState(null);
  const [f, setF] = useState({ unidad: "", correo: "", relacion: "propietario" });
  const [codigo, setCodigo] = useState(null);
  const [invs, setInvs] = useState([]);
  const [gente, setGente] = useState([]);
  const [ocupado, setOcupado] = useState(false);

  const cargar = async () => {
    const a = await sb.rpc("invitaciones_de", { p_org: org.id });
    if (a.error) return fallo(a.error);
    setInvs(a.data || []);
    if (!edificio) return;
    const b = await sb.rpc("residentes_de", { p_edificio: edificio.id });
    if (b.error) return fallo(b.error);
    setGente(b.data || []);
  };

  const cargarVigis = async () => {
    const { data, error } = await sb.rpc("vigilantes_de", { p_org: org.id });
    if (error) return fallo(error);
    setVigis(data || []);
  };
  useEffect(() => { if (verVigilantes) cargarVigis(); }, [org.id, verVigilantes]);

  const invitarVigilante = async () => {
    const correo = (fv.correo || "").trim().toLowerCase();
    const ed = fv.edificio || edificio?.id;
    if (!ed) return notificar("Elija el edificio de la garita.", "error");
    if (!/.+@.+\..+/.test(correo)) return notificar("Ese correo no se entiende.", "error");
    setOcupado(true);
    const { data, error } = await sb.rpc("crear_invitacion", {
      p_org: org.id, p_correo: correo, p_rol: "vigilante",
      p_edificio: ed, p_unidad: null, p_relacion: null });
    setOcupado(false);
    if (error) return fallo(error);
    setCodigoVig({ token: data, correo });
    setFv({ ...fv, correo: "" });
    cargarVigis();
  };

  const fijarVigilante = async (id, activo, ed) => {
    const { error } = await sb.rpc("fijar_vigilante",
      { p_membresia: id, p_activo: activo, p_edificio: ed || null });
    if (error) return fallo(error);
    notificar(activo ? "Vigilante reactivado." : "Ese vigilante ya no entra a la garita.");
    cargarVigis();
  };
  useEffect(() => { cargar(); }, [org.id, edificio?.id]);

  const invitar = async () => {
    if (!f.unidad) return notificar("Elija la unidad.", "error");
    if (!/.+@.+\..+/.test(f.correo.trim())) return notificar("Ese correo no se entiende.", "error");
    setOcupado(true);
    const { data, error } = await sb.rpc("crear_invitacion", {
      p_org: org.id, p_correo: f.correo.trim().toLowerCase(), p_rol: "residente",
      p_edificio: null, p_unidad: f.unidad, p_relacion: f.relacion });
    setOcupado(false);
    if (error) return fallo(error);
    setCodigo({ token: data, correo: f.correo.trim().toLowerCase() });
    setF({ ...f, correo: "" });
    cargar();
  };

  const revocar = async (id) => {
    const { error } = await sb.rpc("revocar_invitacion", { p_id: id });
    if (error) return fallo(error);
    notificar("Invitación revocada."); cargar();
  };

  const cambiarNivel = async (unidad_id, nivel) => {
    const { error } = await sb.from("unidades")
      .update({ inquilino_ve: nivel }).eq("id", unidad_id);
    if (error) return fallo(error);
    notificar("Listo. El inquilino de esa unidad ve otra cosa desde ahora.");
    cargar(); recargar();
  };

  const darDeBaja = async (id) => {
    const { error } = await sb.from("membresias").update({ activo: false }).eq("id", id);
    if (error) return fallo(error);
    notificar("Esa persona ya no entra a la unidad."); cargar();
  };

  const copiar = async (t) => {
    try { await navigator.clipboard.writeText(t); notificar("Copiado."); }
    catch (e) { notificar("No se pudo copiar. Selecciónelo a mano.", "error"); }
  };

  const codigoUnidad = (id) => unidades.find((u) => u.id === id)?.codigo || "—";

  return (
    <div className="grid gap-5">
      <div className="flex gap-2 flex-wrap">
        {[["invitar", "Invitar"], ["pendientes", "Invitaciones"],
          ["gente", "Quién tiene acceso"],
          ...(verVigilantes ? [["vigilantes", "Vigilantes"]] : [])].map(([k, t]) => (
          <Boton key={k} size="s" tipo={pest === k ? "oscuro" : "suave"}
            onClick={() => setPest(k)}>{t}</Boton>
        ))}
      </div>

      {pest === "invitar" && (
        <>
          <Tarjeta>
            <Titulo sub="La invitación queda atada a ese correo y a esa unidad. No sirve para nadie más, aunque alguien consiga el código.">
              Invitar a un residente
            </Titulo>
            <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))" }}>
              <Campo label="Unidad">
                <Selector value={f.unidad} onChange={(e) => setF({ ...f, unidad: e.target.value })}>
                  <option value="">Elija</option>
                  {unidades.map((u) => <option key={u.id} value={u.id}>{u.codigo}</option>)}
                </Selector>
              </Campo>
              <Campo label="Correo">
                <Entrada value={f.correo} placeholder="propietario@correo.com"
                  onChange={(e) => setF({ ...f, correo: e.target.value })} />
              </Campo>
              <Campo label="Es el..."
                ayuda="El inquilino puede ver menos que el propietario. Se configura por unidad.">
                <Selector value={f.relacion} onChange={(e) => setF({ ...f, relacion: e.target.value })}>
                  <option value="propietario">Propietario</option>
                  <option value="inquilino">Inquilino</option>
                </Selector>
              </Campo>
            </div>
            <div style={{ marginTop: 14 }}>
              <Boton disabled={ocupado} onClick={invitar}>Generar la invitación</Boton>
            </div>
          </Tarjeta>

          {codigo && (
            <Tarjeta>
              <Titulo sub="Este código se muestra una sola vez. En la base solo queda su huella, así que ni usted lo puede volver a ver. Si se pierde, genere otro.">
                Código para {codigo.correo}
              </Titulo>
              <div className="mono" style={{ padding: "14px 16px", background: T.fondo,
                borderRadius: T.rs, border: `1px solid ${T.linea}`, wordBreak: "break-all",
                fontSize: 14 }}>{codigo.token}</div>
              <div className="flex gap-2 flex-wrap" style={{ marginTop: 12 }}>
                <Boton size="s" onClick={() => copiar(codigo.token)}>Copiar el código</Boton>
                <Boton size="s" tipo="suave" onClick={() => copiar(
                  `Hola. Para ver su recibo de condominio y reportar sus pagos, entre a ` +
                  `${location.origin}${location.pathname.replace(/[^/]*$/, "")}\n\n` +
                  `Cree su cuenta con el correo ${codigo.correo} y pegue este código:\n${codigo.token}`
                )}>Copiar el mensaje completo</Boton>
                <Boton size="s" tipo="fantasma" onClick={() => setCodigo(null)}>Ya lo envié</Boton>
              </div>
              <p style={{ fontSize: 12.5, color: T.tenue, marginBottom: 0, marginTop: 12 }}>
                Vence a los 7 días y se usa una sola vez.
              </p>
            </Tarjeta>
          )}
        </>
      )}

      {pest === "pendientes" && (
        <Tarjeta pad={false}>
          <div style={{ padding: "20px 20px 0" }}>
            <Titulo sub="El código no se guarda, solo su huella. Por eso aquí no se puede volver a leer.">
              Invitaciones
            </Titulo>
          </div>
          <div className="scroll-x">
            <table>
              <thead><tr><th>Correo</th><th>Unidad</th><th>Relación</th>
                <th>Creada</th><th>Estado</th><th></th></tr></thead>
              <tbody>
                {invs.map((i) => (
                  <tr key={i.id}>
                    <td>{i.correo}</td>
                    <td className="mono">{i.unidad || "—"}</td>
                    <td>{i.relacion || "—"}</td>
                    <td className="mono" style={{ fontSize: 12 }}>
                      {String(i.creada_en).slice(0, 10)}</td>
                    <td>
                      <Pastilla size="s" tono={i.estado === "aceptada" ? "verde"
                        : i.estado === "vencida" ? "rojo" : "ambar"}>{i.estado}</Pastilla>
                    </td>
                    <td>
                      {i.estado === "pendiente" && (
                        <Boton size="s" tipo="suave" onClick={() => revocar(i.id)}>Revocar</Boton>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {invs.length === 0 && (
            <div style={{ padding: 34, textAlign: "center", color: T.tenue, fontSize: 14 }}>
              Todavía no ha invitado a nadie.
            </div>
          )}
        </Tarjeta>
      )}

      {pest === "gente" && (
        <Tarjeta pad={false}>
          <div style={{ padding: "20px 20px 0" }}>
            <Titulo sub="Qué ve el inquilino se decide por unidad, no por persona. El propietario siempre ve todo.">
              Quién tiene acceso · {edificio?.nombre}
            </Titulo>
          </div>
          <div className="scroll-x">
            <table className="apila">
              <thead><tr><th>Unidad</th><th>Correo</th><th>Relación</th>
                <th>Qué ve el inquilino</th><th></th></tr></thead>
              <tbody>
                {gente.filter((g) => g.activo).map((g) => (
                  <tr key={g.membresia_id}>
                    <td className="mono cabeza">{g.unidad}</td>
                    <td data-t="Correo" style={{ fontSize: 13 }}>{g.correo}</td>
                    <td data-t="Relación">{g.relacion}</td>
                    <td data-t="Qué ve">
                      <Selector value={g.nivel} style={{ fontSize: 13, padding: "7px 9px" }}
                        onChange={(e) => cambiarNivel(g.unidad_id, e.target.value)}>
                        <option value="mes">Solo el recibo del mes</option>
                        <option value="saldo">El recibo y el saldo total</option>
                        <option value="todo">Todo, igual que el propietario</option>
                      </Selector>
                    </td>
                    <td>
                      <Boton size="s" tipo="suave" onClick={() => darDeBaja(g.membresia_id)}>
                        Dar de baja</Boton>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {gente.filter((g) => g.activo).length === 0 && (
            <div style={{ padding: 34, textAlign: "center", color: T.tenue, fontSize: 14 }}>
              Nadie tiene acceso todavía en este edificio.
            </div>
          )}
        </Tarjeta>
      )}

      {pest === "vigilantes" && verVigilantes && (
        <>
          <Tarjeta>
            <Titulo sub="Un correo por persona o por turno, nunca uno compartido: la bitácora guarda quién hizo cada cosa, y con una cuenta compartida esa firma no sirve de nada.">
              Invitar a un vigilante
            </Titulo>
            <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))" }}>
              <Campo label="Edificio de la garita">
                <Selector value={fv.edificio || edificio?.id || ""}
                  onChange={(e) => setFv({ ...fv, edificio: e.target.value })}>
                  {(edificios || []).map((e2) =>
                    <option key={e2.id} value={e2.id}>{e2.nombre}</option>)}
                </Selector>
              </Campo>
              <Campo label="Correo del vigilante">
                <Entrada value={fv.correo} placeholder="vigilante@correo.com"
                  onChange={(e) => setFv({ ...fv, correo: e.target.value })} />
              </Campo>
            </div>
            <div className="mt-4" style={{ fontSize: 12.5, color: T.tinta2, lineHeight: 1.6 }}>
              El vigilante solo ve el edificio donde lo asigne, y dentro de él solo el
              código de cada unidad y el nombre de quien vive ahí. No ve saldos, ni
              recibos, ni pagos, ni teléfonos.
            </div>
            <div style={{ marginTop: 14 }}>
              <Boton disabled={ocupado} onClick={invitarVigilante}>
                Generar la invitación</Boton>
            </div>
          </Tarjeta>

          {codigoVig && (
            <Tarjeta>
              <Titulo sub="Este código se muestra una sola vez. Pásaselo al vigilante junto con el enlace de la garita.">
                Código para {codigoVig.correo}
              </Titulo>
              <div className="mono" style={{ padding: "14px 16px", background: T.fondo,
                borderRadius: T.rs, wordBreak: "break-all", fontSize: 13.5 }}>
                {codigoVig.token}
              </div>
              <div className="flex gap-2 mt-4 flex-wrap">
                <Boton tipo="suave" onClick={() => copiar(codigoVig.token)}>Copiar el código</Boton>
                <Boton tipo="suave" onClick={() => copiar(
                  `Hola. Para entrar al panel de seguridad de la garita, abra ` +
                  `${location.origin}${location.pathname.replace(/[^/]*$/, "")}garita.html\n\n` +
                  `Toque "Es mi primera vez", cree su clave con el correo ` +
                  `${codigoVig.correo} y pegue este código:\n${codigoVig.token}`
                )}>Copiar el mensaje completo</Boton>
                <Boton tipo="fantasma" onClick={() => setCodigoVig(null)}>Listo</Boton>
              </div>
            </Tarjeta>
          )}

          <Tarjeta pad={false}>
            <div style={{ padding: "20px 20px 0" }}>
              <Titulo sub="Al que deja el puesto se le da de baja, no se le borra: la bitácora que firmó tiene que seguir teniendo a quién apuntar.">
                Vigilantes
              </Titulo>
            </div>
            {vigis.length === 0 ? (
              <div style={{ padding: 34, textAlign: "center", color: T.tenue, fontSize: 14 }}>
                Todavía no hay vigilantes dados de alta.
              </div>
            ) : (
              <div className="scroll-x">
                <table className="apila">
                  <thead>
                    <tr>
                      <th>Correo</th><th>Edificio</th><th>Anotaciones</th>
                      <th>Última vez</th><th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {vigis.map((v) => (
                      <tr key={v.membresia_id} style={{ opacity: v.activo ? 1 : .55 }}>
                        <td data-t="Correo" className="cabeza">{v.correo}</td>
                        <td data-t="Edificio">{v.edificio || "—"}</td>
                        <td data-t="Anotaciones" className="num">{v.anotaciones}</td>
                        <td data-t="Última vez">
                          {v.ultima_anotacion
                            ? fechaDia(v.ultima_anotacion)
                            : <span style={{ color: T.tenue }}>nunca</span>}
                        </td>
                        <td data-t="">
                          {v.activo
                            ? <Boton size="s" tipo="suave"
                                onClick={() => fijarVigilante(v.membresia_id, false)}>
                                Dar de baja</Boton>
                            : <Boton size="s" tipo="suave"
                                onClick={() => fijarVigilante(v.membresia_id, true)}>
                                Reactivar</Boton>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Tarjeta>
        </>
      )}
    </div>
  );
}

/* El recibo tal como lo va a ver el propietario. Se arma como una
   página suelta para poder mostrarla en pantalla y mandarla a imprimir
   con el mismo código: si la vista previa y lo impreso salieran de dos
   lugares distintos, tarde o temprano dirían cosas distintas.

   "Guardar como PDF" es la impresión del navegador. Adjuntar el PDF a un
   correo automático necesita un servidor propio, que todavía no existe. */
/* ═══════════════════════════════════════════════════════════════════
   RECIBO EN PAPEL · una sola plantilla para la aplicación y el portal
   ─────────────────────────────────────────────────────────────────
   Decisiones de diseño, para que nadie las deshaga sin querer:

   · Todo va dentro de una <table> con <thead>. Es la única forma que
     respetan todos los navegadores para REPETIR EL ENCABEZADO cuando
     el recibo se pasa a una segunda hoja.
   · El desglose va a dos columnas. Un edificio con 25 partidas cabía
     en dos hojas con una sola columna y cabe en una con dos.
   · Los cortes de categoría llevan break-inside: avoid, así una
     categoría no se parte por la mitad entre columnas ni entre hojas.
   · print-color-adjust: exact para que los fondos de marca salgan
     impresos; sin eso el navegador los blanquea "para ahorrar tinta".
   ═════════════════════════════════════════════════════════════════ */
function htmlRecibo(d) {
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const nf = (n) => new Intl.NumberFormat("es-VE",
    { minimumFractionDigits: n, maximumFractionDigits: n });
  const m = (v) => "$ " + nf(2).format(Number(v) || 0);
  const r = d.recibo || {};
  const det = Array.isArray(r.detalle) ? r.detalle : [];
  const con = Array.isArray(r.conceptos) ? r.conceptos : [];
  const base = (typeof location !== "undefined")
    ? String(location.href).replace(/[^/]*$/, "") : "";

  const linea = (t, v, cls) =>
    `<tr class="${cls || ""}"><td>${esc(t)}</td><td class="d">${m(v)}</td></tr>`;

  const resumen = [
    ...con.map((l) => linea(l.nombre, l.monto)),
    Number(r.directos) > 0 ? linea("Cargos de su unidad", r.directos) : "",
    Number(r.anterior) > 0 ? linea("Saldo del mes anterior", r.anterior) : "",
    Number(r.a_favor)  > 0 ? linea("A su favor", -r.a_favor) : "",
    Number(r.mora)     > 0 ? linea("Intereses de mora", r.mora) : "",
    linea("Total", r.total, "tot"),
  ].join("");

  /* Con pocas partidas, dos columnas dejan la hoja medio vacía y cada
     concepto apretado en la mitad del ancho. El desglose decide solo:
     hasta 14 renglones va a todo el ancho, de ahí en adelante a dos
     columnas. El corte no es un capricho: 14 renglones a una columna
     ocupan más o menos lo mismo que 28 a dos, y por debajo de eso la
     página se ve rota. */
  const renglones = det.reduce((n, c) => n + 1 + (c.lineas || []).length, 0);
  const anchoCompleto = renglones <= 14;

  const desglose = det.map((cat) => `<div class="cat">
      <div class="cn">${esc(cat.categoria)}</div>
      <table class="dt">${(cat.lineas || []).map((l) => `<tr>
        <td class="c">${esc(l.concepto)}${l.referencia
          ? `<span class="rf"> · ${esc(l.referencia)}</span>` : ""}</td>
        <td class="d gr">${m(l.monto)}</td>
        <td class="d pa">${m(l.parte)}</td></tr>`).join("")}</table>
    </div>`).join("");

  const cab = `
    <div class="cab">
      <div class="cab-i">
        ${d.logoOrg ? `<img class="logo-org" src="${esc(d.logoOrg)}" alt="">` : ""}
        <div>
          <div class="ed">${esc(d.edificio || "")}</div>
          <div class="or">${esc(d.rif ? "RIF " + d.rif + " · " : "")}${esc(d.organizacion || "")}</div>
        </div>
      </div>
      <div class="cab-d">
        <div class="et">Recibo</div>
        <div class="nu">${esc(r.numero || "")}</div>
        <div class="or">${esc(r.etiqueta || "")}</div>
      </div>
    </div>
    <div class="uni">
      <div><span class="et">Unidad</span><div class="ud">${esc(d.unidad || "")}</div></div>
      <div><span class="et">Alícuota</span><div class="uv">${nf(4).format(r.alicuota || 0)} %</div></div>
      ${d.propietario ? `<div class="pr"><span class="et">Propietario</span>
        <div class="uv">${esc(d.propietario)}</div></div>` : ""}
    </div>`;

  return `<!doctype html><html lang="es"><head><meta charset="utf-8">

/* El correo lo arma la BASE, no esta página. Si lo armara aquí, la

/* ── Estadísticas del edificio, para llevar a la asamblea ──

   Regla de este módulo: **ningún número se calcula acá**. Todo viene de
   la base (migración 42), que a su vez lo lee de lo que quedó congelado
   al cerrar el mes. Si la pantalla hiciera sus propias cuentas,
   volveríamos a la familia de error que ya mordió tres veces: la
   pantalla promete un número y el recibo trae otro, y el administrador
   queda como mentiroso delante de cien personas.

   Sobre los gráficos: las barras de gasto son UNA medida comparada
   entre categorías, así que van todas del mismo color. Pintar cada
   categoría de un color distinto sugiere que el color significa algo, y
   no significa nada. En la serie del año sí hay dos medidas distintas
   —lo facturado y lo cobrado— y ahí sí hacen falta dos colores, con su
   leyenda. */

const Cifra = ({ rotulo, valor, pie, tono }) => (

);

const BarraGasto = ({ nombre, monto, pct, variacion, max }) => (
  <div style={{ marginBottom: 12 }}>

    <div style={{ height: 9, background: T.fondo, borderRadius: 999, overflow: "hidden" }}
      title={`${nombre}: ${usd(monto)} · ${nf(1).format(pct)} % del gasto del mes`}>

function SerieAnual({ filas }) {

  const max = Math.max(...filas.map((f) => Math.max(num0(f.facturado), num0(f.cobrado))), 1);
  const corto = (m) => (MESES[(m || 1) - 1] || "").slice(0, 3);

  return (
    <div>

              <div title={`${f.etiqueta} · cobrado ${usd(f.cobrado)} (${nf(0).format(f.pct_cobrado)} %)`}

function Estadisticas({ sb, org, edificio, periodos, notificar, fallo }) {
  const cerrados = (periodos || []).filter((p) => p.estado === "cerrado")
    .slice().sort((a, b) => (b.anio - a.anio) || (b.mes - a.mes));
  const [periodoId, setPeriodoId] = useState(cerrados[0]?.id || "");
  const [d, setD] = useState({ resumen: null, categorias: [], top: [], serie: [], mora: [] });
  const [cargando, setCargando] = useState(false);
  const [bloqueado, setBloqueado] = useState(null);

  const periodo = cerrados.find((p) => p.id === periodoId) || null;

  useEffect(() => {
    if (!periodoId && cerrados[0]) setPeriodoId(cerrados[0].id);
  }, [cerrados.length]);

  useEffect(() => {
    if (!sb || !periodoId || !edificio) return;
    let vivo = true;
    setCargando(true); setBloqueado(null);
    Promise.all([
      sb.rpc("estadisticas_periodo", { p_periodo: periodoId }),
      sb.rpc("gastos_por_categoria", { p_periodo: periodoId }),
      sb.rpc("top_gastos", { p_periodo: periodoId, p_n: 6 }),
      sb.rpc("serie_edificio", { p_edificio: edificio.id, p_meses: 12 }),
      sb.rpc("morosidad_edificio", { p_edificio: edificio.id }),
    ]).then(([r1, r2, r3, r4, r5]) => {
      if (!vivo) return;
      setCargando(false);
      /* El primer error se muestra tal cual. Antes esta pantalla se
         tragaba el error y quedaba igual que "todavía no hay datos",
         que es la peor forma de fallar: nadie sabe qué arreglar. */
      const err = [r1, r2, r3, r4, r5].map((x) => x.error).find(Boolean);
      if (err) { setBloqueado(err.message || String(err)); return; }
      setD({ resumen: (r1.data || [])[0] || null, categorias: r2.data || [],
             top: r3.data || [], serie: r4.data || [], mora: r5.data || [] });
    });
    return () => { vivo = false; };
  }, [sb, periodoId, edificio && edificio.id]);

  const maxCat = Math.max(...(d.categorias || []).map((c) => num0(c.monto)), 0);
  const r = d.resumen;

  const imprimir = () => {
    if (!r) return notificar("Todavía no hay un mes cerrado que presentar.", "error");
    const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    const base = String(location.href).replace(/[^/]*$/, "");
    const m = Math.max(...(d.categorias || []).map((c) => num0(c.monto)), 1);

    const cats = (d.categorias || []).map((c) => `<tr>
      <td>${esc(c.categoria)}</td>
      <td class="barra"><i style="width:${(num0(c.monto) / m) * 100}%"></i></td>
      <td class="d">${usd(c.monto)}</td>
      <td class="d pq">${nf(1).format(c.pct)} %</td>
      <td class="d pq">${c.variacion_pct === null || c.variacion_pct === undefined ? "—"
        : (num0(c.variacion_pct) > 0 ? "+" : "") + nf(0).format(c.variacion_pct) + " %"}</td></tr>`).join("");

    const tops = (d.top || []).map((g) => `<tr>
      <td>${esc(g.concepto)}</td><td class="pq">${esc(g.categoria)}</td>
      <td class="d">${usd(g.monto)}</td>
      <td class="d pq">${nf(1).format(g.pct)} %</td></tr>`).join("");

    const mora = (d.mora || []).map((t) => `<tr>
      <td>${esc(t.tramo)}</td>
      <td class="d">${t.unidades}</td>
      <td class="d">${usd(t.monto)}</td>
