function Cortes({ sb, org, edificio, unidades, periodos, tasa, notificar, fallo, verFicha, recargar }) {
  const cerrados = periodos.filter((p) => p.estado === "cerrado");
  const [periodoId, setPeriodoId] = useState(cerrados[0]?.id || "");
  const [recibos, setRecibos] = useState([]);
  const [plantilla, setPlantilla] = useState(() => leerLocal("vecitap_plantilla") || PLANTILLA);
  const [cargando, setCargando] = useState(false);
  const [previa, setPrevia] = useState(null);
  const [nota, setNota] = useState({ texto: "", hasta: "" });
  const [guardandoNota, setGuardandoNota] = useState(false);
  const [verNota, setVerNota] = useState(false);
  const [prueba, setPrueba] = useState(null);
  const [correo, setCorreo] = useState(null);     // lo que devuelve la base
  const [destinos, setDestinos] = useState([]);  // uno por persona
  const [destinoPrueba, setDestinoPrueba] = useState("");
  const [envio, setEnvio] = useState(null);       // resumen de la cola
  const [enviando, setEnviando] = useState(false);
  const [confirmaEnvio, setConfirmaEnvio] = useState(false);

  useEffect(() => { if (!periodoId && cerrados[0]) setPeriodoId(cerrados[0].id); }, [cerrados.length]);

  useEffect(() => {
    if (!periodoId) return;
    setCargando(true);
    sb.from("recibos").select("id,unidad_id,numero,cuota,directos,anterior,a_favor,mora," +
        "honorario,servicio,anterior_hon,anterior_serv,total,conceptos,detalle")
      .eq("periodo_id", periodoId).then(({ data, error }) => {
        setCargando(false);
        if (error) return fallo(error);
        setRecibos(data || []);
      });
  }, [periodoId]);

  const periodo = cerrados.find((p) => p.id === periodoId);

  const cargarEnvio = async () => {
    const { data } = await sb.rpc("resumen_correos", { p_org: org.id });
    setEnvio((Array.isArray(data) ? data[0] : data) || null);
  };
  useEffect(() => { cargarEnvio(); }, [org.id, periodoId]);

  /* Nota de la administradora: un mensaje suyo que se anexa al correo
     de todos los recibos. Se guarda por organización, no por envío. */
  const cargarNota = async () => {
    const { data } = await sb.from("ajustes_correo")
      .select("nota,nota_hasta").eq("org_id", org.id).maybeSingle();
    setNota({ texto: data?.nota || "", hasta: data?.nota_hasta || "" });
  };
  useEffect(() => { cargarNota(); }, [org.id]);

  const guardarNota = async () => {
    setGuardandoNota(true);
    const { error } = await sb.from("ajustes_correo")
      .upsert({ org_id: org.id, nota: nota.texto.trim() || null,
                nota_hasta: nota.hasta || null }, { onConflict: "org_id" });
    setGuardandoNota(false);
    if (error) return fallo(error);
    notificar(nota.texto.trim()
      ? "Nota guardada. Va a salir en los correos de los recibos."
      : "Nota borrada. Los correos vuelven a salir sin mensaje.");
    cargarNota();
  };

  /* Encolar y despachar son dos pasos a propósito: encolar deja los
     correos listos y no se queda esperando a que un servicio de afuera
     responda. Si el despacho falla, la cola queda y se reintenta sola. */
  const enviarRecibos = async () => {
    setEnviando(true);
    const { data, error } = await sb.rpc("encolar_recibos", { p_periodo: periodoId });
    if (error) { setEnviando(false); return fallo(error); }
    const x = Array.isArray(data) ? data[0] : data;

    const d = await sb.rpc("despachar_ahora");
    setEnviando(false);
    if (d.error) {
      notificar(`Se encolaron ${x.encolados} correos, pero el envío falló: ${d.error.message}`, "error");
    } else if (d.data?.error) {
      notificar(`Se encolaron ${x.encolados} correos, pero el envío falló: ${d.data.error}`, "error");
    } else {
      notificar(`${x.encolados} correos encolados` +
        (x.sin_correo ? ` · ${x.sin_correo} unidades sin correo` : "") +
        (x.rebotados ? ` · ${x.rebotados} con dirección rebotada` : "") +
        (x.ya_estaban ? ` · ${x.ya_estaban} ya se habían enviado` : ""));
    }
    cargarEnvio(); recargar && recargar();
  };

  useEffect(() => {
    if (prueba === null) { setCorreo(null); setDestinos([]); return; }
    const r = recibos.find((x) => x.unidad_id === prueba) || recibos[0];
    if (!r) return;
    setCorreo(null);
    /* correo_recibo devuelve una fila por destinatario: al propietario,
       al inquilino, o a los dos. La vista previa enseña el primero y
       dice a cuántos va. */
    sb.rpc("correo_recibo", { p_recibo: r.id }).then(({ data, error }) => {
      if (error) return fallo(error);
      const filas = Array.isArray(data) ? data : (data ? [data] : []);
      setDestinos(filas);
      setCorreo(filas[0] || null);
    });
  }, [prueba]);

  const enviarPrueba = async () => {
    const r = recibos.find((x) => x.unidad_id === prueba) || recibos[0];
    if (!r) return;
    if (!/.+@.+\..+/.test(destinoPrueba.trim()))
      return notificar("Escriba a qué correo mandarla.", "error");
    setEnviando(true);
    const { error } = await sb.rpc("encolar_prueba",
      { p_recibo: r.id, p_destino: destinoPrueba.trim() });
    if (error) { setEnviando(false); return fallo(error); }
    const d = await sb.rpc("despachar_ahora");
    setEnviando(false);
    if (d.error || d.data?.error)
      return notificar("Se encoló, pero el envío falló: " +
        (d.error?.message || d.data.error), "error");
    notificar(`Prueba enviada a ${destinoPrueba.trim()}. Revise la bandeja y también el spam.`);
    cargarEnvio();
  };

  const textoDe = (r) => {
    const u = unidades.find((x) => x.id === r.unidad_id);
    const p = vigente(u, "propietario");
    const t = Number(r.total) || 0;
    return plantilla
      .replace(/{nombre}/g, nombreDe(p) || "estimado propietario")
      .replace(/{unidad}/g, u?.codigo || "")
      .replace(/{periodo}/g, periodo?.etiqueta || "")
      .replace(/{recibo}/g, r.numero)
      .replace(/{cuota}/g, usd(r.cuota))
      .replace(/{anterior}/g, usd(Number(r.anterior) + Number(r.anterior_hon) + Number(r.anterior_serv)))
      .replace(/{mora}/g, usd(r.mora))
      .replace(/{total}/g, usd(t))
      .replace(/{totalBs}/g, periodo?.tasa_bcv ? bs(t * periodo.tasa_bcv) : "—")
      .replace(/{tasa}/g, periodo?.tasa_bcv ? nf(2).format(periodo.tasa_bcv) : "—");
  };

  const armar = (r) => {
    const u = unidades.find((x) => x.id === r.unidad_id);
    const p = vigente(u, "propietario");
    const q = vigente(u, "inquilino");
    return htmlRecibo({
      edificio: edificio?.nombre,
      organizacion: org?.nombre,
      rif: edificio?.rif,
      logoOrg: org?.logo_url || "",
      unidad: u?.codigo,
      propietario: nombreDe(p) || nombreDe(q),
      vence: fechaDia(r.vence_el),
      /* `tasa` es la del BCV de hoy, la misma que se ve arriba en la
         pantalla. Es la que va al papel, no la congelada del período. */
      tasaHoy: tasa && tasa.valor > 0
        ? { valor: tasa.valor, fecha: tasa.actualizada } : null,
      recibo: { ...r, etiqueta: periodo?.etiqueta },
    });
  };

  /* Todos los recibos en un solo documento, uno por página. Es lo que
     permite mandarlos a imprimir o guardarlos como un PDF único
     mientras no exista el servidor de envíos. */
  const imprimirTodos = () => {
    if (!recibos.length) return;
    const w = window.open("", "_blank");
    if (!w) return notificar("El navegador bloqueó la ventana. Permita las ventanas emergentes.", "error");
    const cuerpos = recibos.map((r) => {
      const html = armar(r);
      const dentro = html.split("<body>")[1].split("</body>")[0];
      return `<div style="page-break-after:always">${dentro}</div>`;
    }).join("");
    const cabeza = armar(recibos[0]).split("</head>")[0] + "</head>";
    w.document.write(cabeza + "<body>" + cuerpos + "</body></html>");
    w.document.close();
    w.onload = () => { w.focus(); w.print(); };
    setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 900);
  };

  const imprimir = (r) => {
    const w = window.open("", "_blank");
    if (!w) return notificar("El navegador bloqueó la ventana. Permita las ventanas emergentes.", "error");
    w.document.write(armar(r));
    w.document.close();
    // Se espera a que las fuentes y el diseño estén listos, si no imprime en blanco
    w.onload = () => { w.focus(); w.print(); };
    setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 700);
  };

  const marcarEnviados = async (enviado) => {
    const { error } = await sb.rpc("marcar_enviado",
      { p_periodo: periodoId, p_enviado: enviado });
    if (error) return fallo(error);
    notificar(enviado ? "Mes marcado como enviado. Reabrirlo ahora pide confirmación aparte."
                      : "Se quitó la marca de enviado.");
    recargar && recargar();
  };

  /* ── El listado del mes, en papel ──────────────────────────────
     Lo que la administradora lleva a la junta o archiva: quién debe qué
     este mes, con el total abajo. Mismo lenguaje visual que el recibo,
     con el "powered by Vecitap" al pie. */
  const listadoPDF = () => {
    if (!recibos.length) return notificar("No hay recibos que listar.", "error");
    const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    const base = String(location.href).replace(/[^/]*$/, "");

    let tCuota = 0, tMora = 0, tAdm = 0, tAnt = 0, tTotal = 0;
    const filas = recibos.map((r) => {
      const u = unidades.find((x) => x.id === r.unidad_id);
      const p = vigente(u, "propietario"), q = vigente(u, "inquilino");
      const ant = Number(r.anterior) + Number(r.anterior_hon) + Number(r.anterior_serv);
      tCuota += Number(r.cuota) + Number(r.directos); tMora += Number(r.mora);
      tAdm += Number(r.honorario) + Number(r.servicio); tAnt += ant;
      tTotal += Number(r.total);
      return `<tr>
        <td class="cod">${esc(u?.codigo)}</td>
        <td>${esc(nombreDe(p) || nombreDe(q) || "sin registrar")}</td>
        <td class="d">${usd(Number(r.cuota) + Number(r.directos))}</td>
        <td class="d">${usd(ant)}</td>
        <td class="d">${usd(r.mora)}</td>
        <td class="d">${usd(Number(r.honorario) + Number(r.servicio))}</td>
        <td class="d tot">${usd(r.total)}</td></tr>`;
    }).join("");

    const doc = `<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Cortes ${esc(periodo?.etiqueta || "")}</title>
<style>
  @page { size: Letter; margin: 12mm 13mm 10mm; }
  *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        color:#0A1128; font-size:9.5pt }
  .hoja{ width:100%; border-collapse:collapse }
  .hoja > thead{ display:table-header-group }
  .hoja > thead > tr > td, .hoja > tbody > tr > td{ padding:0; border:0 }
  .cab{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
        padding-bottom:9px; border-bottom:2.5px solid #0A1128; margin-bottom:12px }
  h1{ font-size:15pt; margin:0; letter-spacing:-.01em }
  .or{ font-size:8pt; color:#64748B; margin-top:2px }
  .et{ font-size:6.7pt; text-transform:uppercase; letter-spacing:.1em; color:#64748B;
       font-weight:700; display:block; text-align:right }
  .mes{ font-size:12pt; font-weight:700; text-align:right; white-space:nowrap }
  table.lista{ width:100%; border-collapse:collapse }
  table.lista th{ font-size:6.8pt; text-transform:uppercase; letter-spacing:.09em;
    color:#64748B; text-align:left; padding:0 6px 5px; border-bottom:1px solid #0A1128 }
  table.lista th.d{ text-align:right }
  table.lista td{ padding:4.4px 6px; border-bottom:1px solid #E4E9F0; font-size:8.6pt }
  table.lista td.d{ text-align:right; white-space:nowrap;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace }
  table.lista td.cod{ font-weight:700;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace }
  table.lista td.tot{ font-weight:700 }
  table.lista tr.suma td{ border-top:1.5px solid #0A1128; border-bottom:0;
    padding-top:7px; font-weight:700; font-size:9.5pt }
  .pie{ margin-top:14px; padding-top:8px; border-top:1px solid #D0D7E2;
        display:flex; justify-content:space-between; align-items:flex-end; gap:18px }
  .pie p{ margin:0; font-size:7.4pt; color:#64748B; line-height:1.5; max-width:74% }
  .marca{ text-align:right; white-space:nowrap }
  .marca span{ font-size:6.5pt; color:#64748B; letter-spacing:.05em; display:block;
               margin-bottom:2px }
  .marca img{ height:15px }
  .marca b{ font-size:9pt; color:#0A1128 }
</style></head><body>
<table class="hoja"><thead><tr><td>
  <div class="cab">
    <div>
      <h1>${esc(edificio?.nombre || "")}</h1>
      <div class="or">${esc(edificio?.rif ? "RIF " + edificio.rif + " · " : "")}${esc(org?.nombre || "")}</div>
    </div>
    <div>
      <span class="et">Cortes de cuenta</span>
      <div class="mes">${esc(periodo?.etiqueta || "")}</div>
      <div class="or">${recibos.length} unidades</div>
    </div>
  </div>
</td></tr></thead><tbody><tr><td>
  <table class="lista">
    <thead><tr><th>Unidad</th><th>Propietario</th><th class="d">Del mes</th>
      <th class="d">Anterior</th><th class="d">Mora</th><th class="d">Administración</th>
      <th class="d">Total</th></tr></thead>
    <tbody>${filas}
      <tr class="suma"><td colspan="2">Total del edificio</td>
        <td class="d">${usd(tCuota)}</td><td class="d">${usd(tAnt)}</td>
        <td class="d">${usd(tMora)}</td><td class="d">${usd(tAdm)}</td>
        <td class="d">${usd(tTotal)}</td></tr>
    </tbody>
  </table>
  <div class="pie">
    <p>Listado de los recibos emitidos en ${esc(periodo?.etiqueta || "")}. Los montos están
       en dólares; el equivalente en bolívares se calcula con la tasa del día en que cada
       propietario pague.</p>
    <div class="marca"><span>powered by</span>
      <img src="${base}logo-claro.png" alt="Vecitap"
           onerror="this.outerHTML='<b>vecitap</b>'"></div>
  </div>
</td></tr></tbody></table>
</body></html>`;

    const w = window.open("", "_blank");
    if (!w) return notificar("El navegador bloqueó la ventana. Permita las ventanas emergentes.", "error");
    w.document.write(doc);
    w.document.close();
    w.onload = () => { w.focus(); w.print(); };
    setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 800);
  };

  const exportarCSV = () => {
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const filas = [
      ["unidad", "propietario", "telefono", "correo", "recibo", "cuota", "directos",
       "mora", "administracion", "servicio", "anterior", "total"].join(","),
      ...recibos.map((r) => {
        const u = unidades.find((x) => x.id === r.unidad_id);
        const p = vigente(u, "propietario");
        return [esc(u?.codigo), esc(nombreDe(p)), esc(p?.personas?.telefono),
          esc(p?.personas?.correo), esc(r.numero), esc(nf(2).format(r.cuota)),
          esc(nf(2).format(r.directos)), esc(nf(2).format(r.mora)),
          esc(nf(2).format(r.honorario)), esc(nf(2).format(r.servicio)),
          esc(nf(2).format(Number(r.anterior) + Number(r.anterior_hon) + Number(r.anterior_serv))),
          esc(nf(2).format(r.total))].join(",");
      })].join("\n");
    const url = URL.createObjectURL(new Blob(["﻿" + filas], { type: "text/csv;charset=utf-8;" }));
    const a = document.createElement("a");
    a.href = url; a.download = `cortes-${periodo?.etiqueta || "mes"}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    notificar("Listado exportado.");
  };

  if (!cerrados.length) {
    return <Vacio icono={icono("Send")} titulo="Todavía no hay recibos que enviar"
      texto="Los cortes de cuenta se arman con los recibos de un mes ya cerrado." />;
  }

  return (
    <div className="grid gap-5">
      <Tarjeta>
        <Titulo sub="Los recibos ya emitidos. El correo sale solo con el diseño de Vecitap; WhatsApp y la impresión quedan para los casos sueltos.">
          Cortes de cuenta
        </Titulo>
        <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))" }}>
          <Campo label="Mes">
            <Selector value={periodoId} onChange={(e) => setPeriodoId(e.target.value)}>
              {cerrados.map((p) => <option key={p.id} value={p.id}>{p.etiqueta}</option>)}
            </Selector>
          </Campo>
          <div style={{ alignSelf: "end" }} className="flex gap-2 flex-wrap">
            <Boton tipo="suave" onClick={listadoPDF}
              title="Abre el listado del mes listo para imprimir o guardar como PDF">
              <Ic n="Printer" size={15} /> Listado en PDF</Boton>
            <Boton tipo="fantasma" onClick={exportarCSV}
              title="El mismo listado como archivo de Excel, para el contador">
              <Ic n="Download" size={15} /> CSV
            </Boton>
            <Boton tipo="suave" onClick={imprimirTodos}>
              <Ic n="Printer" size={15} /> Imprimir los {recibos.length} recibos
            </Boton>
            <Boton tipo="suave" disabled={!recibos.length}
              onClick={() => setPrueba(recibos[0]?.unidad_id || "")}>
              <Ic n="Mail" size={15} /> Probar el correo
            </Boton>
            <Boton disabled={!recibos.length || enviando}
              onClick={() => setConfirmaEnvio(true)}>
              <Ic n="Send" size={15} /> {enviando ? "Enviando…" : "Enviar por correo"}
            </Boton>
            {periodo && (periodo.enviado_en
              ? <Boton tipo="fantasma" onClick={() => marcarEnviados(false)}>
                  <Ic n="Undo2" size={15} /> Quitar "enviados"</Boton>
              : <Boton tipo="suave" onClick={() => marcarEnviados(true)}>
                  <Ic n="Check" size={15} /> Marcar como enviados</Boton>)}
          </div>
        </div>
        {envio && (envio.pendientes > 0 || envio.enviados > 0 || envio.fallidos > 0) && (
          <div className="flex gap-4 flex-wrap" style={{ marginTop: 14, padding: "12px 14px",
            background: T.fondo, borderRadius: T.rs, border: `1px solid ${T.linea}`,
            fontSize: 13 }}>
            <span><b className="mono">{envio.enviados}</b> enviados</span>
            {envio.pendientes > 0 && <span style={{ color: T.ambar }}>
              <b className="mono">{envio.pendientes}</b> en cola</span>}
            {envio.fallidos > 0 && <span style={{ color: T.rojo }}>
              <b className="mono">{envio.fallidos}</b> fallidos</span>}
            {envio.malos > 0 && <span style={{ color: T.tenue }}>
              <b className="mono">{envio.malos}</b> direcciones que rebotaron</span>}
            {envio.ultimo_envio && <span style={{ color: T.tenue }}>
              último {String(envio.ultimo_envio).slice(0, 16).replace("T", " ")}</span>}
            <Boton size="s" tipo="fantasma"
              title={"Los correos no salen en el instante: quedan en una cola y una tarea " +
                     "automática los manda cada 5 minutos. Este botón los manda ya, sin " +
                     "esperar esa tarea. Sirve para comprobar de una vez que están saliendo."}
              onClick={async () => {
                const d = await sb.rpc("despachar_ahora");
                if (d.error) return fallo(d.error);
                notificar("Se mandaron los correos que estaban en cola."); cargarEnvio();
              }}>Enviar ahora los pendientes</Boton>
          </div>
        )}
        {envio && (
          <p style={{ fontSize: 11.5, color: T.tenue, marginTop: 8, lineHeight: 1.6 }}>
            Los correos no salen en el instante: quedan en una cola y una tarea automática
            los manda cada 5 minutos. Así, si el servicio de correo falla un momento, el
            envío se reintenta solo en vez de perderse.
          </p>
        )}

        {periodo && (
          <div style={{ marginTop: 14, fontSize: 13, color: T.tinta2 }}>
            {periodo.enviado_en
              ? <>Marcado como <b>enviado</b> el {String(periodo.enviado_en).slice(0, 10)}.
                  Desde el cierre del mes, reabrirlo va a pedir una confirmación aparte.</>
              : <>Todavía <b>sin marcar como enviado</b>. Mientras esté así, el mes se puede
                  reabrir y corregir sin ceremonia.</>}
          </div>
        )}

        {/* ── Nota opcional dentro del correo ──────────────────────
            Va guardada por administradora y sale en el correo de todos
            los recibos. Con fecha de caducidad para que no se quede
            colgada de un mes al siguiente sin que nadie lo note. */}
        <div style={{ marginTop: 16, padding: "14px 16px", borderRadius: T.rs,
          background: nota.texto ? T.ambarBg : T.fondo, border: `1px solid ${T.linea}` }}>
          <div className="flex items-center justify-between gap-3 flex-wrap">
            <div>
              <div style={{ fontWeight: 600, fontSize: 14 }}>
                Mensaje de la administradora en el correo</div>
              <div style={{ fontSize: 12.5, color: T.tinta2, marginTop: 2 }}>
                {nota.texto
                  ? <>Sale en el correo de todos los recibos
                      {nota.hasta ? <> · hasta el {nota.hasta}</> : <> · sin fecha de fin</>}</>
                  : "Ninguno. Opcional: un aviso suyo dentro del correo del recibo."}
              </div>
            </div>
            <Boton size="s" tipo="suave" onClick={() => setVerNota(!verNota)}>
              {verNota ? "Cerrar" : nota.texto ? "Cambiar" : "Escribir uno"}
            </Boton>
          </div>

          {verNota && (
            <div style={{ marginTop: 14 }}>
              <Campo label="El mensaje"
                ayuda="Por ejemplo: la asamblea es el sábado 12 a las 10 am en el salón.">
                <textarea rows={3} value={nota.texto} maxLength={600}
                  placeholder="Escriba aquí el aviso que quiere que lean sus propietarios"
                  onChange={(e) => setNota({ ...nota, texto: e.target.value })}
                  style={{ ...estiloEntrada(false), fontSize: 13.5 }} />
              </Campo>
              <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(190px,1fr))" }}>
                <Campo label="Dejar de mostrarlo el"
                  ayuda="En blanco se queda hasta que usted lo borre.">
                  <Entrada type="date" value={nota.hasta}
                    onChange={(e) => setNota({ ...nota, hasta: e.target.value })} />
                </Campo>
                <div style={{ alignSelf: "end" }} className="flex gap-2">
                  <Boton disabled={guardandoNota} onClick={guardarNota}>Guardar</Boton>
                  {nota.texto && (
                    <Boton tipo="fantasma" disabled={guardandoNota}
                      onClick={() => { setNota({ texto: "", hasta: "" });
                                       setTimeout(guardarNota, 0); }}>Quitar</Boton>
                  )}
                </div>
              </div>
              <p style={{ fontSize: 11.5, color: T.tenue, marginTop: 4, lineHeight: 1.6 }}>
                Va dentro del correo, arriba del monto, en un recuadro aparte. Se guarda una
                sola vez y sale en todos los envíos hasta que lo borre o llegue la fecha.
                Use la vista previa de abajo para verlo antes de mandar nada.
              </p>
            </div>
          )}
        </div>

        <div style={{ marginTop: 16 }}>
          <Campo label="Mensaje para WhatsApp"
            ayuda={"Este es el texto de los botones de WhatsApp de la lista de abajo. " +
                   "El correo NO usa esto: el correo se arma solo, con el diseño de Vecitap. " +
                   "Entre llaves van los datos que se reemplazan en cada envío."}>
            <textarea rows={6} value={plantilla}
              onChange={(e) => { setPlantilla(e.target.value); guardarLocal("vecitap_plantilla", e.target.value); }}
              style={{ ...estiloEntrada(false), fontSize: 13 }} />
          </Campo>
          <p style={{ fontSize: 11.5, color: T.tenue, marginTop: 6 }} className="mono">
            {"{nombre} {unidad} {periodo} {recibo} {cuota} {anterior} {mora} {total} {totalBs} {tasa}"}
          </p>
        </div>
      </Tarjeta>

      <Tarjeta pad={false}>
        <div style={{ padding: "20px 20px 0" }}>
          <Titulo sub={`${recibos.length} recibos emitidos en ${periodo?.etiqueta || ""}`}>
            A quién se le envía
          </Titulo>
        </div>
        {cargando ? <Cargando /> : (
          <div className="scroll-x">
            <table className="apila">
              <thead><tr><th>Unidad</th><th>Recibo</th><th>Propietario</th>
                <th style={{ textAlign: "right" }}>Total</th><th></th></tr></thead>
              <tbody>
                {recibos.map((r) => {
                  const u = unidades.find((x) => x.id === r.unidad_id);
                  const p = vigente(u, "propietario");
                  const q = vigente(u, "inquilino");

                  /* El corte no es solo del dueño. Hay edificios donde
                     quien paga es el inquilino, y hay dueños que viven
                     fuera. Se le manda a todo el que esté registrado y
                     tenga marcado el envío. */
                  const gente = [
                    { rol: "Propietario", v: p },
                    { rol: "Inquilino",   v: q },
                  ].filter((x) => x.v && x.v.enviar_corte !== false)
                   .map((x) => ({ ...x,
                     correo: x.v?.personas?.correo || "",
                     tel: normalizarTel(x.v?.personas?.telefono) }))
                   .filter((x) => x.correo || x.tel);

                  const asunto = `Su recibo de condominio · ${u?.codigo} · ${periodo?.etiqueta}`;
                  return (
                    <tr key={r.id}>
                      <td className="mono cabeza" style={{ fontWeight: 600 }}>{u?.codigo}</td>
                      <td className="mono" data-t="Recibo" style={{ fontSize: 12 }}>{r.numero}</td>
                      <td data-t="A quién"><div>
                        {[{ rol: "Propietario", v: p }, { rol: "Inquilino", v: q }]
                          .filter((x) => x.v).map((x) => (
                            <div key={x.rol} style={{ marginBottom: 3 }}>
                              <span style={{ fontSize: 11, color: T.tenue }}>{x.rol}: </span>
                              {nombreDe(x.v)}
                              {x.v.enviar_corte === false &&
                                <span style={{ fontSize: 11, color: T.tenue }}> · no recibe</span>}
                              {x.v?.personas?.correo &&
                                <div style={{ fontSize: 11.5, color: T.tenue }}>{x.v.personas.correo}</div>}
                            </div>
                          ))}
                        {!p && !q && <span style={{ color: T.tenue }}>sin registrar</span>}
                      </div></td>
                      <td className="mono" data-t="Total" style={{ textAlign: "right", fontWeight: 700 }}>{usd(r.total)}</td>
                      <td className="acciones" style={{ width: 240 }}>
                        <div className="flex gap-1 flex-wrap">
                          {gente.map((x) => (
                            <React.Fragment key={x.rol}>
                              {x.tel && <Boton size="s" tipo="suave"
                                href={`https://wa.me/${x.tel}?text=${encodeURIComponent(textoDe(r))}`}>
                                <Ic n="MessageCircle" size={13} /> {x.rol.slice(0, 4)}.</Boton>}
                              {x.correo && <Boton size="s" tipo="suave"
                                href={`mailto:${x.correo}?subject=${encodeURIComponent(asunto)}&body=${
                                  encodeURIComponent(textoDe(r))}`}>
                                <Ic n="Mail" size={13} /> {x.rol.slice(0, 4)}.</Boton>}
                            </React.Fragment>
                          ))}
                          {gente.length === 0 && (
                            <span style={{ fontSize: 11.5, color: T.ambar }}>
                              {(p || q) ? "sin correo ni teléfono" : "sin nadie registrado"}</span>
                          )}
                          <Boton size="s" tipo="suave" onClick={() => setPrevia(r)}>
                            <Ic n="Eye" size={13} /> Vista previa</Boton>
                          <Boton size="s" tipo="fantasma" onClick={() => verFicha(r.unidad_id)}>
                            Ficha</Boton>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Tarjeta>

      {confirmaEnvio && <Confirmar
        titulo={`Enviar los recibos de ${periodo?.etiqueta || ""}`}
        texto={`Se le manda un correo a cada propietario que tenga dirección cargada, con el ` +
               `enlace a su recibo. Las unidades sin correo se saltean y se le dice cuántas ` +
               `fueron. Un recibo que ya se envió no se manda dos veces.`}
        boton="Enviar" onSi={() => { setConfirmaEnvio(false); enviarRecibos(); }}
        onNo={() => setConfirmaEnvio(false)} />}

      {prueba !== null && (() => {
        const r = recibos.find((x) => x.unidad_id === prueba) || recibos[0];
        if (!r) return null;
        const u = unidades.find((x) => x.id === r.unidad_id);
        return (
          <div onClick={() => setPrueba(null)}
            style={{ position: "fixed", inset: 0, zIndex: 90, background: "rgba(0,0,0,.72)",
              display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
            <div onClick={(ev) => ev.stopPropagation()}
              style={{ background: "#fff", borderRadius: T.r, maxWidth: 720, width: "100%",
                maxHeight: "94vh", overflow: "auto", padding: 18 }}>
              <div className="flex justify-between items-start gap-3 flex-wrap mb-3">
                <div>
                  <div style={{ fontWeight: 700 }}>Cómo va a llegar el correo</div>
                  <div style={{ fontSize: 12.5, color: T.tenue }}>
                    Esto lo arma la base, es exactamente lo que se manda.</div>
                </div>
                <Boton size="s" tipo="suave" onClick={() => setPrueba(null)}>Cerrar</Boton>
              </div>

              <div className="flex gap-3 items-end flex-wrap mb-3">
                <Campo label="Unidad" ancho="150px">
                  <Selector value={prueba} onChange={(ev) => setPrueba(ev.target.value)}>
                    {recibos.map((x) => {
                      const uu = unidades.find((y) => y.id === x.unidad_id);
                      return <option key={x.id} value={x.unidad_id}>{uu?.codigo}</option>;
                    })}
                  </Selector>
                </Campo>
                <Campo label="Mandar la prueba a" ancho="240px">
                  <Entrada value={destinoPrueba} placeholder="su-correo@ejemplo.com"
                    onChange={(ev) => setDestinoPrueba(ev.target.value)} />
                </Campo>
                <Boton disabled={enviando} onClick={enviarPrueba}>
                  <Ic n="Send" size={14} /> {enviando ? "Enviando…" : "Enviar la prueba"}</Boton>
              </div>

              {correo ? (
                <>
                  <div style={{ fontSize: 12.5, color: T.tinta2, marginBottom: 6 }}>
                    <b>Asunto:</b> {correo.asunto}<br />
                    <b>Iría a:</b>{" "}
                    {destinos.map((d, i) => (
                      <span key={d.destino}>
                        {i > 0 && " · "}
                        {d.destino} <span style={{ color: T.tenue }}>({d.rol})</span>
                      </span>
                    ))}
                  </div>
                  <iframe title="Correo" srcDoc={correo.html}
                    style={{ width: "100%", height: "56vh", border: `1px solid ${T.linea}`,
                      borderRadius: T.rs, background: "#fff" }} />
                </>
              ) : destinos.length === 0 ? (
                <Aviso tono="ambar" titulo="Esta unidad no le manda correo a nadie">
                  No hay propietario ni inquilino con correo y con el envío marcado.
                  Cárguelo en Propietarios, o marque la casilla "enviarle el corte de cuenta".
                  El botón de prueba de arriba sí funciona: se manda al correo que escriba.
                </Aviso>
              ) : <Cargando />}

              <p style={{ fontSize: 12, color: T.tenue, marginTop: 12, lineHeight: 1.6 }}>
                La prueba sale por el mismo camino que los envíos de verdad y llega marcada
                con <b>[PRUEBA]</b> en el asunto. Si no aparece en unos minutos, revise
                también la carpeta de spam: eso indica que falta afinar el dominio.
              </p>
            </div>
          </div>
        );
      })()}

      {previa && (() => {
        const u = unidades.find((x) => x.id === previa.unidad_id);
        const p = vigente(u, "propietario");
        return (
          <div onClick={() => setPrevia(null)}
            style={{ position: "fixed", inset: 0, zIndex: 90, background: "rgba(0,0,0,.72)",
              display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
            <div onClick={(ev) => ev.stopPropagation()}
              style={{ background: "#fff", borderRadius: T.r, maxWidth: 860, width: "100%",
                maxHeight: "94vh", overflow: "auto", padding: 18 }}>
              <div className="flex justify-between items-start gap-3 flex-wrap"
                style={{ marginBottom: 12 }}>
                <div>
                  <div style={{ fontWeight: 700 }}>
                    Así lo va a recibir {nombreDe(p) || "el propietario"}</div>
                  <div className="mono" style={{ fontSize: 12, color: T.tenue }}>
                    {u?.codigo} · {previa.numero}</div>
                </div>
                <div className="flex gap-2 flex-wrap">
                  <Boton size="s" onClick={() => imprimir(previa)}>
                    <Ic n="Printer" size={14} /> Imprimir o guardar PDF</Boton>
                  <Boton size="s" tipo="suave" onClick={() => setPrevia(null)}>Cerrar</Boton>
                </div>
              </div>

              <iframe title="Recibo" srcDoc={armar(previa)}
                style={{ width: "100%", height: "62vh", border: `1px solid ${T.linea}`,
                  borderRadius: T.rs, background: "#fff" }} />

              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 6 }}>
                  Mensaje que acompaña al recibo</div>
                <pre style={{ whiteSpace: "pre-wrap", fontSize: 12.5, color: T.tinta2,
                  background: T.fondo, padding: "12px 14px", borderRadius: T.rs,
                  border: `1px solid ${T.linea}`, margin: 0, fontFamily: "Inter" }}>
{textoDe(previa)}</pre>
              </div>

              <p style={{ fontSize: 12, color: T.tenue, marginTop: 12, lineHeight: 1.6 }}>
                <b>Guardar PDF</b> usa la impresión del navegador: elija "Guardar como PDF"
                como destino. El correo automático no lleva el PDF adjunto a propósito: lleva
                un enlace al portal, donde el propietario ve el recibo al día y se lo baja él
                mismo. Un adjunto se queda viejo en cuanto el propietario paga.
              </p>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   LOGO DE LA ADMINISTRADORA
   Los colores de Vecitap no se configuran: los fija el manual de
   marca. Lo que sí es del cliente es su logo, que va en el recibo
   impreso y en el estado de cuenta que recibe el propietario.
   ══════════════════════════════════════════════════════════════ */
function LogoOrg({ sb, org, notificar, fallo, cargarOrgs }) {
  const [logo, setLogo] = useState(org.logo_url || "");
  const [ocupado, setOcupado] = useState(false);

  const subirLogo = async (file) => {
    if (!file) return;
    try { setLogo(await redimensionarLogo(file)); }
    catch (e) { fallo(e); }
  };

  const guardar = async () => {
    setOcupado(true);
    const { error } = await sb.from("organizaciones")
      .update({ logo_url: logo || null }).eq("id", org.id);
    setOcupado(false);
    if (error) return fallo(error);
    notificar("Logo guardado."); cargarOrgs();
  };

  return (
    <Tarjeta>
      <Titulo sub="Aparece en el recibo impreso y en el estado de cuenta que recibe el propietario.">
        Logo de la administradora
      </Titulo>
      <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))" }}>
        <Campo label="Archivo" ayuda="Se reduce a 320 px de ancho. PNG o JPG.">
          <input type="file" accept="image/*" onChange={(e) => subirLogo(e.target.files?.[0])}
            style={{ ...estiloEntrada(false), padding: 9 }} />
        </Campo>
        <Campo label="Vista previa">
          <div style={{ padding: 12, borderRadius: T.rs, background: T.fondo,
            border: `1px solid ${T.linea}`, minHeight: 58,
            display: "flex", alignItems: "center", gap: 10 }}>
            {logo
              ? <img src={logo} alt="" style={{ maxHeight: 34, maxWidth: 150 }} />
              : <span style={{ fontSize: 12.5, color: T.tenue }}>Sin logo cargado</span>}
            <span style={{ fontFamily: "Poppins", fontWeight: 600, fontSize: 13 }}>{org.nombre}</span>
          </div>
        </Campo>
      </div>
      <div className="flex gap-2" style={{ marginTop: 16 }}>
        <Boton disabled={ocupado} onClick={guardar}>Guardar logo</Boton>
        {logo && <Boton tono="suave" disabled={ocupado} onClick={() => setLogo("")}>Quitar</Boton>}
      </div>
    </Tarjeta>
  );
}

/* ══════════════════════════════════════════════════════════════
   AJUSTES
   ══════════════════════════════════════════════════════════════ */
function Ajustes({ sb, org, edificio, notificar, fallo, recargar, recargarEdificios, cargarOrgs }) {
  const [e, setE] = useState({ nombre: edificio.nombre, rif: edificio.rif || "",
    direccion: edificio.direccion || "", prefijo: edificio.prefijo_recibo,
    mora: String(edificio.interes_mora), tolerancia: String(edificio.tolerancia_alicuota),
    redondeo: String(edificio.tolerancia_redondeo ?? 0.5) });
  const [cats, setCats] = useState([]);
  const [nuevaCat, setNuevaCat] = useState("");
  const [pegado, setPegado] = useState("");
  const [catPorOmision, setCatPorOmision] = useState("");
  const [nuevoEd, setNuevoEd] = useState(false);
  const [ocupado, setOcupado] = useState(false);

  const cargarCats = async () => {
    const { data, error } = await sb.from("categorias")
      .select("id,nombre,orden,partidas_fijas(id,concepto,referencia,monto,orden)")
      .eq("edificio_id", edificio.id).order("orden");
    if (error) return fallo(error);
    // El orden de las partidas se acomoda aquí: la consulta anidada no
    // garantiza el orden de lo que trae dentro.
    setCats((data || []).map((c) => ({ ...c,
      partidas_fijas: [...(c.partidas_fijas || [])]
        .sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0)) })));
  };
  useEffect(() => { cargarCats(); setE({ nombre: edificio.nombre, rif: edificio.rif || "",
    direccion: edificio.direccion || "", prefijo: edificio.prefijo_recibo,
    mora: String(edificio.interes_mora), tolerancia: String(edificio.tolerancia_alicuota),
    redondeo: String(edificio.tolerancia_redondeo ?? 0.5) });
  }, [edificio.id]);

  const guardarEdificio = async () => {
    setOcupado(true);
    const { error } = await sb.from("edificios").update({
      nombre: e.nombre.trim(), rif: e.rif.trim() || null, direccion: e.direccion.trim() || null,
      prefijo_recibo: e.prefijo.trim().toUpperCase(), interes_mora: num0(e.mora),
      tolerancia_alicuota: num0(e.tolerancia) || 0.01,
      tolerancia_redondeo: num0(e.redondeo) }).eq("id", edificio.id);
    setOcupado(false);
    if (error) return fallo(error);
    notificar("Edificio actualizado."); recargarEdificios(edificio.id);
  };

  const agregarCat = async (texto) => {
    // Acepta varias de una vez: pegar una columna de Excel crea todas.
    const nombres = String(texto ?? nuevaCat)
      .split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
    if (!nombres.length) return;
    const filas = nombres.map((nombre, i) => ({ org_id: org.id,
      edificio_id: edificio.id, nombre, orden: cats.length + 1 + i }));
    const { error } = await sb.from("categorias").insert(filas);
    if (error) return fallo(error);
    setNuevaCat("");
    notificar(nombres.length === 1 ? "Categoría agregada."
              : `${nombres.length} categorías agregadas.`);
    cargarCats();
  };

  /* ── Pegar desde Excel ──────────────────────────────────────────
     Se acepta lo que sale de una hoja de cálculo tal cual: columnas
     separadas por tabulación. También punto y coma, barra vertical, o
     dos espacios seguidos, que es lo que queda al copiar de un PDF.

     El monto es la última columna que sea un número. Lo que queda
     delante se reparte según cuántas columnas haya, y lo entendido se
     muestra antes de guardar nada: nadie carga a ciegas 40 partidas. */
  const partir = (l) =>
    l.includes("\t") ? l.split("\t")
    : l.includes(";") ? l.split(";")
    : l.includes("|") ? l.split("|")
    : l.split(/\s{2,}/);

  const leido = useMemo(() => {
    return String(pegado || "").split(/\r?\n/).map((linea) => {
      const l = linea.trim();
      if (!l) return null;
      const cols = partir(l).map((c) => c.trim());
      const ultimo = cols[cols.length - 1] || "";
      const monto = num(ultimo.replace(/[^0-9.,\-]/g, ""));
      let campos = monto === null ? cols.slice() : cols.slice(0, -1);
      while (campos.length && campos[campos.length - 1] === "") campos.pop();

      // Una sola columna sin monto es el nombre de una categoría
      if (monto === null && campos.length <= 1) {
        return { tipo: "categoria", categoria: campos[0] || "", monto: null };
      }
      let categoria = "", concepto = "", referencia = "";
      if (campos.length >= 3)      [categoria, concepto, referencia] = campos;
      else if (campos.length === 2) [categoria, concepto] = campos;
      else                          concepto = campos[0] || "";
      return { tipo: "partida", categoria, concepto, referencia, monto: monto ?? 0 };
    }).filter(Boolean);
  }, [pegado]);

  const catPorNombre = (nombre) =>
    cats.find((c) => c.nombre.trim().toLowerCase() === String(nombre).trim().toLowerCase());

  const problemas = leido.filter((r) => r.tipo === "partida"
    && !r.categoria && !catPorOmision).length;

  const guardarPegado = async () => {
    if (!leido.length) return notificar("No hay nada que cargar.", "error");
    if (problemas) return notificar(
      "Hay filas sin categoría. Elija una categoría por omisión o agréguela a la fila.", "error");

    setOcupado(true);
    try {
      // 1) crear las categorías que no existan
      const faltan = [];
      leido.forEach((r) => {
        const nombre = r.tipo === "categoria" ? r.categoria : r.categoria;
        if (!nombre) return;
        if (catPorNombre(nombre)) return;
        if (faltan.some((x) => x.toLowerCase() === nombre.toLowerCase())) return;
        faltan.push(nombre);
      });
      if (faltan.length) {
        const { error } = await sb.from("categorias").insert(
          faltan.map((nombre, i) => ({ org_id: org.id, edificio_id: edificio.id,
            nombre, orden: cats.length + 1 + i })));
        if (error) throw error;
      }

      // 2) releer para tener los identificadores nuevos
      const { data: frescas, error: e2 } = await sb.from("categorias")
        .select("id,nombre").eq("edificio_id", edificio.id);
      if (e2) throw e2;
      const porNombre = new Map((frescas || []).map((c) =>
        [c.nombre.trim().toLowerCase(), c.id]));

      // 3) insertar las partidas
      const partidas = leido.filter((r) => r.tipo === "partida").map((r, i) => ({
        org_id: org.id,
        orden: (i + 1) * 10,
        categoria_id: porNombre.get(String(r.categoria || "").trim().toLowerCase())
                      || catPorOmision,
        concepto: r.concepto || "Sin concepto",
        referencia: r.referencia || null,
        monto: r.monto || 0,
      }));
      if (partidas.length) {
        const { error } = await sb.from("partidas_fijas").insert(partidas);
        if (error) throw error;
      }
      setPegado("");
      notificar(`${faltan.length} categorías y ${partidas.length} partidas cargadas.`);
      cargarCats();
    } catch (err) { fallo(err); }
    setOcupado(false);
  };

  const agregarPartida = async (catId) => {
    const cat = cats.find((c) => c.id === catId);
    const ultimo = Math.max(0, ...(cat?.partidas_fijas || []).map((p) => p.orden || 0));
    const { error } = await sb.from("partidas_fijas").insert({ org_id: org.id,
      categoria_id: catId, concepto: "", referencia: null, monto: 0,
      orden: ultimo + 10 });
    if (error) return fallo(error);
    cargarCats();
  };

  const mover = async (fn, id, arriba) => {
    const { error } = await sb.rpc(fn, { p_id: id, p_arriba: arriba });
    if (error) return fallo(error);
    cargarCats();
  };

  const editarPartida = async (id, campos) => {
    const { error } = await sb.from("partidas_fijas").update(campos).eq("id", id);
    if (error) return fallo(error);
    cargarCats();
  };

  const borrarPartida = async (id) => {
    const { error } = await sb.from("partidas_fijas").delete().eq("id", id);
    if (error) return fallo(error);
    cargarCats();
  };

  return (
    <div className="grid gap-5" style={{ maxWidth: 860 }}>
      <LogoOrg sb={sb} org={org} notificar={notificar} fallo={fallo} cargarOrgs={cargarOrgs} />
      <Tarjeta>
        <Titulo sub="El prefijo debe ser único dentro de la administradora: es lo que distingue el recibo de un edificio del de otro."
          accion={<Boton size="s" tipo="suave" onClick={() => setNuevoEd(true)}>
            <Ic n="Plus" size={14} /> Otro edificio</Boton>}>
          Datos del edificio
        </Titulo>
        <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))" }}>
          <Campo label="Nombre"><Entrada value={e.nombre}
            onChange={(x) => setE({ ...e, nombre: x.target.value })} /></Campo>
          <Campo label="RIF"><Entrada mono value={e.rif}
            onChange={(x) => setE({ ...e, rif: x.target.value })} /></Campo>
          <Campo label="Prefijo del recibo"><Entrada mono value={e.prefijo}
            onChange={(x) => setE({ ...e, prefijo: x.target.value })} /></Campo>
          <Campo label="Interés de mora mensual %"
            ayuda="Se calcula sobre todo el saldo previo de condominio, así que el interés del mes pasado también genera interés.">
            <Entrada mono value={e.mora} onChange={(x) => setE({ ...e, mora: x.target.value })} />
          </Campo>
          <Campo label="Tolerancia de alícuotas">
            <Entrada mono value={e.tolerancia}
              onChange={(x) => setE({ ...e, tolerancia: x.target.value })} />
          </Campo>
          <Campo label="Perdón de centavos USD"
            ayuda="Al cerrar el mes, una deuda menor a este monto se perdona sola y queda como ajuste con su motivo. En 0 queda apagado.">
            <Entrada mono value={e.redondeo}
              onChange={(x) => setE({ ...e, redondeo: x.target.value })} />
          </Campo>
          <div style={{ gridColumn: "1 / -1" }}>
            <Campo label="Dirección"><Entrada value={e.direccion}
              onChange={(x) => setE({ ...e, direccion: x.target.value })} /></Campo>
          </div>
        </div>
        <div style={{ marginTop: 16 }}>
          <Boton disabled={ocupado} onClick={guardarEdificio}>Guardar</Boton>
        </div>
      </Tarjeta>

      <Tarjeta>
        <Titulo sub="Los gastos que se repiten todos los meses. Al abrir un mes entran solos con su monto, y ahí se ajusta lo que haya cambiado.">
          Categorías y partidas fijas
        </Titulo>

        {cats.map((c) => (
          <div key={c.id} style={{ borderTop: `1px solid ${T.linea}`, paddingTop: 14, marginTop: 14 }}>
            <div className="flex items-center justify-between gap-2 flex-wrap" style={{ marginBottom: 10 }}>
              <div className="flex items-center gap-1">
                <Flechas onSubir={() => mover("mover_categoria", c.id, true)}
                         onBajar={() => mover("mover_categoria", c.id, false)} />
                <span style={{ fontWeight: 600, fontSize: 14 }}>{c.nombre}</span>
              </div>
              <Boton size="s" tipo="suave" onClick={() => agregarPartida(c.id)}>
                <Ic n="Plus" size={13} /> Partida
              </Boton>
            </div>
            {(c.partidas_fijas || []).map((p) => (
              <div key={p.id} className="fila-partida" style={{ marginBottom: 8 }}>
                <Flechas onSubir={() => mover("mover_partida", p.id, true)}
                         onBajar={() => mover("mover_partida", p.id, false)} />
                <Entrada defaultValue={p.concepto} placeholder="Concepto"
                  onBlur={(x) => x.target.value !== p.concepto &&
                    editarPartida(p.id, { concepto: x.target.value })} />
                <Entrada mono defaultValue={p.referencia || ""} placeholder="Referencia"
                  onBlur={(x) => x.target.value !== (p.referencia || "") &&
                    editarPartida(p.id, { referencia: x.target.value || null })} />
                <Entrada mono defaultValue={String(p.monto)} placeholder="0,00"
                  style={{ textAlign: "right" }}
                  onBlur={(x) => num0(x.target.value) !== Number(p.monto) &&
                    editarPartida(p.id, { monto: num0(x.target.value) })} />
                <button onClick={() => borrarPartida(p.id)}
                  style={{ border: "none", background: "transparent", cursor: "pointer", color: T.tenue }}>
                  <Ic n="Trash2" size={15} />
                </button>
              </div>
            ))}
            {(c.partidas_fijas || []).length === 0 && (
              <p style={{ fontSize: 12.5, color: T.tenue }}>Sin partidas fijas.</p>
            )}
          </div>
        ))}

        <div style={{ borderTop: `1px solid ${T.linea}`, paddingTop: 14, marginTop: 14 }}
          className="flex gap-2 flex-wrap items-end">
          <Campo label="Nueva categoría"
            ayuda="Puede pegar varias de una vez, una por línea." ancho="260px">
            <Entrada value={nuevaCat} onChange={(x) => setNuevaCat(x.target.value)}
              onPaste={(x) => {
                const t = x.clipboardData.getData("text");
                if (!/\r?\n/.test(t.trim())) return;   // una sola: comportamiento normal
                x.preventDefault();
                agregarCat(t);
              }}
              placeholder="Servicios" />
          </Campo>
          <Boton tipo="suave" onClick={() => agregarCat()}>Agregar</Boton>
        </div>
      </Tarjeta>

      {/* ── Carga masiva desde una hoja de cálculo ───────────────── */}
      <Tarjeta>
        <Titulo sub="Copie las filas en Excel o Google Sheets y péguelas aquí. Antes de guardar nada se muestra lo que el sistema entendió.">
          Pegar categorías y partidas
        </Titulo>

        <div style={{ fontSize: 12.5, color: T.tinta2, lineHeight: 1.6, marginBottom: 10 }}>
          El orden de las columnas es <b>Categoría · Concepto · Referencia · Monto</b>.
          Puede pegar menos columnas:
          <div className="mono" style={{ fontSize: 12, color: T.tenue, marginTop: 6,
            background: T.fondo, padding: "10px 12px", borderRadius: T.rs,
            whiteSpace: "pre", overflowX: "auto" }}>
{`Servicios      Electricidad   Corpoelec   1.240,50
Servicios      Agua           Hidroven      380,00
Personal       Conserje                    1.500,00
Mantenimiento`}
          </div>
          La última columna que sea un número se toma como el monto. Una línea sola,
          sin monto, se toma como una categoría nueva.
        </div>

        <textarea rows={7} value={pegado} onChange={(x) => setPegado(x.target.value)}
          placeholder="Pegue aquí…"
          style={{ width: "100%", fontFamily: "'JetBrains Mono', ui-monospace, monospace",
            fontSize: 13, padding: "11px 12px", borderRadius: T.rs,
            border: `1px solid ${T.lineaFuerte}`, background: "#fff",
            color: T.tinta, resize: "vertical" }} />

        {leido.length > 0 && (
          <>
            <div className="flex gap-3 items-end flex-wrap" style={{ marginTop: 14 }}>
              <Campo label="Categoría para las filas que no la traigan" ancho="260px">
                <Selector value={catPorOmision}
                  onChange={(x) => setCatPorOmision(x.target.value)}>
                  <option value="">Ninguna</option>
                  {cats.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                </Selector>
              </Campo>
              <Boton disabled={ocupado || problemas > 0} onClick={guardarPegado}>
                Cargar {leido.filter((r) => r.tipo === "partida").length} partidas
              </Boton>
            </div>

            {problemas > 0 && (
              <p style={{ fontSize: 12.5, color: T.rojo, marginTop: 8 }}>
                {problemas} filas no dicen a qué categoría van. Elija una arriba o
                agregue la categoría como primera columna.
              </p>
            )}

            <div className="scroll-x" style={{ marginTop: 12, maxHeight: 320 }}>
              <table>
                <thead><tr><th>Categoría</th><th>Concepto</th><th>Referencia</th>
                  <th style={{ textAlign: "right" }}>Monto</th><th>Qué se va a hacer</th></tr></thead>
                <tbody>
                  {leido.map((r, i) => {
                    const existe = r.categoria ? catPorNombre(r.categoria) : null;
                    const sinCat = r.tipo === "partida" && !r.categoria && !catPorOmision;
                    return (
                      <tr key={i} style={{ background: sinCat ? "#FBEBE8" : "transparent" }}>
                        <td>{r.categoria || <span style={{ color: T.tenue }}>—</span>}</td>
                        <td>{r.tipo === "categoria" ? "" : r.concepto}</td>
                        <td className="mono" style={{ fontSize: 12 }}>{r.referencia || ""}</td>
                        <td className="mono" style={{ textAlign: "right" }}>
                          {r.tipo === "categoria" ? "" : usd(r.monto)}</td>
                        <td style={{ fontSize: 12, color: sinCat ? T.rojo : T.tinta2 }}>
                          {sinCat ? "falta la categoría"
                            : r.tipo === "categoria"
                              ? (existe ? "la categoría ya existe" : "categoría nueva")
                              : (existe || !r.categoria ? "partida" : "partida · crea la categoría")}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </>
        )}
      </Tarjeta>

      {nuevoEd && <NuevoEdificio {...{ sb, org, notificar, fallo, recargarEdificios }}
        onCerrar={() => setNuevoEd(false)} />}
    </div>
  );
}

function NuevoEdificio({ sb, org, notificar, fallo, recargarEdificios, onCerrar }) {
  const [f, setF] = useState({ nombre: "", prefijo: "", mora: "0", tolerancia: "0,01" });
  const crear = async () => {
    if (!f.nombre.trim() || !f.prefijo.trim())
      return notificar("Hacen falta el nombre y el prefijo.", "error");
    const { data, error } = await sb.from("edificios").insert({
      org_id: org.id, nombre: f.nombre.trim(), prefijo_recibo: f.prefijo.trim().toUpperCase(),
      interes_mora: num0(f.mora), tolerancia_alicuota: num0(f.tolerancia) || 0.01,
      honorario_monto: 0 }).select("id").single();
    if (error) return fallo(error);
    notificar("Edificio creado."); onCerrar(); recargarEdificios(data.id);
  };
  return (
    <div onClick={onCerrar} style={{ position: "fixed", inset: 0, zIndex: 90,
      background: "rgba(7,12,28,.55)", display: "flex", alignItems: "center",
      justifyContent: "center", padding: 20 }}>
      <div onClick={(x) => x.stopPropagation()} style={{ background: T.lienzo,
        borderRadius: T.r, maxWidth: 500, width: "100%", boxShadow: T.sombraAlta, padding: 26 }}>
        <Titulo sub="Cada edificio lleva sus propias unidades, sus cobros y su numeración de recibos.">
          Otro edificio
        </Titulo>
        <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
          <div style={{ gridColumn: "1 / -1" }}>
            <Campo label="Nombre"><Entrada value={f.nombre}
              onChange={(x) => setF({ ...f, nombre: x.target.value })} /></Campo>
          </div>
          <Campo label="Prefijo del recibo"><Entrada mono value={f.prefijo}
            onChange={(x) => setF({ ...f, prefijo: x.target.value })} placeholder="CON2" /></Campo>
          <Campo label="Interés de mora %"><Entrada mono value={f.mora}
            onChange={(x) => setF({ ...f, mora: x.target.value })} /></Campo>
        </div>
        <div className="flex gap-2 justify-end mt-5">
          <Boton tipo="suave" onClick={onCerrar}>Cancelar</Boton>
          <Boton onClick={crear}>Crear</Boton>
        </div>
      </div>
    </div>
  );
}
